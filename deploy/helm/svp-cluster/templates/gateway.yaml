{{- /* Gateway svp (GatewayClass svp) in svp-edge, the single entry point, with the HTTPS listeners on 443 of value
listeners (templates/_helpers.tpl): by default https for *.svp.localhost and https-apex for svp.localhost. Each serves a
certificate naming its own hostnames only: one for both would let a browser reuse a connection to svp.localhost for
s3.svp.localhost (RFC 9113 9.1.1), where no route of the apex listener matches. No operations UI is ever routed. */}}
{{- $service := .Values.envoy.service }}
# Settings of the Envoy proxy fleet of this class. externalTrafficPolicy Cluster instead of Envoy Gateway's default
# Local: k3d's load balancer spreads connections over both nodes, and with Local the servicelb pod of the node without an
# Envoy pod would have nowhere to send them. The client address is lost on the way anyway (k3d's load balancer and
# servicelb both proxy or masquerade), so Cluster costs nothing.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: svp
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        {{- with $service.type }}
        type: {{ . }}
        {{- end }}
        {{- with $service.name }}
        name: {{ . }}
        {{- end }}
        externalTrafficPolicy: {{ .Values.envoy.service.externalTrafficPolicy }}
      # Two replicas at least, so losing a node or a zone never takes the only entry point with it; no
      # envoyDeployment.replicas beside it, the HPA alone owns the count. CPU is a share of the request below.
      envoyHpa:
        minReplicas: 2
        maxReplicas: 4
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 60
      # A drain or a node replacement evicts one pod at a time while another one serves.
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        pod:
          # Zones first, then nodes. ScheduleAnyway: with a zone or a node short of room the pod still starts
          # elsewhere instead of staying Pending; k3d's nodes have no zone label, so only the second applies there.
          topologySpreadConstraints:
            {{- range list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
            - maxSkew: 1
              topologyKey: {{ . }}
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: svp
                  gateway.envoyproxy.io/owning-gateway-namespace: svp-edge
            {{- end }}
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # About 150 MiB expected with the shutdown manager; the limit turns a leak into an
              # OOM kill of this pod instead of memory taken from the node's other pods.
              memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: svp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: svp
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: svp
  namespace: svp-edge
spec:
  gatewayClassName: svp
  listeners:
    {{- range include "svp-cluster.listeners" . | fromYamlArray }}
    - name: {{ .name }}
      protocol: HTTPS
      port: 443
      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .secretName }}
      # Routes attach only from namespaces labelled svp-gateway-routes=true (svp, svp-data): a chart in any other
      # namespace cannot publish a backend on the entry point by itself.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              svp-gateway-routes: "true"
    {{- end }}
{{- with .Values.envoy.targetGroupArn }}
{{- if not $service.name }}
{{- fail "envoy.service.name: required with envoy.targetGroupArn, the Service TargetGroupBinding svp-envoy points at" }}
{{- end }}
---
# AWS Load Balancer Controller registers the address and port of every ready Envoy pod behind the Service's 443 (10443)
# in the target group, and takes a pod out once it stops being ready. No networking block: the controller changes no
# security group; the rules from the load balancer to the nodes come from where the target group is made.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: svp-envoy
  namespace: envoy-gateway-system
spec:
  targetGroupARN: {{ . | quote }}
  targetType: ip
  serviceRef:
    name: {{ $service.name }}
    port: 443
{{- end }}
