# Example cluster map for svp-root on eks; deploy/ci/gitops-check.sh indents this file into rendered YAML.
# Every key of the contract is required here with placeholder values naming nothing real.
# Design notes: docs/reference/ci.md.
name: svp-stg
region: ap-southeast-1
vpcId: vpc-00000000000000000
vpcCidr: 10.0.0.0/16
serviceCidr: 172.20.0.0/16
dbCidrs:
  - 10.0.48.0/24
  - 10.0.49.0/24
domain: stg.svp.example
# Target group of the internal ALB in front of Envoy, and the CIDRs of its edge subnets.
edgeTargetGroupArn: arn:aws:elasticloadbalancing:ap-southeast-1:000000000000:targetgroup/svp-stg-envoy/0000000000000000
edgeCidrs:
  - 10.0.240.0/23
  - 10.0.242.0/23
rdsAddress: svp-stg.000000000000.ap-southeast-1.rds.amazonaws.com
uploadsBucket: svp-stg-uploads-000000000000-ap-southeast-1
mediaBucket: svp-stg-media-000000000000-ap-southeast-1
mediaDomain: d000000000000.cloudfront.net
s3Cidrs:
  - 198.51.100.0/24
  - 203.0.113.0/24
# Bootstrap brokers of Amazon MSK (host:9096 per broker, comma separated) and the primary endpoint of ElastiCache.
kafkaBrokers: b-1.svp-stg.kafka.example:9096,b-2.svp-stg.kafka.example:9096
valkeyHost: master.svp-stg.cache.example
# Host of the env's private ECR registry, from the root env output of the registry module.
ecrRegistry: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com
# Workspace of Amazon Managed Service for Prometheus; its endpoint is the base of remote write and query.
ampWorkspaceId: ws-00000000-0000-0000-0000-000000000000
ampEndpoint: https://aps-workspaces.ap-southeast-1.amazonaws.com/workspaces/ws-00000000-0000-0000-0000-000000000000/
# Log group of the application telemetry, from the root env output of the observability module.
logGroup: /svp/stg/otel
# Grafana managed workspace URL without a trailing slash, from the root env output of the observability module.
grafanaUrl: https://g-0000000000.grafana-workspace.ap-southeast-1.amazonaws.com
# SNS topic that the alarms module of the root env publishes to.
alarmTopicArn: arn:aws:sns:ap-southeast-1:000000000000:svp-stg-alarms
# Required map: IAM roles assumed by SecretStore of each namespace (svp, svp-data, svp-obs, keda, argocd).
externalSecretsRoles:
  svp: arn:aws:iam::111111111111:role/svp-stg-external-secrets-svp
  svp-data: arn:aws:iam::111111111111:role/svp-stg-external-secrets-svp-data
  svp-obs: arn:aws:iam::111111111111:role/svp-stg-external-secrets-svp-obs
  keda: arn:aws:iam::111111111111:role/svp-stg-external-secrets-keda
  argocd: arn:aws:iam::111111111111:role/svp-stg-external-secrets-argocd
