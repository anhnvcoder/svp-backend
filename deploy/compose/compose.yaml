# Core stack: gateway, user-service, video-service, engagement-service, feed-service and their one-shot migrations,
# Kafka and Valkey with their one-shot tls-init and kafka-init, the object store `s3` (RustFS) with its init container,
# and the web client `web`. Run it through `make up` / `make down` (deploy/compose/compose.mk), which pass --env-file
# .env.

# Profiles: `core` is the application. `obs` (`make up OBS=lgtm`) adds otelcol, lgtm, alertmanager and glitchtip
# with its one-shot glitchtip-init; no core service depends on an obs service. Every Go service sends OTLP to
# otelcol:4317 whether or not `obs` runs: without it export fails with a rate-limited WARN and the services work as
# before.

# `obs-elastic` (`make up OBS=elastic`) is the Elastic stack, kept only to compare with LGTM, instead of `obs`, never
# with it.

# Postgres is the native one on the host (127.0.0.1:5432), reached as host.docker.internal. Kafka and Valkey run the
# software of Amazon MSK and ElastiCache for Valkey and are reached the way stg and prd reach those: Kafka with
# SASL/SCRAM-SHA-512 over TLS on kafka:9096, Valkey over TLS on valkey:6379, each client with a user of its own whose
# ACLs allow only its topics and groups, or its Redis db and key prefix.

# Their certificate is signed by the local CA of `make env` (.local/ca/), which the clients trust from
# /etc/svp-ca/ca.crt. Neither publishes a port: scripts on the host reach them only through the wrappers of deploy/ops/
# run inside their containers.

# Published ports are on the host's loopback only. gRPC ports stay inside the compose network (threat model IN-2); so do
# the Collector (4317) and LGTM's Prometheus (9090), Tempo (3200), Loki (3100) and Pyroscope (4040), reached from the
# host through Grafana's datasource proxy.

# Networks: `default` holds everything but media-worker and web; `worker` (internal, no route out) holds media-worker,
# Kafka, the object store and the Collector only, so the worker that runs ffmpeg on uploaded files reaches neither
# the gateway, the gRPC services, Postgres, LGTM nor the internet (threat model FF-4, FF-5). The Collector only
# receives telemetry there; it proxies nothing for the worker.

# `web` holds web, the gateway, Valkey and, with `obs`, GlitchTip and the Collector only: code run in the Next server
# (CVE-2025-55182) reaches the gateway's HTTP API, Valkey (where its user may touch only db 9 and svp:web:*), the error
# tracker and the Collector and nothing else in the stack: not the gRPC services, which check the caller's access token
# but not which container calls them, nor Kafka or the object store by their compose names.

# `web` is not internal: Docker publishes no port of a container attached to internal networks only. web gets no
# host.docker.internal entry, but Docker Desktop resolves that name in every container, which opens the host's loopback
# ports to it (the object store's 9000, Postgres with its trust rule, with `obs` Grafana, Alertmanager, GlitchTip).
# Accepted for the compose lab (threat model WEB-13); the k3d release closes it with NetworkPolicy.

# Design notes: docs/reference/compose.md.
name: svp

x-healthcheck: &healthcheck
  # Distroless has no shell or curl: the binary checks itself.
  test: ["CMD", "/app", "healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 20s
  start_interval: 1s

x-host-services: &host-services
  # Reaches Postgres on the host. Docker Desktop provides host.docker.internal; this line makes it
  # work on Linux too.
  extra_hosts: ["host.docker.internal:host-gateway"]

# Telemetry settings of every Go service and of web.
# Only `make up OBS=off` sets SVP_OTEL_SDK_DISABLED, SVP_PYROSCOPE_SERVER_ADDRESS (empty) and an
# empty SENTRY_DSN, to measure the services with telemetry off; do not set them in .env.
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_SDK_DISABLED: ${SVP_OTEL_SDK_DISABLED:-false}

# The five services on the `default` network also push profiles to LGTM's Pyroscope and report
# errors to the tracker at SENTRY_DSN (empty: off). media-worker gets neither: its network reaches
# only the Collector.
x-telemetry-app-env: &telemetry-app-env
  <<: *telemetry-env
  PYROSCOPE_SERVER_ADDRESS: ${SVP_PYROSCOPE_SERVER_ADDRESS-http://lgtm:4040}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}

# Kafka 4.1, the line of MSK's Standard brokers, and the Valkey of chart svp-data.
x-kafka-image: &kafka-image apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
x-valkey-image: &valkey-image docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
x-s3-image: &s3-image rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
x-glitchtip-image: &glitchtip-image glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6

# The local CA's certificate (public), for every client of Kafka and Valkey: Go reads the files of SSL_CERT_DIR beside
# the system roots, Node NODE_EXTRA_CA_CERTS, the Kafka tools and valkey-cli SVP_CA_FILE. `make env` writes it; a
# missing file stops compose instead of becoming an empty directory.
x-ca-volume: &ca-volume
  type: bind
  source: ../../.local/ca/ca.crt
  target: /etc/svp-ca/ca.crt
  read_only: true
  bind:
    create_host_path: false

# The wrappers of deploy/ops/ (svp-kafka, svp-valkey), at /opt/svp/bin of the kafka and valkey containers.
x-ops-volume: &ops-volume ../ops:/opt/svp/bin:ro

# Settings shared by `glitchtip` and `glitchtip-init`. Database svp_glitchtip on the native Postgres: the app role for
# requests and tasks, the migrator role (MAINTENANCE_*) for migrations, the cache table and partitions. VALKEY_URL is
# empty on purpose: queue, cache and sessions live in Postgres; left out, it would default to redis://redis:6379/0. Only
# error tracking is on, with no self-registration, no SMTP and no SENTRY_DSN, so GlitchTip does not report on itself.
x-glitchtip-env: &glitchtip-env
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?run make env}
  DATABASE_URL: postgres://svp_glitchtip_app:${SVP_GLITCHTIP_APP_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_glitchtip?sslmode=disable
  MAINTENANCE_DATABASE_URL: postgres://svp_glitchtip_migrator:${SVP_GLITCHTIP_MIGRATOR_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_glitchtip?sslmode=disable
  VALKEY_URL: ""
  # DSNs it hands out name the host's loopback address; `make glitchtip-init` rewrites the one the
  # Go services get to glitchtip:8000. The service name, the host and the healthcheck's localhost
  # are the only Host headers it answers.
  GLITCHTIP_DOMAIN: http://127.0.0.1:8000
  ALLOWED_HOSTS: glitchtip,127.0.0.1,localhost
  DEBUG: "false"
  ENABLE_USER_REGISTRATION: "false"
  EMAIL_URL: consolemail://
  GLITCHTIP_ENABLE_UPTIME: "false"
  GLITCHTIP_ENABLE_LOGS: "false"
  GLITCHTIP_ENABLE_DUCKDB: "false"
  ENABLE_OBSERVABILITY_API: "false"
  SENTRY_DSN: ""
  GLITCHTIP_RETENTION_DAYS: "14"
  VTASKS_CONCURRENCY: "2"
  DATABASE_POOL_MAX_SIZE: "4"

services:
  # Puts the server certificate and key of the local CA, and Valkey's ACL file, into volume svp-tls, owned by the user
  # of the server that reads each, key and ACL file mode 0400: the files of .local/ are the host user's and mode 600, so
  # bind-mounted they would be unreadable to those users on Linux (Docker Desktop on macOS would show them to anyone).
  # Root only for chown; no network, only the capabilities that reading and chown need.

  # The uid:gid come from the images: apache/kafka runs as appuser 1000:1000 (docker/jvm/Dockerfile of Apache Kafka),
  # valkey/valkey as valkey 999:1000 (the user its Alpine Dockerfile adds); `docker image inspect` and `id` agree.
  tls-init:
    profiles: [core]
    image: *valkey-image
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        cat /in/ca/server.key /in/ca/server.crt >/tmp/kafka.pem
        install -o 1000 -g 1000 -m 0400 /tmp/kafka.pem /out/kafka.pem
        install -o 999 -g 1000 -m 0444 /in/ca/server.crt /out/valkey.crt
        install -o 999 -g 1000 -m 0400 /in/ca/server.key /out/valkey.key
        install -o 999 -g 1000 -m 0400 /in/valkey/users.acl /out/valkey-users.acl
        echo "tls-init: kafka.pem, valkey.crt, valkey.key and valkey-users.acl in place"
    volumes:
      - type: bind
        source: ../../.local/ca
        target: /in/ca
        read_only: true
        bind:
          create_host_path: false
      # Written by `make up` (deploy/valkey/aclfile.sh) from the passwords in .env.
      - type: bind
        source: ../../.local/valkey
        target: /in/valkey
        read_only: true
        bind:
          create_host_path: false
      - svp-tls:/out
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    restart: "no"

  # The one Kafka broker (KRaft), started by deploy/kafka/broker.sh with deploy/kafka/server.properties: SASL_SSL with
  # SCRAM-SHA-512 on kafka:9096 for clients, ACLs on, no auto-create; svp-admin is made when the storage is first
  # formatted, every other user by kafka-init. No port published: on the host, scripts run
  # `docker compose exec kafka /opt/svp/bin/svp-kafka ...`, which logs in as svp-admin with the variables below.
  kafka:
    profiles: [core]
    image: *kafka-image
    entrypoint: ["/opt/svp/kafka/broker.sh"]
    environment:
      SVP_KAFKA_ADVERTISED: kafka:9096
      # Used only when the volume kafka-data is formatted; any base64 UUID (kafka-storage.sh random-uuid).
      SVP_KAFKA_CLUSTER_ID: XNgX61z_SZ-bElfllYNeIg
      SVP_KAFKA_ADMIN_PASSWORD: ${SVP_KAFKA_ADMIN_PASSWORD:?run make env}
      # The broker's heap; with the JVM's other memory and a tool run by svp-kafka (its own 256 MiB heap) it stays
      # within mem_limit on the 16 GB machine.
      SVP_KAFKA_HEAP: 512m
      # For /opt/svp/bin/svp-kafka.
      KAFKA_BROKERS: kafka:9096
      SVP_CA_FILE: /etc/svp-ca/ca.crt
    mem_limit: 1536m
    cpus: 1
    networks: [default, worker]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ../kafka:/opt/svp/kafka:ro
      - *ops-volume
      - svp-tls:/etc/svp-tls:ro
      - *ca-volume
    # broker.sh writes its configuration under /tmp, and the broker and tools log to stdout only. Not noexec: the
    # compression libraries unpack their native code into /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The client listener accepts connections; kafka-init then proves that svp-admin logs in.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9096"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully

  # Topics, users and ACLs (deploy/kafka/kafka-init.sh, the same script as Job kafka-init of chart svp-data), as
  # svp-admin through /opt/svp/bin/svp-kafka. Every service with Kafka starts after it succeeds.
  kafka-init:
    profiles: [core]
    image: *kafka-image
    entrypoint: ["/bin/bash", "/opt/svp/kafka/kafka-init.sh"]
    environment:
      KAFKA_BROKERS: kafka:9096
      SVP_CA_FILE: /etc/svp-ca/ca.crt
      SVP_KAFKA_ADMIN_PASSWORD: ${SVP_KAFKA_ADMIN_PASSWORD:?run make env}
      # This broker keeps its users, so the script creates them.
      SVP_KAFKA_CREATE_USERS: "true"
      # The broker is healthy before this starts, so a login that keeps failing is a wrong password, not a slow broker.
      SVP_KAFKA_LOGIN_WAIT_SECONDS: "60"
      SVP_KAFKA_USER_SERVICE_PASSWORD: ${SVP_KAFKA_USER_SERVICE_PASSWORD:?run make env}
      SVP_KAFKA_VIDEO_SERVICE_PASSWORD: ${SVP_KAFKA_VIDEO_SERVICE_PASSWORD:?run make env}
      SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD: ${SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD:?run make env}
      SVP_KAFKA_FEED_SERVICE_PASSWORD: ${SVP_KAFKA_FEED_SERVICE_PASSWORD:?run make env}
      SVP_KAFKA_MEDIA_WORKER_PASSWORD: ${SVP_KAFKA_MEDIA_WORKER_PASSWORD:?run make env}
      SVP_KAFKA_KEDA_PASSWORD: ${SVP_KAFKA_KEDA_PASSWORD:?run make env}
      SVP_KAFKA_OTELCOL_PASSWORD: ${SVP_KAFKA_OTELCOL_PASSWORD:?run make env}
    volumes:
      - ../kafka:/opt/svp/kafka:ro
      - *ops-volume
      - *ca-volume
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # Valkey in place of the host's Redis: TLS on valkey:6379 (no plain port), one ACL user per client with the access
  # strings ElastiCache gets too (deploy/valkey/aclfile.sh), user default off. Rate limits, a cache and sessions, none
  # worth keeping: no persistence, and noeviction, so a full Valkey fails writes instead of dropping keys. No port
  # published: scripts on the host run `docker compose exec valkey /opt/svp/bin/svp-valkey ...` (logs in as svp-ops).
  valkey:
    profiles: [core]
    image: *valkey-image
    # The image's user valkey: the entry point neither chowns nor switches user.
    user: "999:1000"
    command: ["valkey-server", "--port", "0", "--tls-port", "6379",
              "--tls-cert-file", "/etc/svp-tls/valkey.crt", "--tls-key-file", "/etc/svp-tls/valkey.key",
              "--tls-auth-clients", "no", "--aclfile", "/etc/svp-tls/valkey-users.acl",
              "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    environment:
      # For /opt/svp/bin/svp-valkey.
      VALKEY_HOST: valkey
      SVP_CA_FILE: /etc/svp-ca/ca.crt
      SVP_VALKEY_OPS_PASSWORD: ${SVP_VALKEY_OPS_PASSWORD:?run make env}
      # Not read in the container. Valkey reads its ACL file only when it starts: with every password in its config,
      # compose recreates valkey when one changes in .env, so `make up` loads the file tls-init has just put in place.
      SVP_VALKEY_GATEWAY_PASSWORD: ${SVP_VALKEY_GATEWAY_PASSWORD:?run make env}
      SVP_VALKEY_FEED_SERVICE_PASSWORD: ${SVP_VALKEY_FEED_SERVICE_PASSWORD:?run make env}
      SVP_VALKEY_WEB_PASSWORD: ${SVP_VALKEY_WEB_PASSWORD:?run make env}
    mem_limit: 128m
    # `default` for the gateway and feed-service, `web` for the web client's sessions.
    networks: [default, web]
    volumes:
      - svp-tls:/etc/svp-tls:ro
      - *ops-volume
      - *ca-volume
    # The working directory /data stays empty with persistence off.
    read_only: true
    tmpfs:
      - /data:size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # svp-ops answers PONG only over TLS with its password: the certificate, the ACL file and the port all work.
      test: ["CMD-SHELL", "[ \"$$(/opt/svp/bin/svp-valkey PING)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully

  # The local object store: RustFS, an S3 API on one disk, with buckets, users, policies and CORS
  # rules made by s3-init.
  s3:
    profiles: [core]
    image: *s3-image
    environment:
      # The root credential exists only here and in s3-init; services get their own users (UP-5).
      RUSTFS_ACCESS_KEY: svp-admin
      RUSTFS_SECRET_KEY: ${SVP_S3_ROOT_PASSWORD:?run make env}
      # No web console (on by default, on :9001): nothing in the lab needs it, and it would be one
      # more login with the root credential, so no listener is opened for it.
      RUSTFS_CONSOLE_ENABLE: "false"
      # No global CORS origins: only the rules s3-init sets on each bucket answer a browser, so a
      # bucket without rules of its own sends no CORS header (WEB-10).
      RUSTFS_CORS_ALLOWED_ORIGINS: ""
      # The lab sends nothing out: no check for a new version at start.
      RUSTFS_CHECK_UPDATE: "false"
      # Logs go to stdout (docker logs), not to files under the image's /logs, which the read-only
      # root would refuse.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    mem_limit: 512m
    networks: [default, worker]
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:9000:9000"
    # The image has a shell, apk and curl, so the container takes them away as for media-worker:
    # read-only root (the store writes only to /data), no capabilities, no privilege gain, the
    # image's non-root user.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s

  s3-init:
    profiles: [core]
    image: *s3-image
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      S3_ROOT_PASSWORD: ${SVP_S3_ROOT_PASSWORD:?run make env}
      SVP_VIDEO_S3_SECRET_KEY: ${SVP_VIDEO_S3_SECRET_KEY:?run make env}
      SVP_MEDIA_WORKER_S3_SECRET_KEY: ${SVP_MEDIA_WORKER_S3_SECRET_KEY:?run make env}
      # The probe user of the integration tests (make test-stack).
      SVP_S3_PROBE_SECRET_KEY: ${SVP_S3_PROBE_SECRET_KEY:?run make env}
      # The browser talks to the store cross-origin: hls.js loads playlists and segments with XHR,
      # and the upload page posts the file with XHR (its progress listener makes that a CORS
      # preflight). Only the web client's origins may read the answers: `make up` (3001) and
      # `make dev` of svp-frontend (3002). Commas without spaces (WEB-10).
      S3_CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3002
    volumes:
      - ../s3:/init:ro
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy

  user-migrate:
    <<: *host-services
    profiles: [core]
    image: ${SVP_USER_SERVICE_IMAGE:-svp/user-service:dev}
    # The image of user-service: built by `make up`, or a release `make up IMAGES=stg` has
    # pulled already. Never pull a public image with the name of a build.
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://svp_user_migrator:${SVP_USER_MIGRATOR_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_user?sslmode=disable
    restart: "no"

  video-migrate:
    <<: *host-services
    profiles: [core]
    image: ${SVP_VIDEO_SERVICE_IMAGE:-svp/video-service:dev}
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://svp_video_migrator:${SVP_VIDEO_MIGRATOR_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_video?sslmode=disable
    restart: "no"

  engagement-migrate:
    <<: *host-services
    profiles: [core]
    image: ${SVP_ENGAGEMENT_SERVICE_IMAGE:-svp/engagement-service:dev}
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://svp_engagement_migrator:${SVP_ENGAGEMENT_MIGRATOR_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_engagement?sslmode=disable
    restart: "no"

  feed-migrate:
    <<: *host-services
    profiles: [core]
    image: ${SVP_FEED_SERVICE_IMAGE:-svp/feed-service:dev}
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://svp_feed_migrator:${SVP_FEED_MIGRATOR_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_feed?sslmode=disable
    restart: "no"

  user-service:
    <<: *host-services
    profiles: [core]
    # `make up` sets SVP_<SERVICE>_IMAGE of the six backend services and has their images ready before compose starts:
    # built from the working tree by docker buildx bake (deploy/docker-bake.json, tag svp/<service>:dev), or with
    # IMAGES=stg their releases in staging, pulled already. Compose neither builds nor pulls them (policy never).
    image: ${SVP_USER_SERVICE_IMAGE:-svp/user-service:dev}
    pull_policy: never
    environment:
      <<: *telemetry-app-env
      LISTEN_ADDR: ":9101"
      DATABASE_URL: postgres://svp_user_app:${SVP_USER_APP_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_user?sslmode=disable
      # Only user-service holds the signing key (threat model JWT-10).
      JWT_SIGNING_KID: ${JWT_SIGNING_KID:?run make env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run make env}
      # Public keys: it verifies the caller's access token the gateway forwards, like the other gRPC services.
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?run make env}
      # Follow events go out through the outbox: the follow and its event commit together, so a
      # follow is not lost when Kafka is down.
      KAFKA_BROKERS: kafka:9096
      KAFKA_SASL_USERNAME: svp-user-service
      KAFKA_SASL_PASSWORD: ${SVP_KAFKA_USER_SERVICE_PASSWORD:?run make env}
      # The local CA of Kafka's and Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
    volumes:
      - *ca-volume
    healthcheck: *healthcheck
    restart: unless-stopped
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  video-service:
    <<: *host-services
    profiles: [core]
    image: ${SVP_VIDEO_SERVICE_IMAGE:-svp/video-service:dev}
    pull_policy: never
    environment:
      <<: *telemetry-app-env
      LISTEN_ADDR: ":9102"
      DATABASE_URL: postgres://svp_video_app:${SVP_VIDEO_APP_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_video?sslmode=disable
      # Public keys only: it verifies the caller's access token the gateway forwards, it cannot sign one.
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?run make env}
      KAFKA_BROKERS: kafka:9096
      KAFKA_SASL_USERNAME: svp-video-service
      KAFKA_SASL_PASSWORD: ${SVP_KAFKA_VIDEO_SERVICE_PASSWORD:?run make env}
      # The local CA of Kafka's and Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
      # Service-to-store calls use the compose name; upload URLs handed to clients use the host
      # address.
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: svp-video-service
      S3_SECRET_ACCESS_KEY: ${SVP_VIDEO_S3_SECRET_KEY:?run make env}
      # Abandoned uploads are cleaned up after this long, so their objects do not stay in the store. Only the
      # upload-cleanup drill sets SVP_UPLOAD_* short; a value under the 15 minutes of an upload form is for drills only.
      UPLOAD_ABANDON_AFTER: ${SVP_UPLOAD_ABANDON_AFTER:-1h}
      UPLOAD_SWEEP_INTERVAL: ${SVP_UPLOAD_SWEEP_INTERVAL:-5m}
    volumes:
      - *ca-volume
    healthcheck: *healthcheck
    # The process exits when it cannot start a Kafka consumer and expects to be started again.
    restart: unless-stopped
    depends_on:
      video-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

  engagement-service:
    <<: *host-services
    profiles: [core]
    image: ${SVP_ENGAGEMENT_SERVICE_IMAGE:-svp/engagement-service:dev}
    pull_policy: never
    environment:
      <<: *telemetry-app-env
      LISTEN_ADDR: ":9103"
      DATABASE_URL: postgres://svp_engagement_app:${SVP_ENGAGEMENT_APP_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_engagement?sslmode=disable
      # Public keys only: it verifies the caller's access token the gateway forwards, it cannot sign one.
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?run make env}
      # Produces to and consumes engagement.views.v1: a view only produces an event on the request,
      # and the counts are written in batches, so no request waits on a counter row.
      KAFKA_BROKERS: kafka:9096
      KAFKA_SASL_USERNAME: svp-engagement-service
      KAFKA_SASL_PASSWORD: ${SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD:?run make env}
      # The local CA of Kafka's and Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
    volumes:
      - *ca-volume
    mem_limit: 256m
    healthcheck: *healthcheck
    # The process exits when it cannot start a Kafka consumer and expects to be started again.
    restart: unless-stopped
    depends_on:
      engagement-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  feed-service:
    <<: *host-services
    profiles: [core]
    image: ${SVP_FEED_SERVICE_IMAGE:-svp/feed-service:dev}
    pull_policy: never
    environment:
      <<: *telemetry-app-env
      LISTEN_ADDR: ":9104"
      DATABASE_URL: postgres://svp_feed_app:${SVP_FEED_APP_DB_PASSWORD:?run make env}@host.docker.internal:5432/svp_feed?sslmode=disable
      # Public keys only: it verifies the caller's access token the gateway forwards, it cannot sign one.
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?run make env}
      # Consumes user.follows.v1 and video.lifecycle.v1: the timeline is built on write, so a follow
      # backfills the followee's last 30 days and a ready video fans out to its followers.
      KAFKA_BROKERS: kafka:9096
      KAFKA_SASL_USERNAME: svp-feed-service
      KAFKA_SASL_PASSWORD: ${SVP_KAFKA_FEED_SERVICE_PASSWORD:?run make env}
      # The local CA of Kafka's and Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
      # Explore feed cache: explore has no freshness target, so its first page is cached in Valkey for
      # 5 s and the database is read once per burst. Its user may use db 14 and svp:feed:* only.
      REDIS_URL: rediss://svp-feed-service:${SVP_VALKEY_FEED_SERVICE_PASSWORD:?run make env}@valkey:6379/14
    volumes:
      - *ca-volume
    mem_limit: 256m
    healthcheck: *healthcheck
    # The process exits when it cannot start a Kafka consumer and expects to be started again.
    restart: unless-stopped
    depends_on:
      feed-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  gateway:
    profiles: [core]
    image: ${SVP_GATEWAY_IMAGE:-svp/gateway:dev}
    pull_policy: never
    environment:
      <<: *telemetry-app-env
      LISTEN_ADDR: ":8080"
      USER_SERVICE_ADDR: user-service:9101
      VIDEO_SERVICE_ADDR: video-service:9102
      FEED_SERVICE_ADDR: feed-service:9104
      ENGAGEMENT_SERVICE_ADDR: engagement-service:9103
      # Public keys only: the gateway verifies tokens, it cannot sign them.
      JWT_VERIFY_KEYS: ${JWT_VERIFY_KEYS:?run make env}
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:9000/media
      # Rate limits are counted in Valkey so all gateway instances share one count; if Valkey is down
      # the gateway falls back to in-memory counters. Its user may use db 10 and svp:gw:* only.
      # SVP_GATEWAY_REDIS_URL exists only for the Redis-down drill, which points it at an
      # unresolvable .invalid host.
      REDIS_URL: ${SVP_GATEWAY_REDIS_URL:-rediss://svp-gateway:${SVP_VALKEY_GATEWAY_PASSWORD:?run make env}@valkey:6379/10}
      # The local CA of Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
      # The gateway's HTTP spans continue the trace of an incoming traceparent, so a page's trace
      # runs from web through the gateway to the services. web writes only the context of its own
      # spans and never passes on one it received; a process on this machine can still choose the
      # trace id of its own request to 127.0.0.1:8080, accepted for the lab (threat model WEB-24).
      TRUST_TRACE_CONTEXT: "true"
    volumes:
      - *ca-volume
    ports:
      - "127.0.0.1:8080:8080"
    # `web` only for the web client's BFF calls.
    networks: [default, web]
    healthcheck: *healthcheck
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      # Only started, not healthy: the feed is served without stats when engagement-service is
      # down, so the gateway must start without it too.
      engagement-service:
        condition: service_started
      valkey:
        condition: service_healthy

  # Web client: Next's standalone server, the browser's only origin, with the BFF that holds the sessions and calls the
  # gateway. Open it at http://localhost:3001, the APP_ORIGIN that login redirects and the cookie's form go by.
  # http://127.0.0.1:3001 logs in too, but plays and uploads no video: the CORS rules of the store's buckets allow only
  # the localhost origins.
  web:
    profiles: [core]
    # `make up` sets the four SVP_WEB_* variables: a release it has pulled already (WEB_FROM=stg, the default, or
    # image), which compose neither pulls nor builds, or built from the web client's source (WEB_FROM=clone: web_dir of
    # deploy/k8s/lib.sh). This repository holds no web source, so the defaults build nothing: commands that do not set
    # them (ps, logs, down, a drill that recreates another service) never create web.
    image: ${SVP_WEB_IMAGE:-svp/web:dev}
    pull_policy: ${SVP_WEB_PULL_POLICY:-never}
    build:
      # The web client's own tree, so the six Go images keep the repository's .dockerignore and
      # build cache; its .dockerignore leaves out node_modules, build output and .env*.
      context: ${SVP_WEB_CONTEXT:-.}
      dockerfile: ${SVP_WEB_DOCKERFILE:-Dockerfile}
    environment:
      # Traces and metrics (web vitals of /rum included) to the Collector of `obs`, on the `web`
      # network; without `obs` the exports fail and are dropped, and OBS=off turns the SDK off.
      <<: *telemetry-env
      # The only host the BFF calls.
      GATEWAY_URL: http://gateway:8080
      # Sessions and refresh locks in Valkey db 9, the web client's own db: its user may use db 9 and
      # svp:web:* only. Node trusts the local CA of Valkey's certificate beside its own roots.
      REDIS_URL: rediss://svp-web:${SVP_VALKEY_WEB_PASSWORD:?run make env}@valkey:6379/9
      NODE_EXTRA_CA_CERTS: /etc/svp-ca/ca.crt
      # What the browser uses: the CSRF check, the cookie's form (no Secure on plain http) and
      # the post-login redirect check compare against it.
      APP_ORIGIN: http://localhost:3001
      # Where the browser fetches HLS and thumbnails (the gateway's MEDIA_PUBLIC_BASE_URL), allowed
      # by the Content-Security-Policy.
      MEDIA_ORIGIN: http://127.0.0.1:9000
      # Where the browser posts an upload (the presigned POST of video-service, on the same store),
      # allowed by the Content-Security-Policy; the upload page sends a file to no other origin.
      UPLOAD_ORIGIN: http://127.0.0.1:9000
      # Errors of the server and the browser's reports (POST /monitoring) go to GlitchTip at the
      # DSN `make glitchtip-init` wrote for the Go services (glitchtip:8000, on the `web` network
      # with `obs`); empty turns reporting off, and /monitoring answers 404.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      # The key that encrypts the variables a Server Action closes over, base64 of 32 random bytes that `make env`
      # writes; read at run time, never baked into the image. Empty falls back to the key the build put in the image,
      # which works with one replica and actions that close over nothing.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    volumes:
      - *ca-volume
    ports:
      - "127.0.0.1:3001:3001"
    # Only the network it shares with the gateway, Valkey and, with `obs`, GlitchTip and the Collector.
    networks: [web]
    # The same lockdown as media-worker, although the distroless image has no shell or package
    # manager to take away: read-only root (the server writes no file: every route is rendered per
    # request and images are not optimized, so .next/cache stays empty), no capabilities, no
    # privilege gain, the image's non-root user.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    # About 100 MiB resident at rest; the limit bounds a leak.
    mem_limit: 256m
    # Node runs about a dozen threads (main, libuv pool, V8 helpers).
    pids_limit: 64
    healthcheck:
      <<: *healthcheck
      # Distroless has no shell or curl: the image's node asks /healthz, which answers from the
      # process alone, without Redis or the gateway.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      valkey:
        condition: service_healthy

  media-worker:
    profiles: [core]
    image: ${SVP_MEDIA_WORKER_IMAGE:-svp/media-worker:dev}
    pull_policy: never
    environment:
      <<: *telemetry-env
      KAFKA_BROKERS: kafka:9096
      KAFKA_SASL_USERNAME: svp-media-worker
      KAFKA_SASL_PASSWORD: ${SVP_KAFKA_MEDIA_WORKER_PASSWORD:?run make env}
      # The local CA of Kafka's and Valkey's certificate, read beside the system roots.
      SSL_CERT_DIR: /etc/svp-ca
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: svp-media-worker
      S3_SECRET_ACCESS_KEY: ${SVP_MEDIA_WORKER_S3_SECRET_KEY:?run make env}
      WORK_DIR: /work
    # Exactly one replica: on start the worker deletes every job directory (named by video id)
    # left in /work, so a second replica sharing this volume would delete the jobs of the first.
    # Scaling out needs one volume per replica.
    scale: 1
    # The image has a shell and apk (ffmpeg needs Alpine), so the container takes them away:
    # read-only root, no capabilities, no privilege gain, the image's non-root user.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    cpus: 2
    mem_limit: 2g
    # ffmpeg and libx264 start a thread per core and per encoder; this caps a runaway, not a job.
    pids_limit: 256
    volumes:
      # Job scratch space on disk: a job needs up to ~1 GB, too much for a RAM-backed tmpfs.
      - media-worker-work:/work
      - *ca-volume
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    networks: [worker]
    # Exits when its consumer fails (a commit or DLQ produce while Kafka restarts) and relies on
    # being started again; the uncommitted record is delivered again.
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully

  otelcol:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/config.yaml"]
    # The kafkametrics receiver reads consumer group lag as svp-otelcol (SASL/SCRAM-SHA-512 over TLS).
    environment:
      SVP_KAFKA_OTELCOL_PASSWORD: ${SVP_KAFKA_OTELCOL_PASSWORD:?run make env}
      SVP_OTELCOL_KAFKA_BROKERS: kafka:9096
      SVP_OTELCOL_KAFKA_CA_FILE: /etc/svp-ca/ca.crt
    volumes:
      - ../observability/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - *ca-volume
    # The memory_limiter processor keeps the heap at 192 MiB of this, so a burst of telemetry makes
    # the Collector refuse data rather than run out of memory.
    mem_limit: 256m
    # `default` for the services and LGTM, `worker` for media-worker, `web` for the web client. No
    # published port.
    networks: [default, worker, web]
    restart: unless-stopped

  lgtm:
    profiles: [obs]
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    # Dev image: Grafana lets anonymous users in as Admin. Accepted only because it is published on
    # the host's loopback and holds local lab data (threat model OPS-2).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The lab keeps its data on the machine: Grafana, Tempo, Loki and Pyroscope do not report usage, and Grafana does
      # not ask grafana.com for new versions. Grafana installs no plugin at run time either: no preinstall (by default
      # it downloads a list of unpinned plugins at every start), no update of the ones a volume already holds, and the
      # plugin signing key stays the one built in. The image appends *_EXTRA_ARGS to their command line.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      TEMPO_EXTRA_ARGS: -reporting.enabled=false
      LOKI_EXTRA_ARGS: -reporting.enabled=false
      PYROSCOPE_EXTRA_ARGS: -usage-stats.enabled=false
      # Prometheus is not published, so the "Source" link of an alert (its generatorURL) would name the container and
      # not open from the host. The external URL points it at Grafana's datasource proxy on the published
      # 127.0.0.1:3000 instead. The route prefix stays /, so everything inside the container and the compose network
      # (Grafana's datasource, the image's healthcheck, OTLP and remote write) still reaches Prometheus at the root.
      PROMETHEUS_EXTRA_ARGS: --web.external-url=http://127.0.0.1:3000/api/datasources/proxy/uid/prometheus --web.route-prefix=/
    mem_limit: 1536m
    volumes:
      - lgtm-data:/data
      # Config files mounted over the ones the image's run scripts read, so the bundled Loki, Prometheus and Grafana pick
      # them up without a rebuilt image.
      - ../observability/lgtm/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      # Prometheus: rule evaluation every 15 s, the SLO and alert rules, alerts to `alertmanager`.
      - ../observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ../observability/prometheus/rules:/otel-lgtm/svp-rules:ro
      - ../observability/grafana/provisioning/datasources/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ../observability/grafana/provisioning/dashboards/svp.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/svp.yaml:ro
      - ../observability/grafana/dashboards:/otel-lgtm/svp-dashboards:ro
    healthcheck:
      # run-all.sh writes /tmp/ready once Grafana, Prometheus, Tempo, Loki, Pyroscope and the
      # image's Collector all answer.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped

  # Routes the alerts of LGTM's Prometheus. The entry point writes the config: severity="page" goes to Telegram only
  # when SVP_ALERT_TELEGRAM_BOT_TOKEN and SVP_ALERT_TELEGRAM_CHAT_ID are both set in .env; otherwise every alert is
  # only listed in the UI. The token comes in as a compose secret, not an environment variable, so `docker inspect`
  # does not show it. Telegram's Bot API is the only address outside the machine the lab sends to.
  alertmanager:
    profiles: [obs]
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      SVP_ALERT_TELEGRAM_CHAT_ID: ${SVP_ALERT_TELEGRAM_CHAT_ID:-}
    secrets:
      - telegram_bot_token
    volumes:
      - ../observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped

  # Migrates svp_glitchtip, then creates the admin user, organization, team and project `svp` and the API token of the
  # drills. Idempotent; `glitchtip` starts only after it succeeds. `make glitchtip-init` runs it once more with an
  # output directory mounted to collect the DSN and token for .env. migrate and createcachetable go through the
  # migrator role: the app role cannot create tables.
  glitchtip-init:
    <<: *host-services
    profiles: [obs]
    image: *glitchtip-image
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        python manage.py migrate --no-input --database maintenance
        python manage.py createcachetable --database maintenance
        python manage.py maintain_partitions
        python manage.py shell < /init/bootstrap.py
    environment:
      <<: *glitchtip-env
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:?run make env}
      GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:?run make env}
    volumes:
      - ../observability/glitchtip/bootstrap.py:/init/bootstrap.py:ro
    mem_limit: 512m
    restart: "no"

  # GlitchTip web and task worker in one process, with no Valkey: one container to run instead of several, within the
  # RAM budget. Its init commands are skipped: glitchtip-init ran them. On `default` for the Go services and on `web`
  # for the web client, which joins no other network; media-worker, on `worker`, reports no errors.
  glitchtip:
    <<: *host-services
    profiles: [obs]
    image: *glitchtip-image
    environment:
      <<: *glitchtip-env
      GLITCHTIP_EMBED_WORKER: "true"
      SKIP_INIT: "true"
      GRANIAN_WORKERS: "1"
    ports:
      - "127.0.0.1:8000:8000"
    networks: [default, web]
    mem_limit: 512m
    healthcheck:
      # The image's script: GET http://localhost:8000/_health/ must answer 200.
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully

  # Profile `obs-elastic` (`make up OBS=elastic`): the Elastic stack, kept only to compare with LGTM. Never runs
  # together with `obs` (compose.mk refuses it). Elasticsearch security is off and nothing has a login: local lab
  # only, Kibana published on the host's loopback only, Elasticsearch and APM Server inside the compose network only.
  elasticsearch:
    profiles: [obs-elastic]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    environment:
      # One node: no cluster formation, and the production bootstrap checks (vm.max_map_count among
      # them) are not enforced.
      discovery.type: single-node
      xpack.security.enabled: "false"
      # No GeoIP database downloads from Elastic: the lab sends nothing out.
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    # 1 GiB heap plus off-heap memory (Lucene, the ML controller, thread stacks).
    mem_limit: 2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    restart: unless-stopped

  kibana:
    profiles: [obs-elastic]
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    volumes:
      - ../observability/elastic/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    profiles: [obs-elastic]
    image: docker.elastic.co/apm/apm-server:9.5.5@sha256:9262426d04743c1160ed133d149e85bcad3361ef24e47f902f7f5d23d2fbf60e
    # A bind-mounted config is owned by the host user, which the default permission check refuses.
    command: ["-c", "/etc/apm-server/apm-server.yml", "--strict.perms=false"]
    volumes:
      - ../observability/elastic/apm-server.yml:/etc/apm-server/apm-server.yml:ro
    mem_limit: 512m
    healthcheck:
      # No curl or wget in the image: bash asks the server's root endpoint, which answers 200 once
      # it is ready to take data.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8200 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy

  # The Collector of this profile: the image of `otelcol` (keep the two in step), the config of
  # `otelcol` with a second file merged over it that only swaps the exporters for APM Server, and
  # the network alias `otelcol`, so the services send to the same otelcol:4317 with no change.
  # `make otelcol-validate` checks both.
  otelcol-elastic:
    profiles: [obs-elastic]
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/elastic.yaml"]
    # The kafkametrics receiver reads consumer group lag as svp-otelcol (SASL/SCRAM-SHA-512 over TLS).
    environment:
      SVP_KAFKA_OTELCOL_PASSWORD: ${SVP_KAFKA_OTELCOL_PASSWORD:?run make env}
      SVP_OTELCOL_KAFKA_BROKERS: kafka:9096
      SVP_OTELCOL_KAFKA_CA_FILE: /etc/svp-ca/ca.crt
    volumes:
      - ../observability/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - ../observability/elastic/otelcol-config.yaml:/etc/otelcol/elastic.yaml:ro
      - *ca-volume
    mem_limit: 256m
    networks:
      default:
        aliases: [otelcol]
      worker:
        aliases: [otelcol]
      web:
        aliases: [otelcol]
    restart: unless-stopped

networks:
  default:
  worker:
    internal: true
  web:

volumes:
  # The broker's log directory: topics, offsets, and the metadata log with users and ACLs. Created owned by appuser
  # from the image's /var/lib/kafka/data.
  kafka-data:
  # Server certificates, keys and Valkey's ACL file, written by tls-init.
  svp-tls:
  # The image's /data is owned by its uid 10001, so the new volume is writable by it.
  s3-data:
  # Created owned by 65532:65532 from the image's /work, so the worker can write to it.
  media-worker-work:
  # Prometheus, Tempo, Loki, Pyroscope and Grafana data of the obs profile.
  lgtm-data:
  # Alertmanager's silences and notification log, so a restart neither forgets a silence nor sends
  # a firing alert again; created owned by nobody from the image's /alertmanager. Named, unlike the
  # image's anonymous volume, so `make down` reuses it and `make clean-data` removes it.
  alertmanager-data:
  # Elasticsearch indices of the obs-elastic profile.
  elasticsearch-data:

secrets:
  # Read by compose from .env; empty when the variable is empty or absent (compose.mk).
  telegram_bot_token:
    environment: SVP_ALERT_TELEGRAM_BOT_TOKEN
