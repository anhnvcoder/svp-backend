{{- /*
Login of KEDA's Kafka scaler, which reads the lag of group media-worker for the ScaledObject of chart svp-service:
Kafka user svp-keda, SCRAM-SHA-512 over TLS as the services, from Secret keda-kafka of namespace keda. With the broker
in the cluster it also trusts the local CA (ca of Secret local-ca there); a managed broker's CA is a public one.
*/}}

{{- /*
svp-keda may only DESCRIBE topic video.lifecycle.v1 and group media-worker (deploy/kafka/kafka-init.sh), which is what
reading committed and end offsets needs.
*/}}

{{- /*
Cluster-scoped, not a TriggerAuthentication beside the ScaledObject: the KEDA operator may read the Secrets of
namespace keda only (base/keda.yaml of svp-gitops), and a ClusterTriggerAuthentication reads its Secrets there.
*/}}

{{- /*
Any ScaledObject of the cluster may name it, which gives nothing beyond that DESCRIBE.
*/}}

{{- /*
It is one object for the whole cluster, so it is made here, once, beside the user and ACLs it logs in with.
*/}}

{{- /*
Rendered by each release of chart svp-service with a ScaledObject, a second such release would fail Helm's ownership
check, and uninstalling one would delete the others' login.
*/}}

{{- /*
This chart is wave 4: after KEDA's CRDs (wave 2), before media-worker's ScaledObject (wave 7).
*/}}
apiVersion: keda.sh/v1alpha1
kind: ClusterTriggerAuthentication
metadata:
  name: keda-kafka
spec:
  secretTargetRef:
    {{- range list "sasl" "tls" "username" "password" }}
    - parameter: {{ . }}
      name: keda-kafka
      key: {{ . }}
    {{- end }}
    {{- if not (include "svp-data.kafkaExternal" .) }}
    - parameter: ca
      name: local-ca
      key: ca.crt
    {{- end }}
