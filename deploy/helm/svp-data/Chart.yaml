apiVersion: v2
name: svp-data
description: >-
  Data tier of the short-video platform, namespace svp-data: the CloudNativePG Cluster svp-pg, the Kafka broker, Valkey,
  the object store s3 (RustFS) and its HTTPRoute, each where it runs in the cluster; the NetworkPolicies of every data
  pod, the init Jobs that create the databases and roles, the buckets and object store users, the topics, Kafka users
  and ACLs; Deployment svp-ops, the operations CLI of Kafka, Valkey and read-only Postgres; and the login of KEDA's
  Kafka scaler (ClusterTriggerAuthentication keda-kafka).
type: application
version: 0.1.0
