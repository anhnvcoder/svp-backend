# Client authentication of the Postgres container of compose (deploy/compose/compose.yaml). Over the network only TLS
# with a password, as rds.force_ssl does on RDS; the Unix socket inside the container only for the OS user of the same
# name, which is how deploy/postgres/bootstrap.sh logs in as postgres through `docker compose exec`.
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            peer
hostnossl all       all   all      reject
hostssl   all       all   all      scram-sha-256
