{{- /* TLS of the entry point from a local CA run by cert-manager: a self-signed issuer signs the CA, the CA issuer
signs the certificate of each listener (templates/_helpers.tpl). Clients trust the CA alone (`make k8s-ca`; a load
balancer in front checks no target's certificate), nothing goes into the machine's trust store. */}}
{{- $tls := .Values.tls }}
{{- $issuer := "svp-ca" }}
{{- if eq $tls.issuer "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: svp-selfsigned
spec:
  selfSigned: {}
---
# The CA lives in cert-manager's namespace: a ClusterIssuer reads its secret from the cluster resource namespace, which
# defaults to cert-manager.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: svp-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: svp-local-ca
  secretName: svp-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: svp-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: svp-ca
spec:
  ca:
    secretName: svp-local-ca
{{- else }}
{{- fail (printf "tls.issuer: %q is not supported, the only value is selfSigned" $tls.issuer) }}
{{- end }}
{{- range include "svp-cluster.listeners" . | fromYamlArray }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .certificate }}
  namespace: svp-edge
spec:
  secretName: {{ .secretName }}
  dnsNames:
    {{- range .dnsNames }}
    - {{ . | quote }}
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $issuer }}
{{- end }}
