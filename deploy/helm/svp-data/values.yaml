# Data tier in namespace svp-data. Wave 4 of argocd/apps/components.json of svp-gitops: after the CloudNativePG operator
# and KEDA (wave 2, whose CRDs its Cluster and ClusterTriggerAuthentication need) and the Barman Cloud plugin (wave 3,
# whose CRD its ObjectStore needs). Every Secret it reads is written by deploy/k8s/secrets.sh; none is in git.
# Design notes: docs/explanation/deployment.md.

postgres:
  # cluster: Postgres svp-pg run by CloudNativePG in this namespace, with its WAL and base backups in the object store
  # s3, its server certificate signed by the local CA (Secrets pg-tls and local-ca). external: a managed Postgres
  # outside the cluster (Amazon RDS), which keeps its own backups: no Cluster, no backup. The pg-bootstrap Job still
  # makes the roles and databases there, as the login of Secret pg-superuser, with sslmode=verify-full against the CA
  # of Secret local-ca (cluster) or rds-ca (external, the RDS bundle chart svp-cluster renders).
  mode: cluster
  external:
    # DNS name of the managed Postgres (the RDS endpoint, the name its certificate holds), and the CIDRs its addresses
    # are in (the database subnets), the only addresses the pg-bootstrap Job may reach on 5432.
    host: ""
    cidrs: []
  # The major of RDS, compose and CI; minimal: no extension is needed.
  image: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie@sha256:eb06deb9dab3706c9dc8dce4b24677f0b55a8887918cd26d2a3cc59b2c12c3ee
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  # WAL archiving and base backups to bucket pg-backups of the object store s3 through the Barman Cloud plugin
  # (templates/backup.yaml).
  backup:
    # The archive generation svp-pg writes its WAL and base backups to, a prefix of the bucket. A Cluster restored from
    # backups must archive into a new, empty one (two generations in one prefix would mix their backups), so each
    # restore (docs/runbooks/postgres-restore.md) starts the next, svp-pg-<yymmddhhmmss> (UTC); deploy/k8s/install.sh
    # passes the running one with --set. This default is the first generation's, that of a new cluster.
    serverName: svp-pg
    # The plugin's sidecar in the Postgres pod (and in the recovery Job's pod): Barman compresses and uploads WAL and
    # base backups. The memory limit bounds the page cache a base backup fills (plugin issue #825).
    sidecarResources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  # Set only by a restore (docs/runbooks/postgres-restore.md), on the command line of the one upgrade that creates
  # svp-pg again from its backups, never in a file: source is the archive generation to restore from, targetTime (RFC
  # 3339) an optional point in time to stop at. CloudNativePG reads bootstrap only when it creates the first instance,
  # so the next upgrade without these values removes them from the Cluster and changes nothing in the restored database.
  recovery:
    source: ""
    targetTime: ""

valkey:
  # cluster: Valkey in this namespace (Deployment valkey), TLS on valkey.<namespace>.svc.cluster.local:6379 with the
  # server certificate of the local CA and one ACL user per client (Secrets valkey-tls, valkey-acl). external: a managed
  # Valkey outside the cluster (Amazon ElastiCache), which Terraform makes with the same users: no Valkey here.
  mode: cluster
  # The host clients reach Valkey at, without the port: the Service of this chart, or the managed Valkey's primary
  # endpoint with mode external. svp-ops's valkey-cli logs in there.
  host: valkey.svp-data.svc.cluster.local
  external:
    # The CIDRs the managed Valkey's addresses are in (the database subnets), the only addresses svp-ops may reach on
    # 6379 with mode external.
    cidrs: []
  # The same image as compose's valkey; also the valkey-cli of svp-ops.
  image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
  # CPU limit one core, not 200m: the CFS quota is enforced per 100 ms period, and at 200m Valkey was throttled 4-14
  # periods a minute while idle. A throttled period stalls it for longer than the gateway's 50 ms rate-limit store
  # timeout, so a login burst left the shared bucket for each pod's fallback counter. Valkey runs commands on one
  # thread, so one core is about the most it can use; the request stays small, it is mostly idle.
  resources:
    requests: {cpu: 20m, memory: 16Mi}
    limits: {cpu: "1", memory: 128Mi}

kafka:
  # cluster: one Apache Kafka broker in this namespace (StatefulSet kafka, KRaft), SASL_SSL with SCRAM-SHA-512 on
  # kafka.<namespace>.svc.cluster.local:9096 like Amazon MSK, its users created by Job kafka-init. external: a managed
  # Kafka outside the cluster (Amazon MSK), which keeps its users itself (Terraform associates one secret per user):
  # no broker here, and Job kafka-init only makes the topics and ACLs there.
  mode: cluster
  # Bootstrap brokers of every client here (Job kafka-init, svp-ops): host:9096 per broker, comma separated. The
  # Service of this chart, or the managed Kafka's SCRAM bootstrap brokers with mode external.
  brokers: kafka.svp-data.svc.cluster.local:9096
  external:
    # The CIDRs the managed brokers' addresses are in (the database subnets), the only addresses Job kafka-init and
    # svp-ops may reach on 9096 with mode external.
    cidrs: []
  # The broker, its init Job and svp-ops's Kafka CLI: the same image as compose's kafka, pinned by the digest of its
  # multi-arch index.
  image: docker.io/apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
  # The KRaft cluster id the broker's storage is formatted with on its first start (a base64 UUID, kafka-storage.sh
  # random-uuid). Read only while the volume is empty: changing it later changes nothing on a formatted volume.
  clusterId: wy5m0_Z5QE-AcsMIn91BaA
  # The broker's JVM heap; the rest of the memory limit is the JVM's own (metaspace, threads, direct buffers).
  heap: 512m
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {cpu: "1", memory: 1280Mi}
  # Job kafka-init: about forty Kafka CLI commands of one JVM each, and a JVM's start is CPU bound. Under the 500m of
  # the other init Jobs the script runs about as long as Helm's timeout; one core makes it a few times faster.
  initResources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}

# Deployment svp-ops: the one place in the cluster where scripts, drills and runbooks run the Kafka CLI and valkey-cli
# (kubectl exec deploy/svp-ops -c kafka -- /opt/svp/bin/svp-kafka ..., -c valkey -- /opt/svp/bin/svp-valkey ...), as
# svp-admin and svp-ops. Both containers only sleep until then; a Kafka CLI run is one JVM of a 256 MiB heap.
svpOps:
  resources:
    kafka:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 512Mi}
    valkey:
      requests: {cpu: 5m, memory: 8Mi}
      limits: {cpu: 200m, memory: 64Mi}

s3:
  # cluster: the object store s3 below, with its init Job and route. external: a managed object store outside the
  # cluster (Amazon S3, served through CloudFront), whose buckets, CORS rules and policies are made by Terraform:
  # nothing of the store is rendered here. Postgres archives into s3, so external needs postgres.mode external too.
  mode: cluster
  # The object store, the same image as compose's s3 (RustFS), pinned by the digest of its multi-arch index.
  image: docker.io/rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  # Presigned POST uploads and HLS playback from the host go through Gateway svp at https://<host>:8443.
  host: s3.svp.localhost
  # The origins whose pages may read the store's answers, set by the s3-init Job as the CORS rules of each bucket: POST
  # to uploads, GET and HEAD at media, nothing else. The browser talks to the store cross-origin (hls.js and the upload
  # page use XHR). Only the web client's origin here: the web clients of compose and make dev use compose's store, never
  # this one. Commas without spaces.
  corsAllowedOrigins: https://svp.localhost:8443

# The init Jobs (Postgres bootstrap, the object store s3, Kafka). waitSeconds bounds how long the first two wait for
# their server after an install or upgrade before they fail; kafka-init.sh retries its login for ten minutes itself.
# resources: of the first two; Job kafka-init has kafka.initResources.
initJobs:
  waitSeconds: 300
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Who may reach the data pods. Pods are chosen by label, so the policies exist before
# their clients do: the six services and their migrate Jobs are labelled app.kubernetes.io/name=<service>.
clients:
  # Database of each service, by its pods and its migrate Job.
  postgres: [user-service, video-service, engagement-service, feed-service]
  # Rate limits (db 10), the explore cache (db 14) and the web client's sessions (db 9).
  valkey: [gateway, feed-service, web]
  kafka: [user-service, video-service, engagement-service, feed-service, media-worker]
  s3: [video-service, media-worker]
