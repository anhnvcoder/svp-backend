# Defaults shared by the releases of svp-service (the Go services and the web client). Each release's own
# values are base/services/<service>.yaml of svp-gitops; the release name is the service name, which names the pods'
# label app.kubernetes.io/name, the Service, the ServiceAccount and the Secrets.

image:
  # -- GitOps path: ghcr.io/anhnvcoder/svp-backend/<service>, from the release's values file. Dev path: `make
  # k8s-up` passes k3d-svp-registry:5111/svp/<service>, the local registry under the name the nodes resolve on network
  # k3d-svp.
  repository: ""
  # -- Empty on purpose. Dev path: `make k8s-up` passes the dev tag of the image it has just built (--set image.tag=...)
  # and an empty digest. GitOps path: the promote pull request writes the release's commit (tag, for people) and its
  # signed index digest (what the pod runs) into the values file. Both empty fails the render naming the release.
  tag: ""
  # -- Signed index digest of the image the pod runs; see `image.tag`.
  digest: ""

# -- Arguments of the service's container, after the image's entrypoint: empty runs the binary's default command.
# media-worker on EKS sets [mediaconvert], the command that hands transcoding to AWS Elemental MediaConvert instead of
# running ffmpeg in the pod (`serve`). The migrate Job never takes them: it runs `migrate`.
args: []

# -- http: the gateway and the web client (probes on /healthz). grpc: the four gRPC services (Kubernetes' own grpc probe
# on the standard health service), whose Service sends its traffic through the mesh's waypoint (peer waypoint), the L7
# proxy that balances the calls one by one and admits only the callers of ingressFrom; its pods admit the waypoint
# alone. none: media-worker (no port, no probe, no Service).
protocol: none
# -- Port the process listens on (LISTEN_ADDR) and the Service exposes; unused with protocol none.
port: 0

# -- Replica count of a workload without an autoscaler. With hpa or keda set the chart renders no spec.replicas at all:
# a count in the manifest would be put back by every helm upgrade and by Argo CD's selfHeal each time the autoscaler
# changes it, the two fighting over the field. Such a workload starts with Kubernetes' default of 1
# and its autoscaler raises it to its minimum.
replicas: 1

# -- HorizontalPodAutoscaler on CPU (metrics-server of k3s): {minReplicas, maxReplicas, cpuUtilization}. The utilization
# is a percentage of the container's CPU request, so resources.requests.cpu must be set (it always is, see below).
hpa: {}
# -- PodDisruptionBudget {minAvailable}: only for a workload that always runs at least two replicas: hpa.minReplicas >= 2,
# or no autoscaler at all (neither hpa nor keda) and replicas >= 2. With one replica a budget either blocks every node
# drain for good (minAvailable: 1) or allows everything (0), so a single-replica service has none.
pdb: {}
# -- Spread the replicas over the zones, then over the nodes (topologySpreadConstraints on topology.kubernetes.io/zone,
# as `zoneSpread` says, then kubernetes.io/hostname, ScheduleAnyway): with two replicas, losing one zone or one node
# leaves one serving. Soft by default, so a cluster with one zone or one node still schedules them; k3d's nodes have no
# zone label.
spreadAcrossNodes: false
# -- The zone constraint of `spreadAcrossNodes`. whenUnsatisfiable: ScheduleAnyway or DoNotSchedule, under which a pod
# waits rather than land in a zone that has more replicas than another, and no node without a zone label (k3d's) takes
# it. minDomains, DoNotSchedule only: the zones counted even while one has no node, so a pod waits for that zone and
# Karpenter opens a node there instead of the scheduler filling the zones that have nodes.
zoneSpread:
  whenUnsatisfiable: ScheduleAnyway
# -- nodeAffinity of the pods (the release's and its migrate Job's), as in a pod's spec.affinity.nodeAffinity. Empty:
# any node. EKS requires karpenter.sh/nodepool Exists, so the pods land only on nodes Karpenter makes, which start
# with a taint until Istio's CNI agent runs there: a pod started on a node before it would run outside the mesh. The
# system node group has no such taint and takes none of these pods.
nodeAffinity: {}
# -- KEDA ScaledObject on the consumer lag of a Kafka group, logged in through ClusterTriggerAuthentication keda-kafka
# (chart svp-data; Kafka user svp-keda): {minReplicas, maxReplicas, kafka: {topic, consumerGroup, lagThreshold}}.
# The broker is env.KAFKA_BROKERS, the one the service consumes from (kafka.svp-data.svc.cluster.local:9096 on k3d,
# the brokers of Amazon MSK on EKS).
keda: {}

# -- Run the service as an Argo Rollouts Rollout with an analysed canary instead of a Deployment: Service
# <release>-canary beside the stable one, the requests split between the two by the weights of a route. With
# httpRoute.host: its HTTPRoute (Envoy), analysis on Envoy's metrics of the canary backend. A gRPC release: GRPCRoute
# <release> on its Service, applied call by call by the mesh's waypoint, analysis on rpc.server.call.duration of the
# canary's pods. canaryRoute of the release's component in argocd/apps/components.json of svp-gitops names that route.
# Any other release fails the render: nothing measures its canary.
canary: false
# -- Limits of the canary's analysis, per release since what a good response time is depends on the service: p99Ms, the
# p99 in ms the canary must stay under; errorRatio, the share it must stay under of 5xx among its responses that are not
# 4xx (gRPC: of the server-error status codes UNKNOWN, INTERNAL, UNAVAILABLE, DATA_LOSS, DEADLINE_EXCEEDED among all its
# calls). Required with canary set; the release's values file says why its numbers.
canaryLimits: {}
# -- Prometheus the canary's analysis queries. address: its HTTP API, no trailing slash (Argo Rollouts appends
# /api/v1/query); on EKS the query endpoint of the env's Amazon Managed Service for Prometheus workspace. sigv4Region:
# empty sends queries unsigned; set, the controller signs them with SigV4 in that region with its own credentials (EKS
# Pod Identity), which Argo Rollouts does only for an address on aps-workspaces.
canaryPrometheus:
  address: http://kps-prometheus.svp-obs:9090
  sigv4Region: ""

# -- Annotations of the pod template. A changed value makes a new revision without a new image: the canary drill of the
# lab changes one to run a canary of the code already running.
podAnnotations: {}

# -- A service with a database runs `migrate` with its migrator role in a Job before each install and upgrade. The Job
# gets the OTEL_* entries of `env` and the pod's resource attributes, and reaches the Collector when `egressTo` names
# it, so its log goes where the service's does; the other entries of `env` are for serve alone.
migrate: false

# -- Every container of the project has requests and limits; the values file sets them per service.
resources: {}
# -- Requests and limits of the migrate Job container.
migrateResources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {cpu: 500m, memory: 128Mi}

# -- Environment of every service; a values file adds its own. Secrets are never here: they come from Secret
# <service>-env (deploy/k8s/secrets.sh, from .env). The chart sets OTEL_RESOURCE_ATTRIBUTES itself (k8s.pod.name and
# k8s.namespace.name, from SVP_POD_NAME and SVP_POD_NAMESPACE of the downward API), so a values file that sets it fails
# the render.
env:
  # -- Traces, metrics and logs go to the Collector in svp-obs; until it runs, export fails with a rate-limited WARN and
  # the service works as before.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.svp-obs:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"

# -- Report errors to GlitchTip (internal/sentryx): SENTRY_DSN comes from Secret sentry, which
# deploy/k8s/glitchtip-init.sh writes once GlitchTip runs (the DSN is GlitchTip's own, never in .env). The reference
# is optional: a pod started before that Secret exists runs with error reporting off, and Reloader restarts it once the
# DSN is there (the workload names Secret sentry in its reload annotation). media-worker reports no errors, as in
# compose.
errorTracking: false

# -- Secret of the release's namespace whose ca.crt is the CA the pods trust beyond the system's roots, mounted at
# /etc/svp-ca in the pods and the migrate Job: the local CA that Kafka, Valkey and Postgres of the cluster chain to
# (local-ca, chart svp-data), or on EKS the CA bundle of RDS (rds-ca, chart svp-cluster) for a service with a database.
# DATABASE_URL names it (sslrootcert=/etc/svp-ca/ca.crt); SSL_CERT_DIR=/etc/svp-ca adds it to the system's roots for
# Go, NODE_EXTRA_CA_CERTS=/etc/svp-ca/ca.crt for Node. Empty: the system's roots alone (a service without a database
# on EKS, whose Kafka and Valkey chain to a public CA).
localCA: local-ca

# -- Writable directories of a container whose root filesystem is read-only: name -> {mountPath, sizeLimit, medium}.
scratch: {}

# -- terminationGracePeriodSeconds of the pod; empty keeps Kubernetes' 30 s.
terminationGracePeriodSeconds: null
# -- Seconds the container waits in a preStop sleep before it gets SIGTERM, for a process that exits at once on SIGTERM
# while Envoy may still send it requests: Envoy routes to pod addresses from the EndpointSlices, and needs a moment to
# drop a terminating pod. Kubernetes' own sleep action, so it needs no shell in the image. Empty: no preStop.
preStopSleepSeconds: null

# -- Pods each release may be reached from (ingressFrom) and may reach (egressTo), by name of the peers below; DNS is
# open to every pod of svp already (chart svp-cluster). The namespace denies everything else in both directions, so
# the lists are the whole of a service's traffic. Ingress is opened on the service's own port, and on 15008 (HBONE of
# the mesh) beside it; a gRPC release also admits peer waypoint on 15008. Every peer of ingressFrom must be in the mesh.
ingressFrom: []
# -- Peers each release may reach, by name; see `ingressFrom`.
egressTo: []

# -- The pods of each peer, by namespace and labels, and the pod ports a client reaches them on (NetworkPolicy sees the
# packet after a Service has been translated to a pod). The labels of svp-data are the ones its chart sets; those of
# svp-obs are the labels of the pinned upstream charts there (helm template). `mesh` marks a peer in the Istio ambient
# mesh: its traffic to a pod of the mesh is HBONE on 15008, so the NetworkPolicies open 15008 to and from it beside its
# ports, and mesh.principal (or mesh.namespace, for pods whose ServiceAccount has no fixed name) is the identity the
# AuthorizationPolicies admit it by. mesh.viaWaypoint: the peer's Service sends its traffic through peer waypoint, so a
# client reaches the waypoint's pods on 15008 too. A peer without `mesh` (svp-data, svp-obs) is outside the mesh:
# ztunnel passes its traffic through as it is, and no release may name it in ingressFrom (STRICT mTLS refuses it).
peers:
  envoy:
    namespace: envoy-gateway-system
    labels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: svp
    # The proxy pods' ServiceAccount name ends in a hash: the namespace is their identity.
    mesh: {namespace: envoy-gateway-system}
  # The waypoint of chart svp-cluster in svp-mesh (Gateway waypoint), which istiod runs with ServiceAccount waypoint.
  waypoint:
    namespace: svp-mesh
    labels: {gateway.networking.k8s.io/gateway-name: waypoint}
    mesh: {principal: cluster.local/ns/svp-mesh/sa/waypoint}
  gateway:
    namespace: svp
    labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/component: server}
    ports: [8080]
    mesh: {principal: cluster.local/ns/svp/sa/gateway}
  web:
    namespace: svp
    labels: {app.kubernetes.io/name: web, app.kubernetes.io/component: server}
    ports: [3001]
    mesh: {principal: cluster.local/ns/svp/sa/web}
  user-service:
    namespace: svp
    labels: {app.kubernetes.io/name: user-service, app.kubernetes.io/component: server}
    ports: [9101]
    mesh: {principal: cluster.local/ns/svp/sa/user-service, viaWaypoint: true}
  video-service:
    namespace: svp
    labels: {app.kubernetes.io/name: video-service, app.kubernetes.io/component: server}
    ports: [9102]
    mesh: {principal: cluster.local/ns/svp/sa/video-service, viaWaypoint: true}
  engagement-service:
    namespace: svp
    labels: {app.kubernetes.io/name: engagement-service, app.kubernetes.io/component: server}
    ports: [9103]
    mesh: {principal: cluster.local/ns/svp/sa/engagement-service, viaWaypoint: true}
  feed-service:
    namespace: svp
    labels: {app.kubernetes.io/name: feed-service, app.kubernetes.io/component: server}
    ports: [9104]
    mesh: {principal: cluster.local/ns/svp/sa/feed-service, viaWaypoint: true}
  postgres:
    namespace: svp-data
    labels: {cnpg.io/cluster: svp-pg}
    ports: [5432]
  valkey:
    namespace: svp-data
    labels: {app.kubernetes.io/name: valkey}
    ports: [6379]
  kafka:
    namespace: svp-data
    labels: {app.kubernetes.io/name: kafka}
    ports: [9096]
  s3:
    namespace: svp-data
    labels: {app.kubernetes.io/name: s3}
    ports: [9000]
  collector:
    namespace: svp-obs
    labels: {app.kubernetes.io/name: opentelemetry-collector, app.kubernetes.io/instance: otel-collector}
    ports: [4317]
  pyroscope:
    namespace: svp-obs
    labels: {app.kubernetes.io/name: pyroscope, app.kubernetes.io/instance: pyroscope}
    ports: [4040]
  glitchtip:
    namespace: svp-obs
    labels: {app.kubernetes.io/name: glitchtip, app.kubernetes.io/component: server}
    ports: [8000]

# -- Peers that are not pods of the cluster where the cluster uses a managed service instead (EKS: Postgres on Amazon RDS,
# Kafka on Amazon MSK, Valkey on Amazon ElastiCache, objects on Amazon S3), by address: name of a peer above -> list of
# {cidr, ports}, each one rule of the egress of every release whose egressTo names that peer, and of the migrate Job
# for postgres and collector. Such an entry takes the place of the peer's pods. Empty: every peer is the pods above. On
# EKS, postgres, kafka and valkey are the database subnets' CIDRs on 5432, 9096 and 6379; s3 is
# TCP 443 to each IPv4 range AWS publishes for S3 in the cluster's region (they change over time, so the list is read
# when the cluster's Terraform is applied), never 0.0.0.0/0:
# media-worker runs ffmpeg on uploaded files, and a worker taken over by a crafted file must not reach any other host.
# s3 also holds the EKS Pod Identity Agent, 169.254.170.23/32 TCP 80, where the pods that reach S3 (the only ones with
# an AWS role) get their credentials. An entry of 0.0.0.0/0 or ::/0 fails the render.
externalPeers: {}

# -- HTTPRoute on Gateway svp (svp-edge) to this release's Service, for a release that sets a host (the gateway, the web
# client); no other service is reached from outside the cluster. name: the route's name, empty for the release's name
# (the canary's Envoy cluster and the Rollout's traffic routing follow it). sectionName: the listener of Gateway svp it
# attaches to (chart svp-cluster): https for *.svp.localhost, https-apex for svp.localhost alone.
httpRoute:
  host: ""
  name: ""
  sectionName: https
