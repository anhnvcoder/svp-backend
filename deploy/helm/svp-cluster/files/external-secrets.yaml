# The Secrets of the GitOps path, one ExternalSecret each (templates/external-secrets.yaml renders them when
# externalSecrets.enabled): the same names, namespaces, keys and types as deploy/k8s/secrets.sh and glitchtip-init.sh
# apply on the dev path, and argocd-notifications-secret of the GitOps path alone. Keep the two lists in step.

# Read by Helm with .Files.Get, so the templates below are External Secrets Operator's (Go text/template), not Helm's.
# values: NAME: ENTRY/KEY, key KEY of entry ENTRY of the source. template: the Secret's keys over those NAMEs. The
# inClusterObjectStore keys leave out what a managed store needs no static key for. sharedNamespace: a namespace of
# another chart, where the controller may write this Secret alone (policy svp-external-secrets-writes).

# Every ExternalSecret gets a target template, at least its type: without one ESO copies the ExternalSecret's labels and
# annotations onto the Secret, and every forced sync would change its resourceVersion for nothing.

# --- svp-data
- namespace: svp-data
  name: pg-superuser
  type: kubernetes.io/basic-auth
  labels:
    cnpg.io/reload: "true"
  values:
    password: pg-superuser/SVP_PG_SUPERUSER_PASSWORD
  template:
    username: postgres
    password: "{{ .password }}"
- namespace: svp-data
  name: pg-roles
  values:
    SVP_USER_MIGRATOR_DB_PASSWORD: pg-roles/SVP_USER_MIGRATOR_DB_PASSWORD
    SVP_USER_APP_DB_PASSWORD: pg-roles/SVP_USER_APP_DB_PASSWORD
    SVP_VIDEO_MIGRATOR_DB_PASSWORD: pg-roles/SVP_VIDEO_MIGRATOR_DB_PASSWORD
    SVP_VIDEO_APP_DB_PASSWORD: pg-roles/SVP_VIDEO_APP_DB_PASSWORD
    SVP_ENGAGEMENT_MIGRATOR_DB_PASSWORD: pg-roles/SVP_ENGAGEMENT_MIGRATOR_DB_PASSWORD
    SVP_ENGAGEMENT_APP_DB_PASSWORD: pg-roles/SVP_ENGAGEMENT_APP_DB_PASSWORD
    SVP_FEED_MIGRATOR_DB_PASSWORD: pg-roles/SVP_FEED_MIGRATOR_DB_PASSWORD
    SVP_FEED_APP_DB_PASSWORD: pg-roles/SVP_FEED_APP_DB_PASSWORD
    SVP_GLITCHTIP_MIGRATOR_DB_PASSWORD: pg-roles/SVP_GLITCHTIP_MIGRATOR_DB_PASSWORD
    SVP_GLITCHTIP_APP_DB_PASSWORD: pg-roles/SVP_GLITCHTIP_APP_DB_PASSWORD
- namespace: svp-data
  name: s3-root
  inClusterObjectStore: true
  values:
    password: s3-root/SVP_S3_ROOT_PASSWORD
  template:
    S3_ROOT_USER: svp-admin
    S3_ROOT_PASSWORD: "{{ .password }}"
- namespace: svp-data
  name: s3-users
  inClusterObjectStore: true
  values:
    SVP_VIDEO_S3_SECRET_KEY: s3-users/SVP_VIDEO_S3_SECRET_KEY
    SVP_MEDIA_WORKER_S3_SECRET_KEY: s3-users/SVP_MEDIA_WORKER_S3_SECRET_KEY
    SVP_PG_BACKUP_S3_SECRET_KEY: s3-users/SVP_PG_BACKUP_S3_SECRET_KEY
- namespace: svp-data
  name: pg-backup-s3
  inClusterObjectStore: true
  values:
    secret_key: s3-users/SVP_PG_BACKUP_S3_SECRET_KEY
  template:
    ACCESS_KEY_ID: svp-pg-backup
    ACCESS_SECRET_KEY: "{{ .secret_key }}"
# Kafka's svp-admin: the init Job's login (and with the broker in the cluster, the credential it is formatted with).
- namespace: svp-data
  name: kafka-admin
  values:
    SVP_KAFKA_ADMIN_PASSWORD: kafka-admin/SVP_KAFKA_ADMIN_PASSWORD
# The operations CLI (Deployment svp-ops): svp-admin on Kafka, svp-ops on Valkey.
- namespace: svp-data
  name: svp-ops
  values:
    SVP_KAFKA_ADMIN_PASSWORD: kafka-admin/SVP_KAFKA_ADMIN_PASSWORD
    SVP_VALKEY_OPS_PASSWORD: valkey-users/SVP_VALKEY_OPS_PASSWORD
# The rest of svp-data only where Kafka and Valkey run in the cluster (externalSecrets.localKafkaValkey): a managed
# Kafka keeps its users itself, a managed Valkey its ACL users, and their certificates chain to a public CA.
# The users the init Job creates on the broker, keys named as kafka-init.sh reads them.
- namespace: svp-data
  name: kafka-users
  enabledBy: localKafkaValkey
  values:
    SVP_KAFKA_USER_SERVICE_PASSWORD: kafka-users/SVP_KAFKA_USER_SERVICE_PASSWORD
    SVP_KAFKA_VIDEO_SERVICE_PASSWORD: kafka-users/SVP_KAFKA_VIDEO_SERVICE_PASSWORD
    SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD: kafka-users/SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD
    SVP_KAFKA_FEED_SERVICE_PASSWORD: kafka-users/SVP_KAFKA_FEED_SERVICE_PASSWORD
    SVP_KAFKA_MEDIA_WORKER_PASSWORD: kafka-users/SVP_KAFKA_MEDIA_WORKER_PASSWORD
    SVP_KAFKA_KEDA_PASSWORD: kafka-users/SVP_KAFKA_KEDA_PASSWORD
    SVP_KAFKA_OTELCOL_PASSWORD: kafka-users/SVP_KAFKA_OTELCOL_PASSWORD
# The ACL file of Valkey: the access strings of deploy/valkey/aclfile.sh (compose) word for word, the same strings
# ElastiCache's users get; user default off.
- namespace: svp-data
  name: valkey-acl
  enabledBy: localKafkaValkey
  values:
    gateway: valkey-users/SVP_VALKEY_GATEWAY_PASSWORD
    feed: valkey-users/SVP_VALKEY_FEED_SERVICE_PASSWORD
    web: valkey-users/SVP_VALKEY_WEB_PASSWORD
    ops: valkey-users/SVP_VALKEY_OPS_PASSWORD
  template:
    users.acl: |
      user svp-gateway on ~svp:gw:* resetchannels db=10 -@all +select +client|setinfo +eval +evalsha +time +get +set +del >{{ .gateway }}
      user svp-feed-service on ~svp:feed:* resetchannels db=14 -@all +select +client|setinfo +get +set >{{ .feed }}
      user svp-web on ~svp:web:* resetchannels db=9 -@all +select +client|setinfo +eval +get +set +del +exists >{{ .web }}
      user svp-ops on ~svp:* resetchannels db=9,10,14 -@all +select +ping +time +scan +get +mget +pttl (~svp:gw:rl:register:* resetchannels db=10 -@all +del) (~svp:feed:explore:* resetchannels db=14 -@all +del) >{{ .ops }}
      user default off
# The local CA's server certificate (one for both servers), from entry local-tls, which only svp-data reads: the key
# and certificate chain in one PEM file for Kafka, the two files for Valkey.
- namespace: svp-data
  name: kafka-tls
  enabledBy: localKafkaValkey
  values:
    key: local-tls/server.key
    crt: local-tls/server.crt
  template:
    kafka.pem: "{{ .key | trim }}\n{{ .crt | trim }}\n"
- namespace: svp-data
  name: valkey-tls
  enabledBy: localKafkaValkey
  values:
    valkey.crt: local-tls/server.crt
    valkey.key: local-tls/server.key
# The local CA's certificate (public) for the clients of Kafka and Valkey in each namespace: the init Job and svp-ops,
# the services, the Collector, KEDA's Kafka scaler. Entry local-ca holds nothing else.
- namespace: svp-data
  name: local-ca
  enabledBy: localKafkaValkey
  values:
    ca.crt: local-ca/ca.crt

# --- svp: one Secret per service, each with only what that service's pods use; the JWT signing key in user-service-env
# alone, the public keys in the gateway's and the four gRPC services'.
- namespace: svp
  name: user-service-env
  values:
    db: pg-roles/SVP_USER_APP_DB_PASSWORD
    kid: jwt-signing/JWT_SIGNING_KID
    key: jwt-signing/JWT_SIGNING_KEY
    kafka: kafka-users/SVP_KAFKA_USER_SERVICE_PASSWORD
    jwt: jwt-verify/JWT_VERIFY_KEYS
  template:
    DATABASE_URL: "postgres://svp_user_app:{{ .db }}@${postgres}/svp_user?sslmode=require"
    JWT_SIGNING_KID: "{{ .kid }}"
    JWT_SIGNING_KEY: "{{ .key }}"
    KAFKA_SASL_USERNAME: svp-user-service
    KAFKA_SASL_PASSWORD: "{{ .kafka }}"
    JWT_VERIFY_KEYS: "{{ .jwt }}"
- namespace: svp
  name: video-service-env
  inClusterObjectStoreKeys: [s3, S3_SECRET_ACCESS_KEY]
  values:
    db: pg-roles/SVP_VIDEO_APP_DB_PASSWORD
    kafka: kafka-users/SVP_KAFKA_VIDEO_SERVICE_PASSWORD
    s3: s3-users/SVP_VIDEO_S3_SECRET_KEY
    jwt: jwt-verify/JWT_VERIFY_KEYS
  template:
    DATABASE_URL: "postgres://svp_video_app:{{ .db }}@${postgres}/svp_video?sslmode=require"
    KAFKA_SASL_USERNAME: svp-video-service
    KAFKA_SASL_PASSWORD: "{{ .kafka }}"
    S3_SECRET_ACCESS_KEY: "{{ .s3 }}"
    JWT_VERIFY_KEYS: "{{ .jwt }}"
- namespace: svp
  name: engagement-service-env
  values:
    db: pg-roles/SVP_ENGAGEMENT_APP_DB_PASSWORD
    kafka: kafka-users/SVP_KAFKA_ENGAGEMENT_SERVICE_PASSWORD
    jwt: jwt-verify/JWT_VERIFY_KEYS
  template:
    DATABASE_URL: "postgres://svp_engagement_app:{{ .db }}@${postgres}/svp_engagement?sslmode=require"
    KAFKA_SASL_USERNAME: svp-engagement-service
    KAFKA_SASL_PASSWORD: "{{ .kafka }}"
    JWT_VERIFY_KEYS: "{{ .jwt }}"
- namespace: svp
  name: feed-service-env
  values:
    db: pg-roles/SVP_FEED_APP_DB_PASSWORD
    kafka: kafka-users/SVP_KAFKA_FEED_SERVICE_PASSWORD
    valkey: valkey-users/SVP_VALKEY_FEED_SERVICE_PASSWORD
    jwt: jwt-verify/JWT_VERIFY_KEYS
  template:
    DATABASE_URL: "postgres://svp_feed_app:{{ .db }}@${postgres}/svp_feed?sslmode=require"
    KAFKA_SASL_USERNAME: svp-feed-service
    KAFKA_SASL_PASSWORD: "{{ .kafka }}"
    REDIS_URL: "rediss://svp-feed-service:{{ .valkey }}@${valkey}/14"
    JWT_VERIFY_KEYS: "{{ .jwt }}"
- namespace: svp
  name: media-worker-env
  inClusterObjectStoreKeys: [s3, S3_SECRET_ACCESS_KEY]
  values:
    kafka: kafka-users/SVP_KAFKA_MEDIA_WORKER_PASSWORD
    s3: s3-users/SVP_MEDIA_WORKER_S3_SECRET_KEY
  template:
    KAFKA_SASL_USERNAME: svp-media-worker
    KAFKA_SASL_PASSWORD: "{{ .kafka }}"
    S3_SECRET_ACCESS_KEY: "{{ .s3 }}"
- namespace: svp
  name: gateway-env
  values:
    valkey: valkey-users/SVP_VALKEY_GATEWAY_PASSWORD
    jwt: jwt-verify/JWT_VERIFY_KEYS
  template:
    REDIS_URL: "rediss://svp-gateway:{{ .valkey }}@${valkey}/10"
    JWT_VERIFY_KEYS: "{{ .jwt }}"
- namespace: svp
  name: web-env
  values:
    valkey: valkey-users/SVP_VALKEY_WEB_PASSWORD
    key: web/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
  template:
    REDIS_URL: "rediss://svp-web:{{ .valkey }}@${valkey}/9"
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .key }}"
- namespace: svp
  name: user-service-migrate-env
  values:
    db: pg-roles/SVP_USER_MIGRATOR_DB_PASSWORD
  template:
    DATABASE_URL: "postgres://svp_user_migrator:{{ .db }}@${postgres}/svp_user?sslmode=require"
- namespace: svp
  name: video-service-migrate-env
  values:
    db: pg-roles/SVP_VIDEO_MIGRATOR_DB_PASSWORD
  template:
    DATABASE_URL: "postgres://svp_video_migrator:{{ .db }}@${postgres}/svp_video?sslmode=require"
- namespace: svp
  name: engagement-service-migrate-env
  values:
    db: pg-roles/SVP_ENGAGEMENT_MIGRATOR_DB_PASSWORD
  template:
    DATABASE_URL: "postgres://svp_engagement_migrator:{{ .db }}@${postgres}/svp_engagement?sslmode=require"
- namespace: svp
  name: feed-service-migrate-env
  values:
    db: pg-roles/SVP_FEED_MIGRATOR_DB_PASSWORD
  template:
    DATABASE_URL: "postgres://svp_feed_migrator:{{ .db }}@${postgres}/svp_feed?sslmode=require"
# GlitchTip's DSN, empty until deploy/k8s/glitchtip-init.sh writes it into the entry (an empty DSN turns error
# reporting off, as in compose); the Secret exists from the start, so this ExternalSecret is Ready before GlitchTip runs.
- namespace: svp
  name: sentry
  values:
    SENTRY_DSN: glitchtip-runtime/SENTRY_DSN
- namespace: svp
  name: local-ca
  enabledBy: localKafkaValkey
  values:
    ca.crt: local-ca/ca.crt

# --- svp-obs
- namespace: svp-obs
  name: grafana-admin
  values:
    password: obs/SVP_GRAFANA_ADMIN_PASSWORD
  template:
    admin-user: admin
    admin-password: "{{ .password }}"
# Alertmanager's routing, the third copy of it beside alertmanager_config of deploy/k8s/secrets.sh and
# deploy/observability/alertmanager/entrypoint.sh (keep the three in step): severity="page" to Telegram when the bot
# token is set and the chat id is an integer, everything else only listed in the UI and API.
- namespace: svp-obs
  name: alertmanager-svp
  values:
    bot_token: obs/SVP_ALERT_TELEGRAM_BOT_TOKEN
    chat_id: obs/SVP_ALERT_TELEGRAM_CHAT_ID
  template:
    alertmanager.yaml: |
      {{- $telegram := and .bot_token (regexMatch "^-?[0-9]+$" .chat_id) -}}
      route:
        receiver: ui-only
        group_by: [alertname, severity]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 4h
        routes:
          - matchers: ['severity="page"']
            receiver: {{ if $telegram }}telegram{{ else }}ui-only{{ end }}
      receivers:
        # No integration: alerts routed here are only listed in the UI and API.
        - name: ui-only
      {{- if $telegram }}
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
              chat_id: {{ .chat_id }}
              send_resolved: true
      {{- end }}
# The bot token, empty while Telegram is off: Alertmanager's pod mounts the Secret in any case.
- namespace: svp-obs
  name: alertmanager-telegram
  values:
    bot_token: obs/SVP_ALERT_TELEGRAM_BOT_TOKEN
    chat_id: obs/SVP_ALERT_TELEGRAM_CHAT_ID
  template:
    bot_token: '{{ if and .bot_token (regexMatch "^-?[0-9]+$" .chat_id) }}{{ .bot_token }}{{ end }}'
- namespace: svp-obs
  name: glitchtip-env
  values:
    secret_key: obs/GLITCHTIP_SECRET_KEY
    app: pg-roles/SVP_GLITCHTIP_APP_DB_PASSWORD
    migrator: pg-roles/SVP_GLITCHTIP_MIGRATOR_DB_PASSWORD
  template:
    SECRET_KEY: "{{ .secret_key }}"
    DATABASE_URL: "postgres://svp_glitchtip_app:{{ .app }}@${postgres}/svp_glitchtip?sslmode=require"
    MAINTENANCE_DATABASE_URL: "postgres://svp_glitchtip_migrator:{{ .migrator }}@${postgres}/svp_glitchtip?sslmode=require"
- namespace: svp-obs
  name: glitchtip-admin
  values:
    GLITCHTIP_ADMIN_EMAIL: obs/GLITCHTIP_ADMIN_EMAIL
    GLITCHTIP_ADMIN_PASSWORD: obs/GLITCHTIP_ADMIN_PASSWORD
# GlitchTip's two API tokens, empty until deploy/k8s/glitchtip-init.sh writes them; whoever reads them takes empty for
# missing.
- namespace: svp-obs
  name: glitchtip-api
  values:
    SENTRY_AUTH_TOKEN: glitchtip-runtime/SENTRY_AUTH_TOKEN
- namespace: svp-obs
  name: glitchtip-sourcemaps
  values:
    SENTRY_SOURCEMAPS_TOKEN: glitchtip-runtime/SENTRY_SOURCEMAPS_TOKEN
# The Collector's kafkametrics receiver, Kafka user svp-otelcol.
- namespace: svp-obs
  name: otelcol-kafka
  values:
    password: kafka-users/SVP_KAFKA_OTELCOL_PASSWORD
- namespace: svp-obs
  name: local-ca
  enabledBy: localKafkaValkey
  values:
    ca.crt: local-ca/ca.crt

# --- keda: KEDA's login to Kafka, keys named after the Kafka scaler's parameters; its ca, where the broker's
# certificate chains to the local CA, is ca.crt of local-ca (ClusterTriggerAuthentication keda-kafka of chart svp-data).
- namespace: keda
  name: keda-kafka
  values:
    password: kafka-users/SVP_KAFKA_KEDA_PASSWORD
  template:
    sasl: scram_sha512
    tls: enable
    username: svp-keda
    password: "{{ .password }}"
- namespace: keda
  name: local-ca
  enabledBy: localKafkaValkey
  values:
    ca.crt: local-ca/ca.crt

# --- argocd: the Secret of Argo CD Notifications (externalSecrets.argocdNotifications), whose keys its service config
# names ($github-appID...): the GitHub App that may only write commit statuses on svp-gitops, and the Telegram bot
# token. The private key is base64 on one line in the source (.env takes no multi-line value), decoded here. The entry
# holds the bot token too, so argocd's store reads no entry of svp-obs. Argo CD's chart makes no such Secret.
- namespace: argocd
  name: argocd-notifications-secret
  enabledBy: argocdNotifications
  sharedNamespace: true
  values:
    app_id: argocd-notifications/SVP_ARGOCD_NOTIFY_APP_ID
    installation_id: argocd-notifications/SVP_ARGOCD_NOTIFY_INSTALLATION_ID
    private_key: argocd-notifications/SVP_ARGOCD_NOTIFY_PRIVATE_KEY_B64
    telegram: argocd-notifications/SVP_ALERT_TELEGRAM_BOT_TOKEN
  template:
    github-appID: "{{ .app_id }}"
    github-installationID: "{{ .installation_id }}"
    github-privateKey: "{{ .private_key | b64dec }}"
    telegram-token: "{{ .telegram }}"
