# OPS-1 of the threat model (docs/threat-model.md): no debug or metrics endpoint is reachable through Envoy.
# /debug/pprof/, /debug/pprof/heap and /metrics at https://api.svp.localhost:8443 are 404; control: /healthz 200 (Envoy
# reaches the gateway, so a 404 is the gateway's answer, not a route that is down).

# curl takes the cluster's CA from CURL_CA_BUNDLE, which the make target sets.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ops-1
  labels:
    drill: threats
spec:
  description: "OPS-1: /debug/pprof/, /debug/pprof/heap and /metrics are 404 through Envoy; control: /healthz 200"
  # An existing namespace: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: "OPS-1: setup: gateway ready through Envoy within 60 s"
    try:
    - script:
        content: |
          set -eu
          deadline=$(( $(date +%s) + 60 ))
          until [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' https://api.svp.localhost:8443/readyz || true)" = 200 ]; do
            [ "$(date +%s)" -lt "$deadline" ] || { echo "FAIL  readyz within 60s" >&2; exit 1; }
            sleep 1
          done
          echo readyz
        check:
          ($error): ~

  # One GET through Envoy per step; the step prints the HTTP status (000: nothing answered).
  - name: "OPS-1: GET /debug/pprof/ through Envoy: 404"
    bindings:
    - {name: path, value: /debug/pprof/}
    - {name: want, value: "404"}
    try: &status
    - script:
        env:
        - {name: URL_PATH, value: ($path)}
        content: |
          curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "https://api.svp.localhost:8443$URL_PATH" || true
        check:
          ($error): ~
          (trim_space($stdout)): ($want)
      continueOnError: true
  - name: "OPS-1: GET /debug/pprof/heap through Envoy: 404"
    bindings:
    - {name: path, value: /debug/pprof/heap}
    - {name: want, value: "404"}
    try: *status
  - name: "OPS-1: GET /metrics through Envoy: 404"
    bindings:
    - {name: path, value: /metrics}
    - {name: want, value: "404"}
    try: *status
  - name: "OPS-1: control: /healthz through Envoy 200: Envoy reaches the gateway on 8080"
    bindings:
    - {name: path, value: /healthz}
    - {name: want, value: "200"}
    try: *status
