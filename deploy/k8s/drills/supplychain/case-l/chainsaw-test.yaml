# Supply chain drill, case l: an image signed and attested vuln like a release, but without build provenance, sent as
# a server-side dry run of a pod of svp: refused with the provenance rule's message, only when the running policy
# checks provenance (requireProvenance of chart svp-policy: it has attestation provenance); otherwise SKIP "policy
# off". The image is value noProvenance when given, otherwise the newest drill-no-provenance under the prefix of release
# source backend on GHCR (deploy/ci/ghcr-digest.sh newest, anonymous: the drill image CI signs and attests vuln and
# never attests provenance); noProvenance=none leaves the case out (SKIP), for a caller that knows that image is past
# the maximum age. Kyverno checks provenance after every other rule, so the refusal shows the provenance rule only if
# the image passes all of them: before sending the pod the case checks with cosign (anonymous) that the image is
# signed, has exactly one vuln attestation of both platforms, no CRITICAL, scanned within the policy's maximum age, and
# has no provenance attestation; otherwise, or when no drill-no-provenance is found, the case fails, naming the
# dispatch that builds the drill images again (no image file of svp-gitops names a drill image, so the daily rescan
# never attests it again).
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-l
  labels:
    drill: supplychain
spec:
  description: (l) a signed image with a clean vuln attestation but no build provenance is refused by the provenance rule
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: l-setup
    description: (l) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: l
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: l-no-provenance
    description: (l) the image without provenance passes every other rule (cosign), then is refused by the provenance rule
    try:
    - continueOnError: true
      script:
        shell: bash
        timeout: 8m
        env: *env
        content: |
          . ../lib.sh
          no_provenance=${NO_PROVENANCE:-}
          if [ "$(st provenance)" != yes ]; then
            skip "policy off: $policy has no provenance attestation to check (requireProvenance of chart svp-policy is off at the revision the cluster runs)"
            exit 0
          elif [ "$no_provenance" = none ]; then
            skip "SUPPLYCHAIN_NO_PROVENANCE=none (value noProvenance): the caller left the case out"
            exit 0
          fi
          if [ -z "$no_provenance" ]; then
            no_provenance=$("$repo_root/deploy/ci/ghcr-digest.sh" newest drill-no-provenance 2>"$work/newest.err") ||
              no_provenance=
          fi
          if [ -n "$no_provenance" ]; then
            image_identity "$no_provenance"
            envelopes=$(cosign_ verify-attestation --type vuln --certificate-oidc-issuer "$policy_issuer" \
              --certificate-identity "$policy_subject" "$no_provenance" 2>"$work/cosign.err") || envelopes=
          fi
          if [ -z "$no_provenance" ]; then
            result FAIL "find the newest ${prefix}drill-no-provenance on GHCR (got: $(tail -n 1 "$work/newest.err")); build the drill images ($rebuild)"
          elif ! cosign_ verify --certificate-oidc-issuer "$policy_issuer" --certificate-identity "$policy_subject" \
            "$no_provenance" >/dev/null 2>"$work/cosign.err"; then
            result FAIL "$no_provenance: a signature of $policy_subject that cosign verifies (got: $(tail -n 1 "$work/cosign.err"))"
          elif [[ $(grep -c . <<<"$envelopes") != 1 ]]; then
            result FAIL "$no_provenance: exactly one vuln attestation of $policy_subject (got $(grep -c . <<<"$envelopes")); build the drill images again ($rebuild)"
          elif ! problem=$(jq -r '.payload | @base64d' <<<"$envelopes" | check_vuln_statement "${no_provenance#*@}" "$max_age_s"); then
            result FAIL "$no_provenance: its vuln attestation $problem, so Kyverno would refuse it before the provenance rule; build the drill images again ($rebuild), then run this within $max_age"
          else
            absent=0
            provenance_absent "$policy_issuer" "$policy_subject" "$no_provenance" 2>"$work/cosign.err" || absent=$?
            case $absent in
            0)
              dry_run drill-supplychain-l svp "$no_provenance"
              refused "image without a provenance attestation signed by" "$no_provenance (signed, clean vuln attestation within $max_age, no provenance)"
              ;;
            1) result FAIL "$no_provenance carries a provenance attestation of $policy_subject: case l needs an image without one (drill-no-provenance, the default)" ;;
            *) result FAIL "$no_provenance: cosign could not tell whether it carries a provenance attestation (got: $(tail -n 1 "$work/cosign.err"))" ;;
            esac
          fi
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (l) ') || contains($stdout, 'SKIP  (l) ')): true
