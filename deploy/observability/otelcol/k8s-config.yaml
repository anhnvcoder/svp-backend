# Collector of a Kubernetes cluster: release otel-collector in namespace svp-obs, Service otel-collector.svp-obs:4317.
# The part every platform shares: the receivers and scrubbing processors of config.yaml of the compose `obs` profile.
# Where the data goes is in one destination file per platform (k8s-k3d.yaml, k8s-eks.yaml): chart svp-observability
# deep-merges the chosen one over this file into ConfigMap otel-collector-config (key relay), with no Helm templating.

# Keep receivers and processors in step with config.yaml; `make otelcol-validate` checks this file with each
# destination file, loaded together as the chart merges them. Design notes: docs/explanation/observability.md.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  # As in compose: consumer group lag and the broker count, read as user svp-otelcol. The three variables come from the
  # Collector's environment: brokers and CA file as values, the password from Secret otelcol-kafka.
  kafka_metrics:
    brokers: ${env:SVP_OTELCOL_KAFKA_BROKERS}
    cluster_alias: svp
    scrapers: [brokers, consumers]
    collection_interval: 15s
    tls:
      ca_file: ${env:SVP_OTELCOL_KAFKA_CA_FILE}
    auth:
      sasl:
        mechanism: SCRAM-SHA-512
        username: svp-otelcol
        password: ${env:SVP_KAFKA_OTELCOL_PASSWORD}
    resource_attributes:
      kafka.cluster.alias:
        enabled: true

processors:
  # In a 256 MiB container (the chart's resources.limits.memory): refuses data from 144 MiB of heap (the soft limit,
  # limit_mib minus spike_limit_mib) and forces a GC from 192 MiB, instead of being OOM-killed. It measures the heap
  # of the whole process, so over the soft limit every receiver is refused, whichever signal filled it.

  # GOMEMLIMIT (140 MiB, base/otel-collector.yaml of svp-gitops) sits just under the soft limit so that the Go runtime
  # collects garbage before the limiter counts it.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  # A second line of defence only: services must not record these in the first place.
  # Signal attributes (span, log record, data point) and resource attributes are both scrubbed.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: user.email
        action: delete
      - key: user.name
        action: delete
  resource/scrub:
    attributes:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: user.email
        action: delete
      - key: user.name
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 1024
    # Caps a batch, not only triggers it: the remote write queue counts batches, so its memory bound needs this.
    send_batch_max_size: 1024
