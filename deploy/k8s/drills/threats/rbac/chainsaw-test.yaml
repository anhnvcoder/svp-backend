    - description: "RBAC control: as the same user, can-i says yes to create secrets in cnpg-system (the operator's CA Secret)"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: AS, value: system:serviceaccount:cnpg-system:cloudnative-pg}
        - {name: CAN_I, value: create secrets -n cnpg-system}
        content: *can-i
        check:
          (trim_space($stdout)): 'yes'
  # The CloudNativePG operator may create Secrets in cnpg-system (its CA, cnpg-ca-secret, made at start), and RBAC cannot
  # narrow create by name, so ValidatingAdmissionPolicy svp-cnpg-operator-secrets (chart svp-cluster,
  # templates/cnpg-rbac.yaml) keeps its writes there to cnpg-ca-secret and cnpg-webhook-cert. Server-side dry runs, as the
  # operator's ServiceAccount but for one control: nothing is written. Each Secret names ServiceAccount
  # plugin-barman-cloud.
  - name: rbac-cnpg-secrets
    try:
    - description: "RBAC: cnpg-system/cloudnative-pg may not create a token Secret for ServiceAccount plugin-barman-cloud in cnpg-system (refused by ValidatingAdmissionPolicy svp-cnpg-operator-secrets)"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: NAME, value: drill-plugin-token}
        - {name: TYPE, value: kubernetes.io/service-account-token}
        content: &cnpg-secret |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          jq -n --arg name "$NAME" --arg type "$TYPE" '{apiVersion: "v1", kind: "Secret", type: $type, metadata: {name: $name,
            namespace: "cnpg-system", annotations: {"kubernetes.io/service-account.name": "plugin-barman-cloud"}}}' |
            kubectl --context k3d-svp create --dry-run=server -f - --as=system:serviceaccount:cnpg-system:cloudnative-pg 2>&1 || true
        check:
          (wildcard('*ValidatingAdmissionPolicy \'svp-cnpg-operator-secrets\'*denied*', $stdout)): true
    - description: "RBAC: cnpg-system/cloudnative-pg may not create that token Secret named cnpg-ca-secret in cnpg-system (refused by ValidatingAdmissionPolicy svp-cnpg-operator-secrets)"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: NAME, value: cnpg-ca-secret}
        - {name: TYPE, value: kubernetes.io/service-account-token}
        content: *cnpg-secret
        check:
          (wildcard('*ValidatingAdmissionPolicy \'svp-cnpg-operator-secrets\'*denied*', $stdout)): true
    - description: "RBAC: cnpg-system/cloudnative-pg may not create an Opaque Secret of a name other than cnpg-ca-secret in cnpg-system (refused by ValidatingAdmissionPolicy svp-cnpg-operator-secrets)"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: NAME, value: drill-opaque}
        - {name: TYPE, value: Opaque}
        content: *cnpg-secret
        check:
          (wildcard('*ValidatingAdmissionPolicy \'svp-cnpg-operator-secrets\'*denied*', $stdout)): true
    - description: "RBAC control: as the operator, an Opaque cnpg-ca-secret passes ValidatingAdmissionPolicy svp-cnpg-operator-secrets and is refused only as AlreadyExists"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: NAME, value: cnpg-ca-secret}
        - {name: TYPE, value: Opaque}
        content: *cnpg-secret
        check:
          (wildcard('*AlreadyExists*', $stdout) || wildcard('*already exists*', $stdout)): true
          (wildcard('*ValidatingAdmissionPolicy \'svp-cnpg-operator-secrets\'*', $stdout)): false
    - description: "RBAC control: as the test's admin, the same token Secret is admitted in cnpg-system: the policy holds the operator only (server-side dry run)"
      continueOnError: true
      create:
        dryRun: true
        resource:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/service-account-token
          metadata:
            name: drill-plugin-token
            namespace: cnpg-system
            annotations:
              kubernetes.io/service-account.name: plugin-barman-cloud
        expect:
        - check:
            ($error): ~
    - description: "RBAC: cnpg-system holds a TLS Secret other than cnpg-webhook-cert (the Barman Cloud plugin's) to update as the operator"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        content: |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          kubectl --context k3d-svp -n cnpg-system get secrets --field-selector type=kubernetes.io/tls -o name |
            grep -vx 'secret/cnpg-webhook-cert' | head -n 1 || true
        check:
          (trim_space($stdout) != ''): true
        outputs:
        - name: otherTls
          value: (trim_space($stdout))
    - description: "RBAC: cnpg-system/cloudnative-pg may not update that TLS Secret in cnpg-system (refused by ValidatingAdmissionPolicy svp-cnpg-operator-secrets)"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: TARGET, value: ($otherTls)}
        content: &cnpg-label |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          kubectl --context k3d-svp -n cnpg-system label "$TARGET" svp-drill=threats --dry-run=server \
            --as=system:serviceaccount:cnpg-system:cloudnative-pg 2>&1 || true
        check:
          (wildcard('*ValidatingAdmissionPolicy \'svp-cnpg-operator-secrets\'*denied*', $stdout)): true
    - description: "RBAC control: as the operator, an update of cnpg-webhook-cert passes ValidatingAdmissionPolicy svp-cnpg-operator-secrets"
      continueOnError: true
      script:
        env:
        - *kubeconfig
        - {name: TARGET, value: secret/cnpg-webhook-cert}
        content: *cnpg-label
        check:
          (contains($stdout, 'labeled (server dry run)')): true

  - name: rbac-exceptions
    try:
    - description: "RBAC exceptions (info): the rights that stay, with their reason"
      script:
        content: |
          echo "info  RBAC exception: Envoy Gateway reads the Secrets of svp and svp-data, which it watches for routes api and s3 (its Secret cache covers every watched namespace; base/envoy-gateway.yaml of svp-gitops)"
          echo "info  RBAC exception: cert-manager's controller and cainjector read Secrets in every namespace, cainjector patches every webhook configuration, the controller creates pods in every namespace (Certificates in cert-manager, svp-edge, keda and cnpg-system, ClusterIssuers svp-selfsigned and svp-ca; base/cert-manager.yaml of svp-gitops); its pods are held to PSA restricted everywhere but kube-system (PSA-platform)"
          echo "info  RBAC exception: Argo CD's application controller and server (GitOps path) hold rights on every resource of the cluster, Secrets included: they apply every chart"
          echo "info  RBAC exception: the Barman Cloud plugin (cnpg-system/plugin-barman-cloud, backups of Postgres svp-pg) reads, creates and deletes the Secrets of every namespace, the JWT signing key of svp included, and creates Roles and RoleBindings everywhere: its manager caches the whole cluster with no flag to narrow it, so a Role per namespace as for CloudNativePG would leave it failing on permissions (threat model BAK-1, accepted for the lab; base/plugin-barman-cloud.yaml of svp-gitops); the CloudNativePG operator beside it in cnpg-system may neither run code as its ServiceAccount nor get it a token (checked above)"
          echo "info  RBAC exception: Kyverno's admission controller creates, patches and deletes every webhook configuration and validating admission policy of the cluster: it registers the webhooks of its policies itself (a taken-over controller could send itself any request, or drop the image policy's webhook); its reports controller reads the pods of every namespace (what the policy matches; the chart's view binding is off, base/kyverno.yaml of svp-gitops)"
        check:
          ($error): ~
