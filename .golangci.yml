# golangci-lint v2 configuration.
version: "2"

linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - misspell
    - sloglint
    - revive
    - gocritic
  # contextcheck stays off: it reports every context derived through a helper (callContext(r) wrapping r.Context(),
  # middleware closures) as "non-inherited", which is noise rather than a missing trace.
  settings:
    sloglint:
      no-mixed-args: true
      context: scope
      static-msg: true
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    # Skip files carrying the "Code generated ... DO NOT EDIT." header (protobuf, sqlc) and gen/.
    generated: lax
    paths:
      - ^gen/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^gen/
