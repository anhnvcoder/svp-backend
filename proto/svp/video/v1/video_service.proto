syntax = "proto3";

package svp.video.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// VideoService owns video metadata and the video lifecycle
// (UPLOADING -> PROCESSING -> READY or FAILED), and drives the upload saga.
//
// Caller identity: the gateway forwards the caller's access token in the gRPC
// metadata key `authorization` as `Bearer <token>`; the service verifies it
// and takes the caller from its `sub`. Requests never carry the caller's own
// id. Every RPC but GetPublicVideo requires it and returns UNAUTHENTICATED
// when it is missing or invalid.
//
// All ids are UUIDv7 strings in canonical lowercase form (36 chars). Media
// locations are object keys (for example
// `media/<video_id>/<version>/master.m3u8`),
// never absolute URLs: the gateway builds public URLs from per-environment
// configuration (the local object store, a CDN in the cloud).
service VideoService {
  // InitUpload creates a video in UPLOADING owned by the caller and returns a
  // presigned POST for the object key `uploads/<video_id>`. The policy limits
  // the object to size_bytes (at most 500 MB) and content_type, and expires
  // after 15 minutes.
  //
  // Without request_id each call creates a new video. With request_id
  // (Google AIP-155) a repeated call is answered from the video the first
  // call created: when the caller already has a video with this request_id
  // and the same title, size_bytes and content_type (compared after the same
  // normalization as on creation) still UPLOADING, the call returns that
  // video_id with a newly signed form and creates nothing. The new form
  // expires with the first one, 15 minutes after the video was created.
  // Repeated calls do not count against the open upload limit. Concurrent
  // calls with one request_id create one video and all return it. A
  // request_id is bound to its video for as long as the video exists: it
  // does not expire.
  //
  // Errors:
  // - INVALID_ARGUMENT: empty title, size_bytes not in (0, 500 MB],
  //   content_type not a `video/*` type, request_id not a canonical lowercase
  //   UUID (`INVALID_REQUEST_ID`), or request_id already used by the caller
  //   with another title, size_bytes or content_type
  //   (`IDEMPOTENCY_KEY_MISMATCH`).
  // - FAILED_PRECONDITION: the first call of request_id cannot be answered
  //   again: its video has left UPLOADING, or its upload window has ended
  //   (the first form has expired or has less than a minute left)
  //   (`VIDEO_NOT_UPLOADING`); a new upload needs a new request_id.
  // - RESOURCE_EXHAUSTED: the caller already has 3 videos in UPLOADING
  //   created within the last 15 minutes, while their upload forms may still
  //   be valid (`TOO_MANY_UPLOADS`).
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);

  // CompleteUpload checks that the uploaded object exists with the declared
  // size and content type, then moves the video to PROCESSING and emits
  // video.uploaded (topic video.lifecycle.v1) in the same transaction.
  // Idempotent: calling it again on a video already PROCESSING or READY
  // returns the current video and emits nothing.
  //
  // Errors:
  // - INVALID_ARGUMENT: video_id is not a UUID.
  // - NOT_FOUND: no such video, or the caller is not its author. Both cases
  //   return the same reason (`VIDEO_NOT_FOUND`) and the same message, so the
  //   response does not reveal that another user's video exists.
  // - FAILED_PRECONDITION: the object is missing or does not match the
  //   declared size or content type, or the video is already FAILED.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);

  // GetVideo returns one video. Videos that are not READY are visible only
  // to their author, so processing or failed videos do not leak.
  //
  // Errors:
  // - INVALID_ARGUMENT: video_id is not a UUID.
  // - NOT_FOUND: no such video, or it is not READY and the caller is not its
  //   author. All cases return the same reason (`VIDEO_NOT_FOUND`) and the
  //   same message, so the response does not reveal that a hidden video
  //   exists.
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);

  // GetPublicVideo returns a READY video to anyone, for the public share
  // page. Does not require caller, and ignores `authorization`: the answer is the
  // same for everyone.
  //
  // Errors:
  // - NOT_FOUND: video_id is not a UUID, there is no such video, or it is not
  //   READY (UPLOADING, PROCESSING or FAILED). Every case returns the same
  //   reason (`VIDEO_NOT_FOUND`) and the same message as GetVideo, so an
  //   anonymous caller cannot tell an unpublished video from a missing one.
  //   A malformed id is still rejected before the database is read.
  rpc GetPublicVideo(GetPublicVideoRequest) returns (GetPublicVideoResponse);

  // ListAuthorVideos returns the videos of author_id, newest first by
  // (created_at, video_id). Requires caller. When the caller is the author
  // the list holds videos in every status; for anyone else only READY ones,
  // the rule of GetVideo. An author without videos, or an id no user has
  // (video-service does not know users), gives an empty page.
  //
  // Pagination follows Google AIP-158, like FeedService: page_token is
  // opaque, pass back next_page_token unchanged; an empty next_page_token
  // means there are no more videos. page_size 0 means 10; values above 50 are
  // lowered to 50. The token holds only a position: which videos the caller
  // may see always comes from author_id and the caller, never from the token.
  //
  // Errors:
  // - INVALID_ARGUMENT: author_id is not a UUID (`INVALID_AUTHOR_ID`),
  //   page_size is negative (`INVALID_PAGE_SIZE`), or page_token cannot be
  //   decoded (`INVALID_PAGE_TOKEN`).
  rpc ListAuthorVideos(ListAuthorVideosRequest) returns (ListAuthorVideosResponse);
}

// VideoStatus is the lifecycle state. Transitions only move forward:
// UPLOADING -> PROCESSING -> READY, and UPLOADING or PROCESSING -> FAILED.
enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  // Created by InitUpload; the client is uploading the source file.
  VIDEO_STATUS_UPLOADING = 1;
  // Source file confirmed; transcoding in progress.
  VIDEO_STATUS_PROCESSING = 2;
  // HLS output available; the video is published to feeds.
  VIDEO_STATUS_READY = 3;
  // Upload abandoned (UPLOADING for more than 1 hour) or transcoding failed
  // permanently. Terminal.
  VIDEO_STATUS_FAILED = 4;
}

message Video {
  string video_id = 1;
  string author_id = 2;
  string title = 3;
  VideoStatus status = 4;
  // Length of the transcoded video. Set once READY.
  google.protobuf.Duration duration = 5;
  // Object key of the HLS master playlist,
  // `media/<video_id>/<version>/master.m3u8` (videos made before versions:
  // `media/<video_id>/master.m3u8`). Set once READY.
  string playlist_key = 6;
  // Object key of the thumbnail image under `media/<video_id>/`, in the
  // directory the master playlist names. Set once READY.
  string thumbnail_key = 7;
  // When InitUpload created the video.
  google.protobuf.Timestamp created_at = 8;
  // When the video became READY. Set once READY.
  google.protobuf.Timestamp published_at = 9;
}

message InitUploadRequest {
  string title = 1;
  // Exact size of the file the client will upload, in bytes.
  int64 size_bytes = 2;
  // MIME type of the file, for example `video/mp4`.
  string content_type = 3;
  // Optional idempotency key of this video creation: a UUID in canonical
  // lowercase form, generated by the client once per video and sent again on
  // every retry of that creation (Google AIP-155). Unique per caller. Empty
  // means no key: the call always creates a video.
  string request_id = 4;
}

message InitUploadResponse {
  string video_id = 1;
  // Absolute URL to POST the multipart form to. This is the one place an
  // absolute URL appears: it is a short-lived credential for the storage
  // endpoint, not a stored media location.
  string upload_url = 2;
  // Form fields (key, policy, signature, ...) to send before the file field.
  map<string, string> form_fields = 3;
  // When the presigned POST stops being accepted.
  google.protobuf.Timestamp expires_at = 4;
}

message CompleteUploadRequest {
  string video_id = 1;
}

message CompleteUploadResponse {
  Video video = 1;
}

message GetVideoRequest {
  string video_id = 1;
}

message GetVideoResponse {
  Video video = 1;
}

message GetPublicVideoRequest {
  string video_id = 1;
}

message GetPublicVideoResponse {
  // Always READY.
  Video video = 1;
}

message ListAuthorVideosRequest {
  string author_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListAuthorVideosResponse {
  repeated Video videos = 1;
  string next_page_token = 2;
}
