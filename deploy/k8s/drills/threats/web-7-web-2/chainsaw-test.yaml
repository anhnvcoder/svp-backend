  - name: "WEB-2: no request from another site, or from s3.svp.localhost, changes state with the session"
    try:
    - description: "WEB-2: setup: the drill user's session (a new user when it is gone) and the /login form's Server Action read logged out"
      script:
        shell: bash
        env:
        - *kubeconfig
        content: |
          set -euo pipefail
          . ./web.sh
          work_ready
          web_user
          # Logged out: AuthPage sends a logged-in visitor of /login to the home page.
          DRILL_PASSWORD=$(openssl rand -hex 16) jq -n --arg e "drill-web2-$(date -u +%Y%m%dT%H%M%SZ)-$(openssl rand -hex 4)@example.test" \
            '{email: $e, password: env.DRILL_PASSWORD}' >"$work/web2-wrong.cred"
          : >"$work/anon.jar"
          web_jar=$work/anon.jar web_form_config /login "$work/web2-wrong.cred" "$work/web2-login.curl"
          echo "the /login form's Server Action fields read (curl config in the work directory)"
        check:
          ($error): ~
    - description: "WEB-2: POST action with the session cookie and Sec-Fetch-Site: cross-site, Origin: https://evil.example: 403 CSRF_REJECTED"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "action"}
        - {name: VARIANT, value: "Sec-Fetch-Site: cross-site|Origin: https://evil.example"}
        content: &web2send |
          set -euo pipefail
          . ./web.sh
          work_ready
          # VARIANT: the headers of the POST, "HEADER|HEADER", empty for neither Sec-Fetch-Site nor Origin. args stays empty
          # then: ${args[@]+...} expands it to nothing, where a plain "${args[@]}" of an empty array stops bash 3.2 (macOS
          # /bin/bash) under set -u with "unbound variable".
          args=()
          if [[ -n $VARIANT ]]; then
            IFS='|' read -r -a hs <<<"$VARIANT"
            for h in "${hs[@]}"; do args+=(-H "$h"); done
          fi
          out=$work/web2.out
          case $TARGET in
            # The /login form's Server Action, posted with the config the setup of this step wrote, and the session cookie.
            action)
              : >"$out"
              status=$(curl -sS --max-time 15 -o "$out" -w '%{http_code}' -b "$work/web.jar" -K "$work/web2-login.curl" \
                ${args[@]+"${args[@]}"} || true)
              ;;
            api) status=$(web_post /api/videos "$out" -H 'Content-Type: application/json' --data-binary '{}' ${args[@]+"${args[@]}"}) ;;
            logout) status=$(web_post /logout "$out" ${args[@]+"${args[@]}"}) ;;
            rum)
              status=$(web_post /rum "$out" -H 'Content-Type: text/plain;charset=UTF-8' \
                --data-binary '{"path":"/","metrics":[{"name":"LCP","value":1200}]}' ${args[@]+"${args[@]}"})
              ;;
            monitoring)
              status=$(web_post /monitoring "$out" -H 'Content-Type: text/plain;charset=UTF-8' --data-binary '{}' ${args[@]+"${args[@]}"})
              ;;
          esac
          code=$(jq -r '.code // ""' "$out" 2>/dev/null || true)
          echo "POST $TARGET with the session cookie and ${VARIANT:-neither Sec-Fetch-Site nor Origin}: status $status, code '$code'" >&2
          echo "$status $code"
        check:
          ($error): ~
          (trim_space($stdout)): 403 CSRF_REJECTED
    - description: "WEB-2: POST action with the session cookie and Sec-Fetch-Site: same-site, Origin: https://s3.svp.localhost:8443: 403 CSRF_REJECTED"
