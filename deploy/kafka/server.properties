# The one local Kafka broker (KRaft: broker and controller in one process), the stand-in for Amazon MSK: the same
# Kafka, SASL/SCRAM-SHA-512 over TLS on port 9096, ACLs by StandardAuthorizer. broker.sh adds only advertised.listeners.
# What differs from MSK is data: the replication factors below (one broker) and the CA of the server certificate.
# Design notes: docs/explanation/deployment.md.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Clients: SASL_SSL on 9096 only. The controller and inter-broker listeners are PLAINTEXT bound to localhost, so only
# processes inside the broker's own container reach them; their principal is User:ANONYMOUS, the only super user.
listeners=SASL_SSL://0.0.0.0:9096,CONTROLLER://localhost:9093,INTERNAL://localhost:9092
listener.security.protocol.map=SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL

sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.sasl_ssl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
# Key and certificate chain in one PEM file, put in place by tls-init (compose) or the Secret of the pod (k3d).
ssl.keystore.type=PEM
ssl.keystore.location=/etc/svp-tls/kafka.pem

# The permission model of MSK: a resource with no ACL is open to every authenticated user, and the init
# script gives svp-admin wildcard ACLs first, so every resource has ACLs and a user gets only what it was granted.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true
super.users=User:ANONYMOUS

# Topics come from the init script only: a mistyped name fails instead of creating a topic.
auto.create.topics.enable=false

# One broker: topics take the broker's replication factor, and the internal topics must fit on one broker (Kafka's
# default of 3 would never create __consumer_offsets).
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
# MSK defaults to true; false on every broker of the project: a replica outside the ISR never becomes leader, so a
# write acked by all replicas is never lost.
unclean.leader.election.enable=false

log.dirs=/var/lib/kafka/data
# A consumer group of one member does not wait 3 s for others before its first assignment.
group.initial.rebalance.delay.ms=0
