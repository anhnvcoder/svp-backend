# Supply chain drill, case h: an ephemeral container (what kubectl debug adds) in a running pod of svp, as a dry run of
# a strategic patch of its ephemeralcontainers subresource: an unsigned image is refused, the signed release of case a
# is admitted (SKIP while no pod of svp runs a GHCR image). The policy reads every image of the pod, so while the pod
# runs an image outside every release source the prefix rule refuses first, whatever the ephemeral image.

# A script step: Chainsaw's patch sends a JSON merge patch, which would replace the pod's list of ephemeral containers
# rather than add one as kubectl debug does.

# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-h
  labels:
    drill: supplychain
spec:
  description: (h) an ephemeral container with an unsigned image is refused, with a signed release admitted
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: h-setup
    description: (h) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: h
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: h-ephemeral-unsigned
    description: (h) an ephemeral container with the unsigned image in a running pod of svp, refused
    try:
    - continueOnError: true
      script:
        shell: bash
        timeout: 4m
        env: *env
        content: |
          . ../lib.sh
          target_pod
          bad_image
          ephemeral_rule
          timed kc -n svp patch pod "$target" --subresource=ephemeralcontainers --type=strategic --dry-run=server \
            -p "$(ephemeral "$bad")"
          refused "$bad_rule" "ephemeral container $bad in pod svp/$target"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (h) ')): true
  - name: h-ephemeral-signed
    description: (h) an ephemeral container with the signed release in a running pod of svp, admitted
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          signed=$(signed_image)
          if [ -z "$signed" ]; then
            skip "admitted half: no signed image of GHCR runs in svp"
            exit 0
          fi
          target_pod
          timed kc -n svp patch pod "$target" --subresource=ephemeralcontainers --type=strategic --dry-run=server \
            -p "$(ephemeral "$signed")"
          admitted "ephemeral container $signed in pod svp/$target" "pod/$target patched"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (h) ') || contains($stdout, 'SKIP  (h) ')): true
