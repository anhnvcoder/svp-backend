# Supply chain drill, case d: an image of the local registry (k3d-svp-registry:5111) and one of Docker Hub by digest,
# each sent as a server-side dry run of a pod of svp: refused by the prefix rule, each answer within 1 s (the
# operation's timeout: Kyverno asks no registry for an image outside the prefix). The local image is the first one a
# pod of svp runs, else a dev image of that registry by name. Declarative: Chainsaw's create with dryRun, the expected
# admission error checked by its message.
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-d
  labels:
    drill: supplychain
spec:
  description: (d) images outside the release prefixes (local registry, Docker Hub) are refused by the prefix rule within 1 s
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: d-setup
    description: (d) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: d
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: d-local-registry
    description: (d) an image of the local registry refused by the prefix rule within 1 s
    try:
    - script:
        shell: bash
        env: *env
        outputs:
        - name: localImage
          value: ($stdout)
        content: |
          . ../lib.sh
          printf %s "$(local_image)"
    - description: (d) pod drill-supplychain-d of svp with the local registry's image, server-side dry run, refused with "image not allowed in namespace svp" within 1 s
      continueOnError: true
      create:
        dryRun: true
        timeout: 1s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: drill-supplychain-d
            namespace: svp
            labels:
              app.kubernetes.io/managed-by: svp-drill-supplychain
              svp-drill: supplychain
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: c
              image: ($localImage)
              command: [sleep, "60"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
        expect:
        - check:
            ($error != null): true
            (contains($error || '', 'image not allowed in namespace svp')): true
  - name: d-docker-hub
    description: (d) an image of Docker Hub by digest refused by the prefix rule within 1 s
    try:
    - description: (d) pod drill-supplychain-d of svp with Docker Hub's busybox 1.37.0 by digest, server-side dry run, refused with "image not allowed in namespace svp" within 1 s
      continueOnError: true
      create:
        dryRun: true
        timeout: 1s
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: drill-supplychain-d
            namespace: svp
            labels:
              app.kubernetes.io/managed-by: svp-drill-supplychain
              svp-drill: supplychain
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: c
              # Docker Hub's busybox 1.37.0 (multi-arch index), only ever named in a dry run.
              image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
              command: [sleep, "60"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
        expect:
        - check:
            ($error != null): true
            (contains($error || '', 'image not allowed in namespace svp')): true
