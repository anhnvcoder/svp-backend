{{- /*
Chart svp-cluster denies every pod of svp in both directions and opens DNS; this policy opens the rest, by pod labels.
*/}}

{{- /*
Ingress on the service's own port from the peers in ingressFrom only (Envoy for the gateway, the gateway for a gRPC
service), egress to the peers in egressTo only.
*/}}

{{- /*
So a compromised pod reaches only what its service really talks to, never the internet; a service with an empty
ingressFrom (media-worker) is reached by no pod at all.
*/}}

{{- /*
The servers in svp-data and svp-obs have their own ingress policies for these pods. A peer of externalPeers is reached
by address instead (a managed database or object store outside the cluster).
*/}}

{{- /*
In the mesh, a peer's traffic to a pod of the mesh arrives in HBONE on 15008, so 15008 opens beside its ports. The
service's own port stays open to the peers so that plaintext from them meets STRICT mTLS, which refuses it.
*/}}

{{- /*
The kubelet's probes of a pod in the mesh come from 169.254.7.127, the address Istio's CNI rewrites their source to
(they skip ztunnel and its policies); a release without a port has no probe.
*/}}

{{- range $name, $_ := .Values.externalPeers }}
{{- if not (hasKey $.Values.peers $name) }}{{ fail (printf "externalPeers: unknown peer %q" $name) }}{{ end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svp-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or .Values.ingressFrom (ne .Values.protocol "none") }}
  ingress:
    {{- if .Values.ingressFrom }}
    - from:
        {{- range .Values.ingressFrom }}
        {{- if not (hasKey $.Values.peers .) }}{{ fail (printf "ingressFrom: unknown peer %q" .) }}{{ end }}
        {{- include "svp-service.peerSelector" (index $.Values.peers .) | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
        - protocol: TCP
          port: 15008
    {{- if eq .Values.protocol "grpc" }}
    # The waypoint, which carries the calls to the release's Service.
    - from:
        {{- include "svp-service.peerSelector" .Values.peers.waypoint | nindent 8 }}
      ports:
        - protocol: TCP
          port: 15008
    {{- end }}
    {{- end }}
    {{- if ne .Values.protocol "none" }}
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- range .Values.egressTo }}
    {{- if not (hasKey $.Values.peers .) }}{{ fail (printf "egressTo: unknown peer %q" .) }}{{ end }}
    {{- $peer := index $.Values.peers . }}
    # {{ . }}
    {{- $external := index $.Values.externalPeers . }}
    {{- if $external }}
    {{- include "svp-service.externalEgress" (dict "name" . "entries" $external) | trim | nindent 4 }}
    {{- else }}
    - to:
        {{- include "svp-service.peerSelector" $peer | nindent 8 }}
      ports:
        {{- range $peer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        {{- if $peer.mesh }}
        - protocol: TCP
          port: 15008
        {{- end }}
    {{- end }}
    {{- end }}
    {{- $viaWaypoint := false }}
    {{- range .Values.egressTo }}
    {{- if and (not (index $.Values.externalPeers .)) (index $.Values.peers .).mesh }}
    {{- if (index $.Values.peers .).mesh.viaWaypoint }}{{ $viaWaypoint = true }}{{ end }}
    {{- end }}
    {{- end }}
    {{- if $viaWaypoint }}
    # waypoint, where the calls to the Services of the peers above that use it go
    - to:
        {{- include "svp-service.peerSelector" .Values.peers.waypoint | nindent 8 }}
      ports:
        - protocol: TCP
          port: 15008
    {{- end }}
