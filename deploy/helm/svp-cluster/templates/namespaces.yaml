{{- /* Namespaces by role: svp (the six Go services and the web client), svp-data (Postgres, Valkey, Redpanda, the
object store s3), svp-obs (observability, GlitchTip), svp-edge (Gateway and certificates). Pod Security
Admission enforces "restricted": a chart that cannot meet it is fixed in its values, the namespace is not
loosened. install.sh and gitops.sh render this template alone for the namespaces they make before this chart. */}}
{{- $sources := list }}
{{- with .Values.externalSecrets }}
{{- if and .enabled (eq .store "kubernetes") }}
{{- $sources = list (dict "name" .sourceNamespace) }}
{{- end }}
{{- end }}
{{- range concat .Values.namespaces $sources .Values.platformNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: {{ $.Values.podSecurityVersion }}
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: {{ $.Values.podSecurityVersion }}
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: {{ $.Values.podSecurityVersion }}
    {{- if .routes }}
    # Gateway svp accepts HTTPRoutes only from namespaces with this label, so a namespace cannot publish a route on the
    # shared entry point unless this chart marks it.
    svp-gateway-routes: "true"
    {{- end }}
{{- end }}
