# Supply chain drill, case f: an attestation too old. A temporary copy of the policy (same chart, maximum age 5
# seconds, mode Enforce) that applies only to pods of svp labelled svp-drill=supplychain-stale refuses such a pod with
# the image of case a, with the age rule's message; with the copy in place, every webhook of the image policies still
# selects namespace svp only; the copy is deleted again and its webhook gone before the test ends, also when a step
# fails. That image's vuln attestation is always older than 5 seconds when the drill runs (CI attests before the
# release is promoted), so the case neither waits nor reads a clock; it only checks first, with cosign, that the image
# has a vuln attestation at all, and fails without the temporary policy when it has none (Kyverno would then refuse it
# for the missing attestation, which shows nothing about the age). SKIP while no pod of svp runs an image of GHCR.
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-f
  labels:
    drill: supplychain
spec:
  description: (f) a copy of the policy with a maximum age of 5 s refuses a signed release for its old attestation
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: f-setup
    description: (f) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: f
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: f-stale-policy
    description: (f) the signed release has a vuln attestation; temporary policy svp-drill-stale (maximum age 5s, pods labelled svp-drill=supplychain-stale) ready with its webhook
    try:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          signed=$(signed_image)
          if [ -z "$signed" ]; then
            skip "no signed image of GHCR runs in svp to send under the temporary policy"
            exit 0
          fi
          image_identity "$signed"
          if ! cosign_ verify-attestation --type vuln --certificate-oidc-issuer "$policy_issuer" \
            --certificate-identity "$policy_subject" "$signed" >/dev/null 2>"$work/cosign.err"; then
            result FAIL "$signed: a vuln attestation of $policy_subject that cosign verifies (got: $(tail -n 1 "$work/cosign.err"))"
            exit 1
          fi
          hc template svp-drill-stale "$repo_root/deploy/helm/svp-policy" --set imageVerification.mode=Enforce \
            --set imageVerification.maxAttestationAge=5s --set name=svp-drill-stale \
            --set-json 'objectSelector={"matchLabels":{"svp-drill":"supplychain-stale"}}' >"$work/policy.yaml" ||
            fail "render chart svp-policy as svp-drill-stale"
          apply_policy svp-drill-stale "$work/policy.yaml"
          ok "(f) $signed has a vuln attestation of $policy_subject; temporary policy svp-drill-stale ready"
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          delete_temp_policies
  - name: f-stale-refused
    description: (f) the signed release in a pod labelled svp-drill=supplychain-stale refused by the age rule of the copy
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the signed release under the copy with a maximum age of 5s" || exit 0
          signed=$(signed_image)
          dry_run drill-supplychain-f svp "$signed" supplychain-stale
          refused "vuln attestation older than 5s" "$signed under a copy of the policy with a maximum age of 5s"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (f) ') || contains($stdout, 'not run, the case is SKIP above')): true
  - name: f-webhook-scope
    description: (f) with the temporary policy, every webhook of the image policies selects namespace svp only
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the scope of the webhooks with the copy in place" || exit 0
          # Each webhook's own scope, not its selector as a whole: Kyverno ANDs the policy's match on namespace svp with
          # the selector of its ConfigMap (NotIn kube-system, NotIn kyverno). A label selector ANDs matchLabels with
          # every matchExpressions term, so once the match on svp is there any term only narrows the scope; only a
          # missing or different match on svp widens it. The check also asks for NotIn only, stricter than that needs:
          # it is all Kyverno writes today, and any other term is worth a look.
          scope=$(webhooks | jq -c '[.[] | select((.namespaceSelector.matchLabels // {})["kubernetes.io/metadata.name"] != "svp"
            or any(.namespaceSelector.matchExpressions[]?; .operator != "NotIn")) | {name, namespaceSelector}]') || scope=
          if [[ $scope == '[]' ]]; then
            result PASS "with the temporary policy, every webhook of the image policies selects namespace svp only (kubernetes.io/metadata.name=svp, only NotIn besides)"
          else
            result FAIL "every webhook of the image policies selects namespace svp only (got ${scope:-no webhook configuration})"
          fi
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (f) ') || contains($stdout, 'not run, the case is SKIP above')): true
