# M-1 of the mesh drill: STRICT mTLS. A pod with the gateway's labels outside the mesh (istio.io/dataplane-mode=none,
# templates/mesh-client-up.yaml) makes a plaintext gRPC health check to each gRPC service through its Service.

# The NetworkPolicies let the gateway's labels in, so the TCP connect succeeds, in the ztunnel of the target pod, and
# STRICT closes it before any answer: "refused" (templates/ambient-probe.js). "unreached" means the network layer
# stopped it first, an answer that plaintext got in: both fail the case.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mesh-m-1
  labels:
    drill: mesh
spec:
  description: "M-1: plaintext from outside the mesh, let in by the NetworkPolicies, is refused by STRICT mTLS"
  # An existing namespace: Chainsaw neither creates nor deletes it, only the pod the template applies.
  namespace: svp
  bindings:
  - {name: from, value: drill-mesh-plain}
  - {name: mode, value: grpc}
  - {name: want, value: [dns refused]}
  steps:
  - name: "M-1: setup: pod drill-mesh-plain in svp with the gateway's labels, outside the mesh"
    use:
      template: ../../templates/mesh-client-up.yaml
      with:
        bindings:
        - {name: clientName, value: drill-mesh-plain}
        - {name: clientServiceAccount, value: default}
        - {name: clientDataplaneMode, value: none}

  - name: "M-1: plaintext gRPC from outside the mesh to user-service.svp:9101 refused"
    bindings:
    - {name: target, value: user-service.svp.svc.cluster.local:9101}
    try: &probe
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        - {name: FROM, value: ($from)}
        - {name: MODE, value: ($mode)}
        - {name: TARGET, value: ($target)}
        content: |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          js=$(cat "$(git rev-parse --show-toplevel)/deploy/k8s/drills/templates/ambient-probe.js")
          kubectl --context k3d-svp -n svp exec "pod/$FROM" -c probe -- /nodejs/bin/node -e "$js" "$MODE" "$TARGET" </dev/null
        check:
          ($error): ~
          (contains($want, trim_space($stdout))): true
      continueOnError: true
  - name: "M-1: plaintext gRPC from outside the mesh to video-service.svp:9102 refused"
    bindings:
    - {name: target, value: video-service.svp.svc.cluster.local:9102}
    try: *probe
  - name: "M-1: plaintext gRPC from outside the mesh to engagement-service.svp:9103 refused"
    bindings:
    - {name: target, value: engagement-service.svp.svc.cluster.local:9103}
    try: *probe
  - name: "M-1: plaintext gRPC from outside the mesh to feed-service.svp:9104 refused"
    bindings:
    - {name: target, value: feed-service.svp.svc.cluster.local:9104}
    try: *probe
