{{- /*
The service itself. Configuration is environment variables only, as in compose: the plain ones from the values, the
secret ones from Secret <service>-env (deploy/k8s/secrets.sh, from .env).
*/}}

{{- /*
A process reads its environment and its trusted roots (the local CA) only at start, so the workload names its Secrets
in secret.reloader.stakater.com/reload: Reloader restarts it when one changes or sentry is created; an unread Secret
never does.
*/}}

{{- /*
With canary set it is an Argo Rollouts Rollout instead: the same pod template, and a new revision goes out as a canary
behind Envoy rather than as a rolling update.
*/}}

{{- /*
Reloader restarts a Rollout with reloader.stakater.com/rollout-strategy restart: it sets spec.restartAt and Argo
Rollouts evicts the pods older than that time one at a time, with no new revision and no canary.
*/}}

{{- /* Design notes: docs/explanation/deployment.md. */}}
{{- if .Values.canary }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
  annotations:
    secret.reloader.stakater.com/reload: {{ .Release.Name }}-env{{ if .Values.errorTracking }},sentry{{ end }}{{ with .Values.localCA }},{{ . }}{{ end }}
    {{- if .Values.canary }}
    reloader.stakater.com/rollout-strategy: restart
    {{- end }}
spec:
  {{- if and .Values.hpa .Values.keda }}
  {{- fail (printf "release %s sets both hpa and keda: KEDA makes its own HPA, two would fight over the replicas" .Release.Name) }}
  {{- end }}
  {{- if not (or .Values.hpa .Values.keda) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "svp-service.selectorLabels" . | nindent 6 }}
  {{- if .Values.canary }}
  {{- include "svp-service.canaryStrategy" . | nindent 2 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "svp-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: svp
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      # No service calls the Kubernetes API: no token in the pod for an attacker to use (no Role is bound either).
      automountServiceAccountToken: false
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- include "svp-service.podSecurityContext" . | nindent 8 }}
      {{- if .Values.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "svp-service.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ include "svp-service.image" . }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.errorTracking }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef: {name: sentry, key: SENTRY_DSN, optional: true}
            {{- end }}
            {{- if .Values.localCA }}
            - name: SSL_CERT_DIR
              value: /etc/svp-ca
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/svp-ca/ca.crt
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          {{- if ne .Values.protocol "none" }}
          ports:
            - name: {{ .Values.protocol }}
              containerPort: {{ .Values.port }}
          {{- end }}
          {{- with .Values.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep: {seconds: {{ . }}}
          {{- end }}
          {{- if eq .Values.protocol "http" }}
          # /healthz, not /readyz: /readyz fails when a gRPC service behind the gateway is down, and taking every
          # gateway pod out of the Service then would turn one service's outage into a full one, while the gateway
          # degrades route by route behind its circuit breakers. /healthz answers as soon as the process listens (the
          # web client's too, without the session store), so a gateway started before the gRPC services is ready.

          # Timeouts: Kubernetes' default of 1 s is too short when the node's CPU is saturated, and a liveness probe
          # that times out makes the kubelet restart a pod that is still alive, which costs more CPU. Liveness exists
          # only to catch a hung process, so it waits 5 s (a hang is still killed after ~35 s); readiness stays short (2
          # s) so a slow pod leaves the Service quickly.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- else if eq .Values.protocol "grpc" }}
          # The standard gRPC health service. Startup and liveness ask for the overall health "", SERVING from the
          # moment the server listens until shutdown starts and independent of the database: restarting the container
          # cannot fix a database that is down, and a database that flaps would restart every pod. The startup probe
          # gives a slow start (a database or broker still coming up) 60 s before liveness may restart the container.

          # Readiness asks for the service name "readiness", which follows a ping of the service's Postgres pool (every
          # 2 s, NOT_SERVING after 3 failures in a row): every RPC needs that database, so a pod that cannot reach it
          # leaves the Service, and a new pod enters it only once the database answers. Redis, the object store and
          # Kafka stay out, since only part of the work needs them.

          # Timeouts: the default of 1 s is too short when the node's CPU is saturated, and a liveness probe that times
          # out restarts a pod that is still alive. Liveness and startup only catch a hung process (startup's 2 s equals
          # its period); readiness stays short so a slow pod leaves the Service quickly.
          startupProbe:
            grpc: {port: {{ .Values.port }}}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc: {port: {{ .Values.port }}, service: readiness}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            grpc: {port: {{ .Values.port }}}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- $resources := required (printf "resources are empty for release %s" .Release.Name) .Values.resources }}
            {{- toYaml $resources | nindent 12 }}
          securityContext:
            {{- include "svp-service.containerSecurityContext" . | nindent 12 }}
          {{- if or .Values.scratch .Values.localCA }}
          volumeMounts:
            {{- range $name, $dir := .Values.scratch }}
            - name: {{ $name }}
              mountPath: {{ $dir.mountPath }}
            {{- end }}
            {{- if .Values.localCA }}
            - name: local-ca
              mountPath: /etc/svp-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.scratch .Values.localCA }}
      volumes:
        {{- range $name, $dir := .Values.scratch }}
        - name: {{ $name }}
          emptyDir:
            {{- with $dir.medium }}
            medium: {{ . }}
            {{- end }}
            sizeLimit: {{ $dir.sizeLimit }}
        {{- end }}
        {{- if .Values.localCA }}
        - name: local-ca
          secret:
            secretName: {{ .Values.localCA }}
            defaultMode: 0440
        {{- end }}
      {{- end }}
