{{- /*
Schema migration of a service with a database: a Job runs `migrate` with the service's migrator role before every
install and upgrade, once, not in each replica; the long-running pods hold the app role only.
*/}}

{{- /*
A failed migration fails the release: Helm (and Argo CD, which reads pre-install/pre-upgrade as PreSync) stops before
the new pods replace the old ones, so no service runs against a schema older than its code.
*/}}

{{- /*
Hooks run before every ordinary resource of the release, in a namespace that denies everything by default: the Job's
ServiceAccount and its egress policy are hooks of the same kind with a lower weight, so they exist before the Job.
*/}}

{{- /*
A completed Job keeps its pod and log until the next run replaces it; a failed one does not (the Job controller deletes
its pod and log), so deploy/k8s/install.sh copies the log of each failed attempt while the pod is there.
*/}}

{{- /* Design notes: docs/explanation/deployment.md. */}}
{{- if .Values.migrate }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
# The migrate Job reaches its database and nothing else (DNS is open to every pod of svp already).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/component: migrate
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- with .Values.externalPeers.postgres }}
    {{- include "svp-service.externalEgress" (dict "name" "postgres" "entries" .) | trim | nindent 4 }}
    {{- else }}
    - to:
        {{- include "svp-service.peerSelector" .Values.peers.postgres | nindent 8 }}
      ports:
        {{- range .Values.peers.postgres.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # A new pod's address reaches Postgres only once k3s's network policy controller has added it to the policy of
  # svp-data, about 2 s after the pod starts, and `migrate` fails at once on a refused connection. So the container is
  # restarted in the same pod (OnFailure keeps its address; a new pod would race again), at once and after the kubelet's
  # back-off of 10 s and 20 s; the Job fails at the third restart. A migration still failing then is a real error.
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "svp-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-migrate
      automountServiceAccountToken: false
      securityContext:
        {{- include "svp-service.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "svp-service.image" . }}
          args: ["migrate"]
          env:
            # DATABASE_URL with the migrator role, which owns the schema; the service's own pods never get it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-migrate-env, key: DATABASE_URL}
          resources:
            {{- toYaml .Values.migrateResources | nindent 12 }}
          securityContext:
            {{- include "svp-service.containerSecurityContext" . | nindent 12 }}
{{- end }}
