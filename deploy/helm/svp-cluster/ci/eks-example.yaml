# Example values of an EKS cluster, to render and check what only such a cluster turns on (helm template -f this file):
# Postgres on Amazon RDS, objects on Amazon S3 (no CloudNativePG, no in-cluster object store, StorageClass gp3), an
# internal ALB in front of Envoy. Placeholders only: real CIDRs, ARNs, names come from the cluster's Terraform outputs
# and the learner's own variables, never from git; .example never resolves.
cloudnativePG:
  enabled: false
s3:
  mode: external
storageClass:
  enabled: true

externalSecrets:
  enabled: true
  store: kubernetes
  postgres: svp-stg-pg.rds.example:5432
  valkey: master.svp-stg.cache.example:6379
  # Kafka is Amazon MSK and Valkey Amazon ElastiCache: no broker users, ACL file or local CA in the cluster.
  localKafkaValkey: false

# The VPC's CIDR, the first address of the cluster's service range, and the port of EKS's API server.
nodeSubnet: 10.0.0.0/16
kubeAPIServiceIP: 172.20.0.1
kubeAPIPort: 443
# Kyverno's webhook calls come from the control plane's network interfaces in the VPC (nodeSubnet, so every pod of the
# VPC too: templates/networkpolicies.yaml says why that is accepted); no VXLAN on EKS.
kyverno:
  vxlanAddresses: []

wildcardHost: "*.stg.aws.svp.example"
apexHost: stg.aws.svp.example

# The ALB sends no SNI to its targets, so one listener with no hostname serves both names behind it.
listeners:
  - name: https
    certificate: svp-edge
    secretName: svp-edge-tls
    dnsNames:
      - stg.aws.svp.example
      - api.stg.aws.svp.example

envoy:
  service:
    type: ClusterIP
    name: svp-envoy
  # The ALB's target group of type ip; the ALB sits in the edge subnets of edgeCidrs below.
  targetGroupArn: arn:aws:elasticloadbalancing:ap-southeast-1:000000000000:targetgroup/svp-stg-envoy/0000000000000000
  networkPolicy:
    enabled: true
    # The ALB in two zones' edge subnets, and the k6 Job of namespace svp-load that measures inside the cluster.
    httpsFrom:
      - ipBlock:
          cidr: 10.0.240.0/23
      - ipBlock:
          cidr: 10.0.242.0/23
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: svp-load
    # The target group's health check: Envoy's /ready, from the ALB only.
    healthCheck:
      port: 19003
      from:
        - ipBlock:
            cidr: 10.0.240.0/23
        - ipBlock:
            cidr: 10.0.242.0/23
