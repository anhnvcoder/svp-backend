{{- /*
Valkey with valkey.mode cluster, the stand-in for Amazon ElastiCache for Valkey: TLS only, on
valkey.svp-data.svc.cluster.local:6379, with the local CA's server certificate (Secret valkey-tls), the same db numbers
and key prefixes everywhere: gateway db 10 (svp:gw:), feed-service db 14 (svp:feed:), the web client db 9 (svp:web:).
*/}}

{{- /*
One ACL user per client (Secret valkey-acl, the aclfile of compose's valkey), whose access string allows only its own
db, key prefix and commands, and svp-ops for the operations CLI; user default is off. A client reads no other's keys.
*/}}

{{- /*
Rate limits, a cache and sessions, none worth persisting: a restart loses every web session. noeviction as on the host:
when full, writes fail (the gateway falls back to its in-process counter, a login fails), no key is dropped silently.
*/}}

{{- /* Design notes: docs/explanation/deployment.md. */}}
{{- if not (include "svp-data.valkeyExternal" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  annotations:
    # Valkey reads its aclfile and its certificate only at start.
    secret.reloader.stakater.com/reload: valkey-acl,valkey-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        # A user and group above 10000, not the image's valkey (999:1000): ids that low may belong to an account of the
        # node. Valkey needs no account of its own (the image's entrypoint changes user only when started as root), and
        # the one directory it writes, /data, is an emptyDir, writable by any user and empty at every start, so the ids
        # can change in place with nothing to keep. fsGroup lets it read the Secrets mounted with mode 0440.
        {{- include "svp-data.podSecurityContext" (dict "uid" 10999 "gid" 10999 "fsGroup" true) | nindent 8 }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["valkey-server", "--port", "0", "--tls-port", "6379",
                 "--tls-cert-file", "/etc/svp-tls/valkey.crt", "--tls-key-file", "/etc/svp-tls/valkey.key",
                 "--tls-auth-clients", "no", "--aclfile", "/etc/svp-valkey/users.acl",
                 "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
          ports:
            - name: valkey
              containerPort: 6379
          # TCP probes, not an exec of valkey-cli ping: an exec starts a process in the container's cgroup every period,
          # which counts against its CPU limit. With persistence off there is no loading phase in which the port is open
          # but commands are refused, so an open port means Valkey answers.
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext:
            {{- include "svp-data.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # The image's working directory; nothing is saved there with persistence off, but it must be writable.
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/svp-tls
              readOnly: true
            - name: acl
              mountPath: /etc/svp-valkey
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: tls
          secret:
            secretName: valkey-tls
            defaultMode: 0440
        - name: acl
          secret:
            secretName: valkey-acl
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
{{- end }}
