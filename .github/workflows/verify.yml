# Deferred verification of stage 6b, on a fresh GitHub-hosted runner
# of the public repository: one scenario per run dispatched by hand, and once a week compose-obs and gitops side by
# side on main, every target. It builds the compose stack or the k3d cluster with the same make targets as a dev
# machine and runs what that machine cannot hold (16 GB): the threat model drills, the object store's tests against the
# stack, and the supply chain drill on a cluster Argo CD builds. Not a check of pull requests: no ruleset requires it,
# and nothing but the dispatch and the weekly schedule triggers it.
#
#   gh workflow run verify.yml --ref <main or feat/stage6b-...> -f scenario=<scenario> [-f targets='<name> ...']
#
# Scenarios (deploy/ci/verify/<scenario>.sh lists the targets of each): compose-obs (job compose: the compose stack with
# OBS=lgtm) and gitops (job gitops: the cluster Argo CD builds from this repository and svp-gitops).
#
# The repository is public, so the log and the artifact of every run are too, red or not:
# - only workflow_dispatch (write access to the repository needed) and schedule (the code of main, no input), never
#   pull_request_target or workflow_run; every job has contents: read and nothing more. No job holds a secret or an
#   environment;
# - every action is GitHub's own and pinned to a full commit SHA; checkout never leaves the token in .git/config;
# - the inputs reach the scripts only through env (SCENARIO, SVP_VERIFY_TARGETS) and deploy/ci/verify-run.sh checks
#   them again with a case; if: compares the scenario as an expression, never in a shell. A scheduled run has no
#   inputs: each job's SCENARIO falls back to its own scenario, and the targets are empty (every one);
# - no code of another repository runs: the deployment configuration svp-gitops is cloned anonymously from GitHub (make
#   gitops-clone in verify-run.sh) and only read, its images pulled by digest;
# - make env writes a .env of fresh random secrets that lives on this runner until the job ends; the cluster makes more
#   (GlitchTip's tokens, its CA). deploy/ci/verify-mask.sh masks them in the log as soon as they exist, every target's
#   output goes to a file on the runner instead of the log, and deploy/ci/verify-collect.sh copies into the artifact
#   only the files of an allow list that pass a scan for every known secret value and for token patterns (it drops
#   the doubtful ones, with a warning). Nothing is ever printed with set -x, env or kubectl get secret.
#
# The scenario stops at the earlier of its step limit and its job limit minus 25 minutes (verify-run.sh), so the steps
# that collect, filter and upload always have time to run: they run once the ref check passed, also after a failure, a
# timeout or a cancel (always()).
name: verify

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario (compose-obs is the compose stack with OBS=lgtm, gitops the cluster of the GitOps path)
        type: choice
        required: true
        options:
          - compose-obs
          - gitops
      targets:
        description: Targets to run, separated by spaces; empty runs every one, the build target always runs (deploy/ci/verify-run.sh)
        type: string
        required: false
        default: ""
  # Saturday 00:37 UTC, 07:37 in Vietnam (UTC+7), off the top of the hour (busy for GitHub's scheduler, which may delay
  # or drop a run then). GitHub runs it on the latest commit of main only, and turns it off after 60 days without any
  # activity in a public repository.
  schedule:
    - cron: "37 0 * * 6"

permissions: {}

# One run of each scenario at a time, the two scenarios side by side: each has a runner of its own, so a fix rarely
# waits on the other's run. A third dispatch of a scenario while one runs and one waits replaces the waiting one. The
# scheduled run (both jobs) is a group of its own, verify-schedule: a dispatch during it runs beside it, on its own
# runner.
concurrency:
  group: verify-${{ inputs.scenario || github.event_name }}
  cancel-in-progress: false

jobs:
  # The compose stack with the LGTM observability profile, as job stack of ci.yml builds it: make up OBS=lgtm (GlitchTip
  # included), make smoke, make drill-obs-threats, then make test-stack of internal/objstore against the stack's object
  # store (no test may skip). The LOCAL LAB ONLY resets of smoke and the drill (they delete the gateway's register rate
  # limit keys in Redis db 10) touch only the Redis service container below, which belongs to this run.
  compose:
    if: github.event_name == 'schedule' || inputs.scenario == 'compose-obs'
    runs-on: ubuntu-24.04
    # Setup about 10 minutes, the scenario step 50, then 25 for the steps after it.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SCENARIO: ${{ inputs.scenario || 'compose-obs' }}
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_JOB_MINUTES: 90
      SVP_VERIFY_STEP_MINUTES: 50
    services:
      # As in job stack of ci.yml: published on loopback (the scripts on the runner) and on the gateway of Docker's
      # default bridge, 172.17.0.1, where the compose services reach them as host.docker.internal; never on every
      # interface.
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
          - 172.17.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
        ports:
          - 127.0.0.1:6379:6379
          - 172.17.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Before anything else: a dispatch of another branch (an old one without the fixes of this stage) stops here, and
      # so does a scheduled run anywhere but main (GitHub runs it on the default branch, which is main). An accident
      # guard, not a security boundary: whoever can dispatch can also push a branch of that name.
      - name: Check the ref and note the job's start
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify"
          date +%s >"$RUNNER_TEMP/verify/job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make env runs go run ./tools/jwtkey for the JWT key pair, make test-stack runs go test -race against the stack;
      # the Makefile also asks go for GOPATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - run: make ci-bridge-check
      # psql of the Postgres bootstrap, redis-cli of the rate limit resets, ffmpeg for the test video of smoke, jq
      # everywhere.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client redis-tools ffmpeg jq
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh "$SCENARIO"
      - name: Scenario
        timeout-minutes: 50
        run: deploy/ci/verify-run.sh "$SCENARIO"
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ env.SCENARIO }}
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      # make down reads .env; without one (a run cancelled before make env) no stack was ever started.
      - name: make down
        if: always() && steps.ref.outcome == 'success'
        run: |
          if [ -f .env ]; then make down; else echo "no .env: make env never ran, so no stack was started"; fi

  # The GitOps path: make k8s-gitops-up builds a new cluster from the branch this run checked out, Argo CD reading the
  # public repository over anonymous HTTPS (no deploy key, no secret) and running the signed release images of GHCR by
  # digest under Kyverno's Enforce policy; then the staging overlay, the ExternalSecrets and Argo CD's metrics are
  # checked, make k8s-smoke, the supply chain and threat model drills (deploy/ci/verify/gitops.sh). Dispatched, and
  # weekly on main beside job compose: SVP_VERIFY_SCHEDULED tells the scripts a run is the scheduled one, which leaves
  # out the supply chain drill's cases whose drill-only image is past its maximum age (nobody rescans those before it).
  gitops:
    if: github.event_name == 'schedule' || inputs.scenario == 'gitops'
    runs-on: ubuntu-24.04
    # Setup about 10 minutes, the scenario step 120, then 25 for the steps after it.
    timeout-minutes: 160
    permissions:
      contents: read
    env:
      SCENARIO: gitops
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_JOB_MINUTES: 160
      SVP_VERIFY_STEP_MINUTES: 120
    steps:
      # As in job compose.
      - name: Check the ref and note the job's start
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify"
          date +%s >"$RUNNER_TEMP/verify/job-start"
      # The whole history: make k8s-gitops-up checks the release at origin/<branch>, and gitops-argocd-metrics and
      # gitops-external-secrets read the charts at the commit svp-gitops pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      # k3d, Helm and the other pinned tools, as in job config of ci.yml.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # k3d and Helm for the bootstrap and the drills, which call them by name; kubectl is the runner image's
      # (deploy/ci/verify-host.sh checks its version against k3s).
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # ffmpeg for the test video of smoke, jq everywhere, nc for the drills' port checks.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq netcat-openbsd
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh "$SCENARIO"
      - name: Scenario
        timeout-minutes: 120
        env:
          SVP_VERIFY_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || '' }}
        run: deploy/ci/verify-run.sh "$SCENARIO"
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ env.SCENARIO }}
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      - name: make k8s-down
        if: always() && steps.ref.outcome == 'success'
        run: make k8s-down
