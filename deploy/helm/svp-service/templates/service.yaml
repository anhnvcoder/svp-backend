{{- /*
Its own ServiceAccount, with no Role or RoleBinding anywhere: the pod has no Kubernetes API rights, and no token is
mounted. A Service for every service with a port; media-worker has none.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if ne .Values.protocol "none" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
    {{- if eq .Values.protocol "grpc" }}
    # The calls to a gRPC Service go through the waypoint of chart svp-cluster (Gateway waypoint in svp-mesh), which
    # balances them one by one over the pods: a client's single long HTTP/2 connection would pin it to one pod.
    istio.io/use-waypoint: waypoint
    istio.io/use-waypoint-namespace: {{ .Values.peers.waypoint.namespace }}
    {{- end }}
spec:
  selector:
    {{- include "svp-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.protocol }}
      port: {{ .Values.port }}
      targetPort: {{ .Values.protocol }}
{{- end }}
