# Checks of every pull request and push to main; ci-ok is the only check the ruleset requires.
# Public repository: a fork's pull request runs this file with its own code, so:
# - no pull_request_target or workflow_run: no write token or secret reaches a pull request;
# - jobs that run repository code get contents: read only; the one write job (sarif) runs on main and runs none of it;
# - actions pinned to a full commit SHA; checkout with persist-credentials: false;
# - untrusted values (branch names, titles) reach scripts through env:, never ${{ }}.
# Design notes: docs/ci-cd.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # No paths filter on any trigger: a required check whose workflow never runs leaves the pull request waiting.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # On main a running run is never cancelled, but the group holds one running and one pending run: a newer push replaces
  # the pending one, so with several merges during one run the commits in between get no result of their own
  # (the newest commit's run checks the code they led to).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Outputs say which area a pull request changed; untouched areas skip and ci-ok accepts the skip.
  # Makefile, *.mk, this workflow, push and dispatch turn every output true: when in doubt, run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      proto: ${{ steps.files.outputs.proto }}
      api: ${{ steps.files.outputs.api }}
      workflows: ${{ steps.files.outputs.workflows }}
      stack: ${{ steps.files.outputs.stack }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          docs='^docs/|^LICENSE$|\.md$'
          generated='^deploy/helm/[^/]+/README\.md$'
          if [ "$EVENT" = pull_request ]; then
            # Both names of a renamed file, so a rename out of an area still runs its job.
            # The API lists at most 3000 files: a list shorter than changed_files is incomplete, so every job runs.
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            count=$(printf '%s\n' "$listed" | grep -c . || true)
            if [ "$count" -eq "$CHANGED" ]; then
              files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep -v '^$' || true)
            else
              echo "::notice::the API listed $count of the $CHANGED changed files: every job runs"
              files=Makefile
            fi
          else
            files=Makefile
          fi
          printf '%s\n' "$files"
          # any REGEX [EXCLUDE]: true when a file matches REGEX and not EXCLUDE.
          any() {
            if printf '%s\n' "$files" | grep -E -- "$1" | grep -v -E -e "${2:-^$}" | grep -q .; then echo true; else echo false; fi
          }
          everything=$(any '^Makefile$|\.mk$|^\.github/workflows/ci\.yml$')
          {
            if [ "$everything" = true ]; then
              printf '%s=true\n' code proto api workflows stack
            else
              # A generated README is code: job generate checks it.
              code=$(any '.' "$docs"); [ "$(any "$generated")" = false ] || code=true
              echo "code=$code"
              echo "proto=$(any '^proto/|^buf(\.gen)?\.yaml$|^buf\.lock$')"
              echo "api=$(any '^services/gateway/openapi\.yaml$|^deploy/ci/(contract|contract-test|common|platform)\.sh$')"
              echo "workflows=$(any '^\.github/')"
              echo "stack=$(any '.' "$docs|^deploy/helm/|^deploy/ci/|^deploy/k8s/(drills|cloud)/|^\.github/")"
            fi
          } | tee -a "$GITHUB_OUTPUT"

  # Tests reach Postgres and Redis on 127.0.0.1, the only addresses internal/pgtest and internal/redistest accept.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # Postgres 17 like compose, the cluster's and RDS, ahead of the dev machine's own. postgres/postgres is the
      # Makefile's default SVP_TEST_POSTGRES_URL; tests create their own svp_*_test databases from it.
      postgres:
        image: docker.io/library/postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        # The runner hands this string to docker create -p as it is, so the port is published on loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Same 8.8 line as the dev machine's Redis; tests use db 15, the default SVP_TEST_REDIS_URL of the Makefile.
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go matches Dockerfiles' builder image and dev machines. Caches modules and build cache, keyed on go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Transcode tests skip without ffmpeg/ffprobe (silent green). Ubuntu 24.04 ships 6.1; tests use stable flags only.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
      # -count=1 avoids cached test results. The SARIF path is filled in with ${{ runner.temp }} here: a $ left in
      # the value would be read by make as one of its variables.
      - name: make check-go
        env:
          LINTFLAGS: --output.text.path=stdout --output.sarif.path=${{ runner.temp }}/golangci-lint.sarif
        run: make check-go TESTFLAGS=-count=1 LINTFLAGS="$LINTFLAGS"
      - name: Summary of golangci-lint
        if: always()
        env:
          SARIF: ${{ runner.temp }}/golangci-lint.sarif
          TOOL: golangci-lint
        run: &sarif-summary |
          # Rule, level and place of each finding (no message), at most 50 rows; nothing when the tool wrote no report.
          [ -f "$SARIF" ] || exit 0
          jq -r --arg tool "$TOOL" '[.runs[].results[]] as $r
            | "### \($tool): \($r | length) finding(s)", "",
              "| Level | Rule | Location |", "| --- | --- | --- |",
              ($r[:50][] | .locations[0].physicalLocation as $l
                | "| \(.level // "warning") | \(.ruleId) | \($l.artifactLocation.uri // "-"):\($l.region.startLine // "-") |")' \
            "$SARIF" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the golangci-lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-golangci-lint
          path: ${{ runner.temp }}/golangci-lint.sarif
          if-no-files-found: ignore

  generate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - run: make generate-check

  buf:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The whole history, so the base commit below is there to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Comparison base: merge-base for PR/dispatch (a dispatch's before is empty, not zeros); before for push
      # (all zeros when the branch is new: nothing to compare).
      - name: buf breaking
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF") ;;
            push)
              if [ -z "${BEFORE//0/}" ]; then
                echo "buf breaking skipped: the push created the branch, there is no previous state to compare with." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              base=$BEFORE ;;
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          echo "buf breaking against $base"
          "$(go env GOPATH)/bin/buf" breaking --against ".git#ref=$base"

  # External clients pin gateway's REST contract by version: changes require info.version to increase accordingly.
  api-contract:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The whole history, so the base commit below is there to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Comparison base as for buf breaking: merge-base for PR/dispatch (before is empty there); before for a push.
      - name: make api-contract-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF") ;;
            push) base=$BEFORE ;;
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          make api-contract-check BASE="$base"
      - run: deploy/ci/contract-test.sh

  # Configuration, manifests, charts and CI scripts that no Go test covers.
  config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Deployment configuration the charts are checked against, read through gitops_dir of deploy/k8s/lib.sh.
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.gitops/svp-gitops
    steps:
      # The whole history: the test of gitops-check.sh reads the commits that the tree of svp-gitops pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Public repository, over HTTPS without credentials: no token, no secret.
      - run: make gitops-clone
      # Checked here because PRs changing only ignorefiles build no image. Broken entries would stop daily rescan;
      # expired entries fail only here (grype reads no date, covering matches forever). trivy-config rules <= 90 days.
      - run: make regal-lint
      - run: make conftest-verify
      - run: deploy/ci/scan-gate.sh --check-ignorefile
      # Image pipeline scripts, which otherwise run only in images.yml (mostly on main), in throwaway repositories with
      # fake gh, cosign and docker: no network, no token. scan-gate-test.sh runs the pinned conftest and yq through
      # Docker; image-gate-test.sh runs the pinned trivy, syft, grype and conftest on small fixtures (no service image,
      # no registry login, no vulnerability DB).
      - run: deploy/ci/image-guard-test.sh
      - run: deploy/ci/image-gate-test.sh
      - run: deploy/ci/plan-test.sh
      - run: deploy/ci/scan-gate-test.sh
      - run: deploy/ci/vuln-predicate-test.sh
      - run: deploy/ci/sign-image-test.sh
      - run: deploy/ci/rescan-test.sh
      - run: deploy/ci/verify-release-test.sh
      - run: deploy/ci/changed-services-test.sh
      # Promote guards, which otherwise run only on main with the app's token, in throwaway repositories with fake gh:
      # no network, no token.
      - run: deploy/ci/promote-test.sh
      # verify.yml artifact filter and log masks, otherwise used only by the weekly run on main: a pull request that
      # breaks one of their rules fails here. Fake tools, no network.
      - run: deploy/ci/verify-collect-test.sh
      # verify.yml step guards with fake tools: no network.
      - run: deploy/ci/verify-steps/steps-test.sh
      - run: deploy/ci/verify-steps/supplychain-test.sh
      - run: deploy/ci/verify-steps/admission-metrics-test.sh
      - run: deploy/ci/verify-steps/objstore-test.sh
      # Drills and credential rotation tested without a cluster: no network.
      - run: deploy/k8s/drills/run-test.sh
      - run: deploy/k8s/rotate-test.sh
      # ghcr-digest.sh tested with fake ORAS in a throwaway repository: no network.
      - run: deploy/ci/ghcr-digest-test.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Helm for gitops-check-test.sh below; make targets put GOBIN on PATH themselves.
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Chainsaw drills tested without a cluster: fake kubectl, no network.
      - run: make chainsaw-lint
      - run: deploy/k8s/drills/gitops/gitops-test.sh
      - run: make slo-check
      - run: make otelcol-validate
      # make env writes random secrets (mode 600) for this job only; never printed or uploaded, and compose config
      # does not print secrets.
      - name: make compose-config
        run: |
          make env
          make compose-config
      # Strict .env parsing tested on fixtures: checkout's .env never read, no network.
      - run: deploy/observability/glitchtip/dotenv-test.sh
      # The working tree's charts with main of svp-gitops (deploy/ci/gitops-check.sh --worktree), every third-party
      # image pinned by digest among them; needs network: chart repositories.
      - run: make helm-check
      # Release sources table rules and lookups: no network.
      - run: deploy/ci/sources-test.sh
      # Negative render cases and conftest policies of svp-gitops check: stops before network.
      - run: deploy/ci/gitops-check-test.sh "$SVP_GITOPS_DIR"
      # Cloud context guard and eks-* scripts, which otherwise run only by hand against a cloud cluster: fake tools,
      # no cloud account.
      - run: deploy/k8s/eks-context-test.sh
      # AWS Secrets Manager scripts tested with fake tools (no secret leaks in args/output): no cloud account.
      - run: deploy/k8s/aws-secrets-test.sh
      # Kafka init (topics, users, ACLs) and the svp-kafka, svp-valkey wrappers tested with fake tools: no network, no
      # broker.
      - run: deploy/helm/svp-data/files/kafka-init-test.sh
      - run: deploy/ops/ops-test.sh
      # k6 inspect catches malformed scenarios: no network, no compose stack.
      - run: make k6-check
      # kubeconform -strict of the k6 Job of the cloud cluster (deploy/k6/cloud/render.sh): a wrong field or kind is
      # caught here, without a cluster; every image must be pinned by digest. Needs network: the pinned Kubernetes schemas.
      - run: make cloud-check

  # Scans whole history of every ref (no --log-opts, which would drop --full-history --all). Any finding fails.
  # --redact keeps secrets out of logs and reports on public repo. False positives allowed only in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - name: gitleaks (whole history)
        run: >-
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Summary of gitleaks
        if: always()
        env:
          SARIF: ${{ runner.temp }}/gitleaks.sarif
          TOOL: gitleaks
        run: *sarif-summary
      - name: Keep the gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

  # Scans Dockerfiles, charts, and manifests for misconfigurations. Report only: findings never fail the job;
  # deploy/ci/trivy-config-ignore.yaml entries apply until expired_at.
  trivy-config:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make trivy-config TRIVY_CONFIG_SARIF="$RUNNER_TEMP/trivy-config.sarif"
      - name: Summary of trivy config
        if: always()
        env:
          SARIF: ${{ runner.temp }}/trivy-config.sarif
          TOOL: trivy config
        run: *sarif-summary
      - name: Keep the trivy config report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-config
          path: ${{ runner.temp }}/trivy-config.sarif
          if-no-files-found: ignore

  # Workflow security linter: findings not excepted in .github/zizmor.yml fail the job. GITHUB_TOKEN (read-only)
  # enables online audits (impostor commits, known action vulnerabilities); reads public data only.
  # The SARIF report beside it is for job sarif on main and never fails.
  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make zizmor ZIZMOR_FORMAT=github
      - name: zizmor SARIF report
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make zizmor ZIZMOR_SARIF="$RUNNER_TEMP/zizmor.sarif"
      - name: Keep the zizmor report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-zizmor
          path: ${{ runner.temp }}/zizmor.sarif
          if-no-files-found: ignore

  # Checks Markdown style, internal links and heading anchors (make docs-check): pinned images, offline, no network.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-check

  # Fails on added/changed dependencies with high or critical vulnerabilities before trivy and grype see them in an
  # image.
  # Pull requests only: compares base and head; on other events the job is skipped and ci-ok accepts the skip.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # End-to-end compose stack report outside ci-ok: flaky runs on shared runners must not block a merge.
  # Six backend services built from PR, web client from staging release.
  # make env writes random secrets that are never printed/uploaded; rate-limit resets touch only this run's Valkey.
  stack:
    name: stack (end-to-end, report only)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    # The job takes about 15-25 minutes; the limit leaves room for a slow runner and stops a hang long before the
    # 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: read
    # Clones svp-gitops for the staging web release tag, and svp-frontend at that commit for tests.
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.gitops/svp-gitops
      SVP_WEB_DIR: ${{ github.workspace }}/.web/svp-frontend
    # Postgres, Kafka and Valkey are containers of the compose stack; make up bootstraps Postgres inside its container.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needed for go run ./tools/jwtkey (generating JWT keys in make env) and GOPATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.4
          cache-dependency-path: go.sum
      # Script tools from Ubuntu archive (no third-party action): ffmpeg, jq.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq
      # Both public repositories, over HTTPS without credentials: no token, no secret. svp-frontend at the commit of the web
      # release of staging (image.tag of envs/stg/images/web.yaml in that clone of svp-gitops).
      - run: make gitops-clone
      - run: make web-clone
      # Node/pnpm match .nvmrc/packageManager. No Corepack (dropped in Node 25+); no cache (pnpm not yet on PATH).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .web/svp-frontend/.nvmrc
      - name: Install pnpm
        working-directory: .web/svp-frontend
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
      - name: Install the web client's packages
        working-directory: .web/svp-frontend
        run: make install
      - name: Install the Playwright browsers
        working-directory: .web/svp-frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: make env
      - run: make up
      - run: make smoke
      # Traces of failed tests stay in test-results/ of the clone on the runner: they hold session cookies and are
      # never uploaded.
      - run: make web-e2e
      - id: k6
        run: make load-ci
      # Ubuntu 24.04 AppArmor restricts unprivileged userns; lifted so Chrome's sandbox stays on (e2e disable it).
      - name: Let Chrome's sandbox use user namespaces
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)" = 1 ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "apparmor: kernel.apparmor_restrict_unprivileged_userns" \
            "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
      # Report only: one Lighthouse run per page on a shared runner is noise, so its thresholds never turn the job red.
      - id: lighthouse
        run: make web-lighthouse
        continue-on-error: true
      # DAST runs last because it exhausts gateway rate limits. Report only. Raw Schemathesis output stays on the
      # runner; only clean summary is logged.
      - id: dast
        run: make dast
        continue-on-error: true
        timeout-minutes: 15
      # The logs of the one-shot and data containers, which print no secret: the broker hides password settings, and
      # the init scripts print none.
      - name: Container state
        if: failure()
        run: |
          make ps
          make logs SVC='tls-init postgres kafka kafka-init valkey'
      # load.sh fails on secret leak but leaves files in place: re-checked here so summary.json uploads only if clean.
      # machine.json and other raw results stay on runner.
      - name: Pick the k6 summary
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        run: |
          mkdir -p "$RUNNER_TEMP/k6-summary"
          for summary in .k6/ci-*/summary.json; do
            [ -f "$summary" ] || continue
            if grep -IqE -i 'eyJ[A-Za-z0-9_-]{8,}|svp_sid|bearer|password|cookie|token|set-cookie' "$summary"; then
              echo "::warning::$summary looks like it holds a secret: not uploaded"
              continue
            fi
            cp "$summary" "$RUNNER_TEMP/k6-summary/"
          done
      - name: Keep the k6 summary
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: ${{ runner.temp }}/k6-summary/
          if-no-files-found: ignore
      # lighthouse/run.sh sanitizes/deletes reports with cookies. Copied from hidden dir; globs intentionally exclude
      # .lighthouseci/ (raw results).
      - name: Pick the Lighthouse reports
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse"
          for report in "$SVP_WEB_DIR"/test-results/lighthouse/*.html "$SVP_WEB_DIR"/test-results/lighthouse/*.json; do
            [ -f "$report" ] || continue
            cp "$report" "$RUNNER_TEMP/lighthouse/"
          done
      - name: Keep the Lighthouse reports
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: ${{ runner.temp }}/lighthouse/
          if-no-files-found: ignore
      # dast/run.sh fails on secrets but leaves dirty files in place: re-checked here. Only clean report/summary.json
      # leave runner; logs and HAR with response bodies/tokens stay on runner.
      - name: Pick the DAST reports
        if: always() && (steps.dast.outcome == 'success' || steps.dast.outcome == 'failure')
        run: |
          mkdir -p "$RUNNER_TEMP/dast"
          for report in .dast/*/report.json .dast/*/summary.json; do
            [ -f "$report" ] || continue
            if grep -qE 'eyJ[A-Za-z0-9_-]{8,}|"access_token"|"refresh_token"|svp_sid|Bearer [A-Za-z0-9]' "$report" ||
              grep -qiE 'X-Amz-Signature|X-Amz-Credential' "$report"; then
              echo "::warning::$report looks like it holds a secret: not uploaded"
              continue
            fi
            cp "$report" "$RUNNER_TEMP/dast/"
          done
      - name: Keep the DAST reports
        if: always() && (steps.dast.outcome == 'success' || steps.dast.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast
          path: ${{ runner.temp }}/dast/
          if-no-files-found: ignore
      - name: make down
        if: always()
        run: make down

  # Single job with write permission (security-events: write). Runs only on main outside pull requests and executes
  # no repository code (checkout is only for fingerprinting findings). Report outside ci-ok, but failure turns run red.
  sarif:
    needs: [check, gitleaks, trivy-config, zizmor]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each report the jobs above left, in sarif/<artifact name>/; a job that stopped before writing its report left
      # none, and its upload below is skipped.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
      - if: hashFiles('sarif/sarif-golangci-lint/golangci-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-golangci-lint/golangci-lint.sarif
          category: golangci-lint
      - if: hashFiles('sarif/sarif-gitleaks/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-gitleaks/gitleaks.sarif
          category: gitleaks
      - if: hashFiles('sarif/sarif-trivy-config/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-trivy-config/trivy-config.sarif
          category: trivy-config
      - if: hashFiles('sarif/sarif-zizmor/zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif/sarif-zizmor/zizmor.sarif
          category: zizmor

  # Required check running on always(): GitHub treats skipped required checks as passed. Fails unless all jobs
  # succeeded or were validly skipped (dependency-review outside PR, or area untouched by changes).
  # Any unexpected skip is red; no condition may skip ci-ok itself.
  ci-ok:
    needs: [changes, check, generate, buf, api-contract, config, gitleaks, trivy-config, zizmor, dependency-review, docs]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e --arg event "$EVENT" '
            .changes as $changes
            | {"check": "code", "generate": "code", "config": "code", "trivy-config": "code", "buf": "proto",
               "api-contract": "api", "zizmor": "workflows"} as $area
            | def skip_ok: (.key == "dependency-review" and $event != "pull_request")
                or ($changes.result == "success" and $area[.key] != null and $changes.outputs[$area[.key]] == "false");
            length == 11 and all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and skip_ok))
          ' <<< "$NEEDS" > /dev/null
