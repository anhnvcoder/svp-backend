# Supply chain drill, case c: value vulnerable (drill-vulnerable, signed and attested with CRITICAL vulnerabilities) as
# a dry run of a pod of svp: refused with the CRITICAL rule's message. CRITICAL is checked before the age, so that
# message cannot show the age rule holds: the case reads scanFinishedOn of the vuln attestation itself and fails,
# sending no pod, when it is older than the policy's maximum age. SKIP when value vulnerable is not given.

# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-c
  labels:
    drill: supplychain
spec:
  description: (c) an image attested with CRITICAL vulnerabilities, scanned within the maximum age, is refused by the CRITICAL rule
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: c-setup
    description: (c) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: c
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: c-critical
    description: (c) the vuln attestation of value vulnerable scanned within the maximum age, then the image refused for CRITICAL
    try:
    - continueOnError: true
      script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          vulnerable=${VULNERABLE:-}
          if [ -z "$vulnerable" ]; then
            skip "SUPPLYCHAIN_VULNERABLE (value vulnerable) is not set (digest of drill-vulnerable, signed and attested with CRITICAL vulnerabilities)"
            exit 0
          fi
          image_identity "$vulnerable"
          envelopes=$(cosign_ verify-attestation --type vuln --certificate-oidc-issuer "$policy_issuer" \
            --certificate-identity "$policy_subject" "$vulnerable" 2>"$work/cosign.err") || envelopes=
          # The oldest when there are several: Kyverno may read any one of them.
          scanned=$(jq -rs '[.[].payload | @base64d | fromjson | .predicate.metadata.scanFinishedOn] | min // empty' \
            <<<"$envelopes" 2>/dev/null) || scanned=
          age=
          if [[ $scanned =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            age=$(jq -nr --arg t "$scanned" 'now - ($t | fromdateiso8601) | floor') || age=
          fi
          if [[ -z $envelopes ]]; then
            result FAIL "$vulnerable: a vuln attestation of $policy_subject that cosign verifies (got: $(tail -n 1 "$work/cosign.err"))"
          elif [[ ! $age =~ ^-?[0-9]+$ ]]; then
            result FAIL "$vulnerable: read scanFinishedOn of its vuln attestation as RFC 3339 (got '$scanned')"
          elif ((age > max_age_s)); then
            result FAIL "$vulnerable: its vuln attestation was scanned at $scanned, more than $max_age ago, so a refusal for CRITICAL would not show the age rule holds; build the drill images again ($rebuild) and once that run is green run this with SUPPLYCHAIN_VULNERABLE set to the digest it pushed for drill-vulnerable"
          else
            dry_run drill-supplychain-c svp "$vulnerable"
            refused "vuln attestation reports a CRITICAL vulnerability" "$vulnerable (scanned at $scanned, within $max_age)"
          fi
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (c) ') || contains($stdout, 'SKIP  (c) ')): true
