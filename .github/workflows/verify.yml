# Deferred verification on a hosted runner of what 16 GB machines cannot hold; not a check of pull requests.
# Public repository: log and artifact are public, so everything printed is masked;
# - no job holds a secret or an environment; .env of fresh random secrets lives only on runner;
# - only workflow_dispatch and schedule; contents: read only, no pull_request_target or workflow_run;
# - actions pinned to a full commit SHA; checkout with persist-credentials: false;
# - untrusted inputs reach scripts through env:, never ${{ }} inside run:; svp-gitops only read.
# Design notes: docs/ci-cd.md.
name: verify

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario (compose-obs is the compose stack with OBS=lgtm, gitops the cluster of the GitOps path)
        type: choice
        required: true
        options:
          - compose-obs
          - gitops
          - dev-k3d
      targets:
        description: Steps to run, separated by spaces (SVP_VERIFY_STEP_NAMES of the job); empty runs every one, the build step always runs
        type: string
        required: false
        default: ""
      gitops_ref:
        description: dev-k3d only, the revision of svp-gitops the cluster is built from, main or a full commit SHA (40 hex, a branch not merged yet)
        type: string
        required: false
        default: main
  # Off the top of the hour (busy for GitHub's scheduler, which may delay or drop a run).
  # Runs on latest commit of main only; GitHub turns schedule off after 60 days without activity.
  schedule:
    - cron: "37 0 * * 6"

permissions: {}

# One run per scenario at a time (each on its own runner; a third dispatch replaces the waiting one).
# Scheduled run and dispatches use separate groups to run side by side; cancel-in-progress: false.
concurrency:
  group: verify-${{ inputs.scenario || github.event_name }}
  cancel-in-progress: false

jobs:
  # Rate-limit key resets during smoke and drill touch only this run's Redis service container.
  compose:
    if: github.event_name == 'schedule' || inputs.scenario == 'compose-obs'
    runs-on: ubuntu-24.04
    # Setup 20 minutes, the steps 40 + 15 + 30 + 20 and the mask 3, then 25 for the steps after them.
    timeout-minutes: 155
    permissions:
      contents: read
    env:
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_STEP_NAMES: up smoke drill-obs-threats test-stack-objstore
    services:
      # Published on loopback and Docker bridge gateway (172.17.0.1) for host.docker.internal; never 0.0.0.0.
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
          - 172.17.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:418e397fd48d66e450af13baab123397f2d2580b07ef310c3a5dbe96c3d731f1
        ports:
          - 127.0.0.1:6379:6379
          - 172.17.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Accident guard, not a security boundary (whoever can dispatch can push a branch of that name).
      - name: Check the ref
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify/logs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the targets
        run: deploy/ci/verify-steps/steps.sh check
      # Needed for jwtkey generation in make env and go test -race in test-stack-objstore.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - run: make ci-bridge-check
      # CLI tools for Postgres bootstrap, Redis rate-limit resets, and smoke test video generation.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client redis-tools ffmpeg jq
      # Clones svp-gitops to obtain staging web release configuration for make up.
      - name: make gitops-clone
        run: |
          make gitops-clone
          echo "SVP_GITOPS_DIR=$GITHUB_WORKSPACE/.gitops/svp-gitops" >>"$GITHUB_ENV"
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh compose-obs
      - name: make up OBS=lgtm
        id: up
        timeout-minutes: 40
        run: make up OBS=lgtm >"$SVP_VERIFY_OUT/logs/up.log" 2>&1 </dev/null
      # make up OBS=lgtm adds GlitchTip's tokens to .env.
      - name: Mask what the build step added
        if: always() && steps.ref.outcome == 'success'
        timeout-minutes: 3
        run: deploy/ci/verify-mask.sh env
      - name: make smoke
        id: smoke
        if: ${{ !cancelled() && steps.up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' smoke ')) }}
        timeout-minutes: 15
        run: make smoke >"$SVP_VERIFY_OUT/logs/smoke.log" 2>&1 </dev/null
      - name: make drill-obs-threats
        id: drill-obs-threats
        if: ${{ !cancelled() && steps.up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-obs-threats ')) }}
        timeout-minutes: 30
        run: make drill-obs-threats >"$SVP_VERIFY_OUT/logs/drill-obs-threats.log" 2>&1 </dev/null
      - name: test-stack-objstore
        id: test-stack-objstore
        if: ${{ !cancelled() && steps.up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' test-stack-objstore ')) }}
        timeout-minutes: 20
        run: deploy/ci/verify-steps/objstore.sh >"$SVP_VERIFY_OUT/logs/test-stack-objstore.log" 2>&1 </dev/null
      - name: Table of the steps
        if: always() && steps.ref.outcome == 'success'
        env:
          SVP_VERIFY_STEPS: ${{ toJSON(steps) }}
        run: deploy/ci/verify-steps/steps.sh table
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-compose-obs
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      # Without .env (cancelled before make env), no compose stack was started.
      - name: make down
        if: always() && steps.ref.outcome == 'success'
        run: |
          if [ -f .env ]; then make down; else echo "no .env: make env never ran, so no stack was started"; fi

  # Builds cluster via Argo CD over anonymous HTTPS with signed images by digest under Kyverno Enforce.
  # Pinned to the fetched commit of svp-gitops so subsequent releases do not alter test state.
  # SVP_VERIFY_SCHEDULED skips drill cases with expired attestations on scheduled runs.
  gitops:
    if: github.event_name == 'schedule' || inputs.scenario == 'gitops'
    runs-on: ubuntu-24.04
    # Setup 20 minutes, the steps 60 + 9 + 3 + 15 + 45 + 40 + 30 and the mask 3, then 25 for the steps after them.
    timeout-minutes: 250
    permissions:
      contents: read
    env:
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_STEP_NAMES: k8s-gitops-up drill-k8s-gitops gitops-admission-metrics k8s-smoke drill-k8s-reloader drill-k8s-supplychain drill-k8s-threats
    steps:
      - name: Check the ref
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify/logs"
      # Full history: needed for git revision checks in k8s-gitops-up and chart checks in drill-k8s-gitops.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the targets
        run: deploy/ci/verify-steps/steps.sh check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Put installed tools on PATH; kubectl comes from runner image and is verified by verify-host.sh.
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # ffmpeg for smoke test video generation, jq for JSON parsing, netcat for port checks.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq netcat-openbsd
      # svp-gitops commit SHA is pinned to ensure every subsequent step targets the exact same commit.
      - name: make gitops-clone
        run: |
          make gitops-clone
          if ! sha=$(git -C .gitops/svp-gitops rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}') ||
            [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::origin/main is not in the clone of svp-gitops"
            exit 1
          fi
          echo "SVP_GITOPS_DIR=$GITHUB_WORKSPACE/.gitops/svp-gitops" >>"$GITHUB_ENV"
          echo "SVP_GITOPS_SHA=$sha" >>"$GITHUB_ENV"
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      # The new values of drill-k8s-reloader, masked here as they are made (the drill's own output goes to a file).
      - name: New values of drill-k8s-reloader
        run: |
          install -d -m 700 "$RUNNER_TEMP/verify-reloader"
          deploy/k8s/drills/reloader/new-values.sh "$RUNNER_TEMP/verify-reloader/new-values"
          echo "SVP_DRILL_NEW_VALUES=$RUNNER_TEMP/verify-reloader/new-values" >>"$GITHUB_ENV"
      - run: deploy/ci/verify-host.sh gitops
      - name: make k8s-gitops-up
        id: k8s-gitops-up
        timeout-minutes: 60
        run: make k8s-gitops-up GITOPS_REV="$SVP_GITOPS_SHA" >"$SVP_VERIFY_OUT/logs/k8s-gitops-up.log" 2>&1 </dev/null
      # Masks cluster Secrets (svp, svp-data, svp-obs, argocd, svp-secrets) and additions to .env.
      # Each read is bounded in time; a cluster that does not answer leaves its list as it was.
      - name: Mask what the build step added
        if: always() && steps.ref.outcome == 'success'
        timeout-minutes: 3
        run: |
          deploy/ci/verify-mask.sh env
          deploy/ci/verify-mask.sh cluster || echo "verify-mask: the cluster's Secrets were not read"
      - name: make drill-k8s-gitops
        id: drill-k8s-gitops
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-gitops ')) }}
        timeout-minutes: 9
        run: make drill-k8s-gitops >"$SVP_VERIFY_OUT/logs/drill-k8s-gitops.log" 2>&1 </dev/null
      # Before k8s-smoke and the drills, so the histograms hold the first sync only.
      - name: gitops-admission-metrics
        id: gitops-admission-metrics
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' gitops-admission-metrics ')) }}
        timeout-minutes: 3
        run: deploy/ci/verify-steps/admission-metrics.sh >"$SVP_VERIFY_OUT/logs/gitops-admission-metrics.log" 2>&1 </dev/null
      - name: make k8s-smoke
        id: k8s-smoke
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' k8s-smoke ')) }}
        timeout-minutes: 15
        run: make k8s-smoke >"$SVP_VERIFY_OUT/logs/k8s-smoke.log" 2>&1 </dev/null
      # Tests credential rotation via Reloader; subsequent steps continue running on the new credentials.
      - name: make drill-k8s-reloader
        id: drill-k8s-reloader
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-reloader ')) }}
        timeout-minutes: 45
        run: make drill-k8s-reloader >"$SVP_VERIFY_OUT/logs/drill-k8s-reloader.log" 2>&1 </dev/null
      - name: drill-k8s-supplychain
        id: drill-k8s-supplychain
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-supplychain ')) }}
        timeout-minutes: 40
        env:
          SVP_VERIFY_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || '' }}
        run: deploy/ci/verify-steps/supplychain.sh >"$SVP_VERIFY_OUT/logs/drill-k8s-supplychain.log" 2>&1 </dev/null
      - name: make drill-k8s-threats
        id: drill-k8s-threats
        if: ${{ !cancelled() && steps.k8s-gitops-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-threats ')) }}
        timeout-minutes: 30
        run: make drill-k8s-threats >"$SVP_VERIFY_OUT/logs/drill-k8s-threats.log" 2>&1 </dev/null
      - name: Table of the steps
        if: always() && steps.ref.outcome == 'success'
        env:
          SVP_VERIFY_STEPS: ${{ toJSON(steps) }}
        run: deploy/ci/verify-steps/steps.sh table
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-gitops
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      - name: make k8s-down
        if: always() && steps.ref.outcome == 'success'
        run: make k8s-down

  # Dev path cluster: built with local images and svp-gitops at gitops_ref via helmfile.
  # Supply chain drill sets SUPPLYCHAIN_ENFORCE_TMP=1 to temporarily put Audit policy into Enforce.
  # Dispatched only; scheduled runs verify staging/production paths only.
  dev-k3d:
    if: inputs.scenario == 'dev-k3d'
    runs-on: ubuntu-24.04
    # Setup 20 minutes, the steps 60 + 15 + 45 + 40 and the mask 3, then 25 for the steps after them.
    timeout-minutes: 210
    permissions:
      contents: read
    env:
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_STEP_NAMES: k8s-up k8s-smoke drill-k8s-reloader drill-k8s-supplychain
      SVP_GITOPS_REF: ${{ inputs.gitops_ref }}
    steps:
      - name: Check the ref
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify/logs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the targets
        run: deploy/ci/verify-steps/steps.sh check
      # Rejected value is never printed back: a log line starting with :: would execute as a workflow command.
      - name: Check gitops_ref
        run: |
          case $SVP_GITOPS_REF in
            main) ;;
            *)
              if [[ ! $SVP_GITOPS_REF =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::gitops_ref is main or a full commit SHA of svp-gitops (40 hex); nothing started"
                exit 1
              fi
              ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # ffmpeg for smoke test video generation, jq for JSON parsing, netcat for port checks.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq netcat-openbsd
      # Clones svp-gitops at gitops_ref for base values and staging web client release.
      - name: make gitops-clone
        run: |
          make gitops-clone GITOPS_REF="$SVP_GITOPS_REF"
          echo "SVP_GITOPS_DIR=$GITHUB_WORKSPACE/.gitops/svp-gitops" >>"$GITHUB_ENV"
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      # The new values of drill-k8s-reloader, masked here as they are made (the drill's own output goes to a file).
      - name: New values of drill-k8s-reloader
        run: |
          install -d -m 700 "$RUNNER_TEMP/verify-reloader"
          deploy/k8s/drills/reloader/new-values.sh "$RUNNER_TEMP/verify-reloader/new-values"
          echo "SVP_DRILL_NEW_VALUES=$RUNNER_TEMP/verify-reloader/new-values" >>"$GITHUB_ENV"
      # The machine as job gitops needs it (k3d, 30 GiB free, the names of Envoy); the artifact names this scenario.
      - name: Prepare the runner
        run: |
          deploy/ci/verify-host.sh gitops
          echo dev-k3d >"$SVP_VERIFY_OUT/scenario"
      - name: make k8s-up
        id: k8s-up
        timeout-minutes: 60
        run: make k8s-up >"$SVP_VERIFY_OUT/logs/k8s-up.log" 2>&1 </dev/null
      # Masks cluster Secrets (svp, svp-data, svp-obs, argocd, svp-secrets) and additions to .env.
      - name: Mask what the build step added
        if: always() && steps.ref.outcome == 'success'
        timeout-minutes: 3
        run: |
          deploy/ci/verify-mask.sh env
          deploy/ci/verify-mask.sh cluster || echo "verify-mask: the cluster's Secrets were not read"
      - name: make k8s-smoke
        id: k8s-smoke
        if: ${{ !cancelled() && steps.k8s-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' k8s-smoke ')) }}
        timeout-minutes: 15
        run: make k8s-smoke >"$SVP_VERIFY_OUT/logs/k8s-smoke.log" 2>&1 </dev/null
      # Tests credential rotation via Reloader; subsequent steps continue running on the new credentials.
      - name: make drill-k8s-reloader
        id: drill-k8s-reloader
        if: ${{ !cancelled() && steps.k8s-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-reloader ')) }}
        timeout-minutes: 45
        run: make drill-k8s-reloader >"$SVP_VERIFY_OUT/logs/drill-k8s-reloader.log" 2>&1 </dev/null
      # Runs supply chain drill with Audit policy temporarily switched to Enforce.
      - name: drill-k8s-supplychain
        id: drill-k8s-supplychain
        if: ${{ !cancelled() && steps.k8s-up.outcome == 'success' && (!inputs.targets || contains(format(' {0} ', inputs.targets), ' drill-k8s-supplychain ')) }}
        timeout-minutes: 40
        env:
          SUPPLYCHAIN_ENFORCE_TMP: "1"
        run: deploy/ci/verify-steps/supplychain.sh >"$SVP_VERIFY_OUT/logs/drill-k8s-supplychain.log" 2>&1 </dev/null
      - name: Table of the steps
        if: always() && steps.ref.outcome == 'success'
        env:
          SVP_VERIFY_STEPS: ${{ toJSON(steps) }}
        run: deploy/ci/verify-steps/steps.sh table
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-dev-k3d
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      - name: make k8s-down
        if: always() && steps.ref.outcome == 'success'
        run: make k8s-down
