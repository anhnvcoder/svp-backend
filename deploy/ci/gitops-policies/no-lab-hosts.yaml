# Platforms without localHosts forbid *.svp.localhost: traffic and service origins must use real hosts.
# Design notes: docs/reference/ci.md.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-lab-hosts
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: ["*"]
  matchConditions:
    - name: not-a-crd
      expression: object.kind != 'CustomResourceDefinition'
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.?spec.orValue({}) :
        object.kind == 'CronJob' ? object.?spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        object.?spec.?template.?spec.orValue({})
    # A list field may render as null (env: with nothing under it): read as empty, as Kubernetes does.
    - name: containers
      expression: >-
        ['containers', 'initContainers', 'ephemeralContainers']
        .map(f, type(variables.podSpec[?f].orValue([])) == list ? variables.podSpec[?f].orValue([]) : []).flatten()
    - name: hosts
      expression: >-
        (object.kind in ['HTTPRoute', 'GRPCRoute', 'TLSRoute'] && type(object.?spec.?hostnames.orValue([])) == list
          ? object.?spec.?hostnames.orValue([]) : [])
        + (object.kind == 'Gateway' ? object.?spec.?listeners.orValue([]).map(l, l.?hostname.orValue('')) : [])
        + (object.kind == 'Ingress' ? object.?spec.?rules.orValue([]).map(r, r.?host.orValue(''))
          + object.?spec.?tls.orValue([]).map(t, t.?hosts.orValue([])).flatten() : [])
        + variables.containers.map(c, (type(c.?env.orValue([])) == list ? c.?env.orValue([]) : [])
          .filter(e, type(e.?value.orValue(0)) == string).map(e, e.value)).flatten()
    - name: lab
      expression: variables.hosts.filter(h, h.contains('svp.localhost'))
  validations:
    - expression: size(variables.lab) == 0
      messageExpression: "'names the lab host svp.localhost: ' + variables.lab.join(' ')"
