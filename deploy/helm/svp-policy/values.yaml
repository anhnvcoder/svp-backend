# ImageValidatingPolicy svp-images. Installed after Kyverno (wave 3 of argocd/apps/components.json of svp-gitops), whose
# chart brings the CRD, and before any pod of namespace svp (wave 7).

imageVerification:
  # Enforce: a pod that breaks a rule is refused, and so is every pod when Kyverno is down or cannot verify
  # (failurePolicy Fail): the GitOps path, whose images are the signed releases on GHCR. Audit: nothing is refused,
  # violations land in a PolicyReport of namespace svp, and a Kyverno that is down admits every pod (failurePolicy
  # Ignore): the dev path, with unsigned dev builds. install.sh sets Audit with --set, never in a file.
  mode: Enforce
  # The one namespace whose pods the policy checks, and the only one whose requests reach its webhook. Every platform
  # namespace stays out: their images are third-party ones pinned by digest and checked before merge (step 4 of
  # deploy/ci/gitops-check.sh, which make helm-check runs), and a Kyverno that is down must not stop them.
  namespace: svp
  # Which images run in the namespace, and whose signature each must carry, is in files/sources.json of this chart, the
  # one place every release source is written; the scripts that verify, sign or promote a release read it too
  # (release_sources of deploy/k8s/lib.sh). It sits in the chart, not in an overlay, so a source added or removed
  # reaches stg before prd.

  # Oldest scan result admitted (metadata.scanFinishedOn of the vuln attestation): the daily rescan refreshes it, so 72
  # hours bear two missed runs. A CEL duration.
  maxAttestationAge: 72h
  # Build provenance: true adds four checks after the six of the policy. Off here: the releases signed before CI
  # attested provenance have none, and a cluster checking it would refuse their pods. An environment's overlay
  # (envs/<env>/svp-policy.yaml of svp-gitops) turns it on once all seven services have a release with provenance; a
  # rollback to one from before must turn it off first. It holds for every source alike.

  # deploy/ci/verify-release.sh checks the same whenever a policy turns it on: it reads this line and the overlays, so
  # the overlay of svp-policy holds this key alone. The line keeps this shape (two spaces, the value bare, nothing after
  # it) and no other line of this file names the key: the checker of svp-gitops pinned at an older commit reads it that
  # way.
  requireProvenance: false

# Drills only (the tests of deploy/k8s/drills/supplychain/ render temporary copies with another name and an objectSelector
# on a drill label, case f with a shorter age): the policy's name, and the pods it applies to within the namespace.
name: svp-images
objectSelector: {}
