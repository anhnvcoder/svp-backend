# Signs and attests one image, keyless: cosign gets a short-lived certificate from Fulcio for the OIDC identity of the
# calling workflow (the steps of a composite action run in the caller's job, so the identity is the caller's workflow,
# the subject its release source names) and records each entry in Rekor; there is no key to leak or rotate. Downloads the
# artifacts index-<image> and leg-<image>-*, then, each a Sigstore bundle (an OCI referrer of its digest):
#   - cosign sign on the index digest (pods run the index digest, so that is what Kyverno verifies);
#   - cosign attest --type spdxjson of each platform's SBOM on that platform's manifest digest;
#   - cosign attest --type vuln of the predicate built from the two gating scans (deploy/ci/vuln-predicate.sh) on the
#     index digest;
#   - the build provenance (SLSA v1, actions/attest from the claims of the run's OIDC token) on the index digest, last.
# deploy/ci/image-guard.sh sign decides before anything is written: the index is the image's, under the prefix of the
# run's release source; a release is signed only when the calling workflow is the identity of that source; the index
# read back holds exactly the two scanned manifests; only drill-vulnerable may carry CRITICAL into its predicate; a
# digest in cosign's older format (.sig) is refused; and each bundle is written only when its digest has none of that
# type, so a run started again (bundles have no --replace) writes nothing twice. A drill image gets no provenance
# (drill-no-provenance is signed only to show the policy refusing a signed, clean image that lacks it). Hands on the
# artifact release-<image> (repository, tag, digest of the signed index), which promotion reads.
#
# cosign runs from COSIGN_IMAGE, the image the Makefile pins by digest, as the runner's user, with the credentials docker
# login wrote (the file, read-only), the working folder read-only at its own path, and the job's OIDC token request
# (ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN, passed by name, never by value), with which cosign
# asks for its token itself.
#
# Used only in a job with id-token: write (and packages: write, attestations: write) on main, which runs no code of a
# pull request and uses no cache: nothing here restores or saves one. Inputs reach the steps through env:, never ${{ }}
# inside run:; GITHUB_TOKEN is used only by docker login (for cosign, ORAS listing the referrers, and actions/attest).
# Every step that calls docker unsets DOCKER_DEFAULT_PLATFORM first, as every docker call of this repository does.
name: image-sign
description: "Sign the index of an image and attest its SBOMs, scan result and build provenance, once each"

inputs:
  image:
    description: "A service or drill image of the release source of this run's repository"
    required: true
  code-root:
    description: "The checkout whose code is built (another repository's); empty: this repository's checkout"
    required: false
    default: ""
  out:
    description: "Working folder: legs and index are downloaded to <out>/legs and <out>/index, the predicate written there"
    required: true

outputs:
  repository:
    description: "Repository of the signed index"
    value: ${{ steps.guard.outputs.repository }}
  digest:
    description: "Digest of the signed index"
    value: ${{ steps.guard.outputs.digest }}
  provenance:
    description: "true when the build provenance was attested in this run"
    value: ${{ steps.guard.outputs.provenance }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: leg-${{ inputs.image }}-*
        path: ${{ inputs.out }}/legs
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: index-${{ inputs.image }}
        path: ${{ inputs.out }}/index

    - name: Log in to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        unset DOCKER_DEFAULT_PLATFORM
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Check the index, build the vuln predicate, list the bundles there
      id: guard
      shell: bash
      env:
        GUARD: ${{ github.action_path }}/../../../deploy/ci/image-guard.sh
        IMAGE: ${{ inputs.image }}
        OUT: ${{ inputs.out }}
        SVP_CODE_ROOT: ${{ inputs.code-root }}
      run: '"$GUARD" sign "$IMAGE" "$OUT"'

    - name: Sign and attest
      id: sign
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OUT: ${{ steps.guard.outputs.out }}
        COSIGN_IMAGE: ${{ steps.guard.outputs.cosign-image }}
        REPOSITORY: ${{ steps.guard.outputs.repository }}
        DIGEST: ${{ steps.guard.outputs.digest }}
        AMD64: ${{ steps.guard.outputs.amd64 }}
        ARM64: ${{ steps.guard.outputs.arm64 }}
        PREDICATE: ${{ steps.guard.outputs.predicate }}
        SIGN: ${{ steps.guard.outputs.sign }}
        SBOM_AMD64: ${{ steps.guard.outputs.sbom-amd64 }}
        SBOM_ARM64: ${{ steps.guard.outputs.sbom-arm64 }}
        VULN: ${{ steps.guard.outputs.vuln }}
      run: |
        unset DOCKER_DEFAULT_PLATFORM
        config=${DOCKER_CONFIG:-$HOME/.docker}/config.json
        # cosign ARGS...: the pinned cosign; OUT (absolute) has the same path inside, so the predicates keep theirs.
        cosign() {
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:mode=1777 -e HOME=/tmp \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "$config:/auth/config.json:ro" -e DOCKER_CONFIG=/auth -v "$OUT:$OUT:ro" "$COSIGN_IMAGE" "$@"
        }
        bundle=(--yes --new-bundle-format=true)
        [ "$SIGN" != true ] || cosign sign "${bundle[@]}" "$REPOSITORY@$DIGEST"
        [ "$SBOM_AMD64" != true ] || cosign attest "${bundle[@]}" --type spdxjson \
          --predicate "$OUT/legs/leg-$IMAGE-amd64/sbom.spdx.json" "$REPOSITORY@$AMD64"
        [ "$SBOM_ARM64" != true ] || cosign attest "${bundle[@]}" --type spdxjson \
          --predicate "$OUT/legs/leg-$IMAGE-arm64/sbom.spdx.json" "$REPOSITORY@$ARM64"
        [ "$VULN" != true ] || cosign attest "${bundle[@]}" --type vuln --predicate "$PREDICATE" "$REPOSITORY@$DIGEST"
        echo "ok    $REPOSITORY@$DIGEST signed; SBOM on both manifests, vuln on the index"

    # Releases only, after the signature and the vuln attestation; pushed with the docker login above.
    - name: Attest the build provenance
      if: ${{ steps.guard.outputs.provenance == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.guard.outputs.repository }}
        subject-digest: ${{ steps.guard.outputs.digest }}
        push-to-registry: true
        # Storage records exist only for repositories owned by an organization; these belong to a user.
        create-storage-record: false

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-${{ inputs.image }}
        path: |
          ${{ inputs.out }}/index/repository
          ${{ inputs.out }}/index/tag
          ${{ inputs.out }}/index/digest
        if-no-files-found: error
        retention-days: 7
