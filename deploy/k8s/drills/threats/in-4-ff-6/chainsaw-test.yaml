# IN-4/FF-6 of the threat model (docs/threat-model.md): each Kafka user may write only its own topics and use only its own
# consumer group, and the Admin API of Redpanda needs credentials. Each user (password from Secret svp-data/kafka-users,
# passed on stdin, never printed) runs rpk in the broker container: producing to a topic not its own is
# TOPIC_AUTHORIZATION_FAILED (svp-keda, which may write no topic, gets no producer id: CLUSTER_AUTHORIZATION_FAILED),
# producing to its own topic works with an idempotent producer and WRITE on that topic only, describing the group of
# another service is GROUP_AUTHORIZATION_FAILED, its own works; media-worker cannot produce to video.lifecycle.v1, nor read
# another service's topic. The Admin API refuses node_config, cluster_config, security/users and brokers without
# credentials and serves /public_metrics; control: rpk with the broker's own login reads admin_api_require_auth (true).
#
# Test records: one empty record (key drill-threats-<run>, header svp-drill=threats) to the dead-letter topic of each user
# that has one; nothing consumes a dead-letter topic, and the dead-letter metric is counted by the services, not the
# broker. user-service owns no dead-letter topic: its right to produce to user.follows.v1 is shown with a record larger
# than the broker's 1 MiB limit, which the broker refuses with MESSAGE_TOO_LARGE once the user is authorized and with
# TOPIC_AUTHORIZATION_FAILED otherwise (shown first by the same oversized record from feed-service, which may read
# user.follows.v1 but not write it), so no record reaches a topic a service consumes. The high watermarks of the four
# consumed topics are read before the first record and compared after the last (a topic rpk cannot read fails the check
# rather than counting as unchanged); the first reading waits in .k8s/drills/in-4-ff-6-watermarks, deleted when the test
# ends.
#
# Each check and control is one step; a failed one marks the test failed and the next steps still run. The first reading
# of the high watermarks failing ends the test.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: in-4-ff-6
  labels:
    drill: threats
spec:
  description: "IN-4/FF-6: Kafka ACLs per user (own topics and group only, no record reaches a consumed topic) and the Admin API of Redpanda without credentials"
  # An existing namespace: Chainsaw neither creates nor deletes it.
  namespace: svp-data
  steps:
  - name: "IN-4/FF-6: setup: high watermarks of user.follows.v1, video.lifecycle.v1, media.transcodes.v1, engagement.views.v1 before the test records"
    try:
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        - {name: STAGE, value: before}
        content: &watermarks |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          state=$(git rev-parse --show-toplevel)/.k8s/drills/in-4-ff-6-watermarks
          # "TOPIC SUM" of the high watermarks per consumed topic, as svp-admin (the login the broker container has). No
          # line for a topic whose table is not the expected one (last column HIGH-WATERMARK, a number on every partition
          # row, at least one row), so a reading that failed can never compare as unchanged.
          ends=
          for t in user.follows.v1 video.lifecycle.v1 media.transcodes.v1 engagement.views.v1; do
            out=$(kubectl --context k3d-svp -n svp-data exec redpanda-0 -c redpanda -- rpk topic describe "$t" -p) ||
              { echo "FAIL  IN-4: rpk topic describe $t failed" >&2; exit 1; }
            sum=$(printf '%s\n' "$out" | awk 'NR == 1 { if ($NF != "HIGH-WATERMARK") bad = 1; next }
              $NF !~ /^[0-9]+$/ { bad = 1 } { s += $NF; n++ }
              END { if (!bad && n > 0) print s }')
            [ -n "$sum" ] || { echo "FAIL  IN-4: rpk topic describe $t gave no partition or an unexpected table" >&2; exit 1; }
            ends="$ends$t $sum;"
          done
          case $STAGE in
            before)
              mkdir -p "$(dirname "$state")"
              printf '%s\n' "$ends" >"$state"
              echo "$ends"
              ;;
            after)
              before=$(cat "$state" 2>/dev/null || true)
              if [ -n "$before" ] && [ "$ends" = "$before" ]; then
                echo unchanged
              else
                echo "before: ${before:-not read}, after: $ends"
              fi
              ;;
          esac
        check:
          ($error): ~
    cleanup:
    - script:
        content: |
          set -eu
          rm -f "$(git rev-parse --show-toplevel)/.k8s/drills/in-4-ff-6-watermarks"

  # One Kafka operation per step, as the user named: the step prints "ok" when the operation worked (for produce: a
  # record was written, at a partition@offset), otherwise the first Kafka error code rpk printed ("none" when it printed
  # none). stderr has rpk's answer as "OP rc=<exit status> code=<code> at=<partition@offset or ->". produce writes one
  # empty record with rpk's default, idempotent producer, which first asks for a producer id (granted with WRITE on any
  # topic); produce1 the same with acks 1, which is not idempotent, so only the right to write the topic itself is
  # asked; oversized one record of 1.6 MB (incompressible, no compression, the client's own limit raised so the broker
  # decides); group describes a group; consume reads one record without a group.
  # feed-service first: it may read user.follows.v1 (so its metadata is visible) but not write it; the broker refusing
  # its oversized record as unauthorized shows it checks the right to write before the size, which is what makes
  # MESSAGE_TOO_LARGE for user-service below a proof of its right.
  - name: "IN-4/FF-6: svp-feed-service may not produce an oversized record to user.follows.v1: TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-feed-service}
    - {name: kafkaOp, value: oversized:user.follows.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: &kafka
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        - {name: KAFKA_USER, value: ($kafkaUser)}
        - {name: KAFKA_OP, value: ($kafkaOp)}
        content: |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          # Run by bash in the broker container: the password is the first line on stdin, read into RPK_PASS (rpk's own
          # variable) and never on a command line; then one line per operation.
          ops='
          IFS= read -r RPK_PASS
          export RPK_PASS RPK_USER=$1
          key=drill-threats-$2
          shift 2
          big=$(mktemp)
          trap "rm -f \"$big\"" EXIT
          for op in "$@"; do
            arg=${op#*:}
            case ${op%%:*} in
              produce) out=$(printf "\n" | timeout 20 rpk topic produce "$arg" -k "$key" -H svp-drill=threats 2>&1); rc=$? ;;
              produce1) out=$(printf "\n" | timeout 20 rpk topic produce "$arg" --acks 1 -k "$key" -H svp-drill=threats 2>&1); rc=$? ;;
              oversized)
                [ -s "$big" ] || { head -c 1200000 /dev/urandom | base64 -w0; echo; } >"$big"
                out=$(timeout 30 rpk topic produce "$arg" -k "$key" -z none --max-message-bytes 4000000 <"$big" 2>&1); rc=$? ;;
              group) out=$(timeout 20 rpk group describe "$arg" 2>&1); rc=$? ;;
              consume) out=$(timeout 20 rpk topic consume "$arg" -n 1 -o start 2>&1); rc=$? ;;
              *) out=; rc=99 ;;
            esac
            code=$(printf "%s\n" "$out" | grep -oE "[A-Z]+(_[A-Z]+)+" | head -n 1)
            at=$(printf "%s\n" "$out" | sed -n "s/^Produced to partition \([0-9]*\) at offset \([0-9]*\).*/\1@\2/p")
            echo "$op rc=$rc code=${code:-none} at=${at:--}"
          done'
          run=$(date -u +%Y%m%dT%H%M%SZ)-$(openssl rand -hex 2)
          pw=$(kubectl --context k3d-svp -n svp-data get secret kafka-users -o json |
            jq -r --arg u "$KAFKA_USER" '.data[$u] // empty | @base64d') || pw=
          [ -n "$pw" ] || { echo "FAIL  IN-4: read the password of $KAFKA_USER from Secret svp-data/kafka-users" >&2; exit 1; }
          line=$(printf '%s\n' "$pw" | kubectl --context k3d-svp -n svp-data exec -i redpanda-0 -c redpanda -- \
            bash -c "$ops" bash "$KAFKA_USER" "$run" "$KAFKA_OP") ||
            { pw=; echo "FAIL  IN-4: run the Kafka check as $KAFKA_USER in redpanda-0" >&2; exit 1; }
          pw=
          echo "$line" >&2
          set -- $line
          [ "${1:-}" = "$KAFKA_OP" ] || { echo "FAIL  IN-4: no answer for $KAFKA_OP" >&2; exit 1; }
          rc=${2#rc=} code=${3#code=} at=${4#at=}
          if [ "$rc" != 0 ]; then
            echo "$code"
          elif [ "${KAFKA_OP%%:*}" = produce ] && [ "$at" = - ]; then
            echo "ok but no record written"
          else
            echo ok
          fi
        check:
          ($error): ~
          (trim_space($stdout)): ($want)
      continueOnError: true
  - name: "IN-4/FF-6: svp-feed-service may produce to user.follows.v1.dlq (idempotent) with WRITE on the topic only"
    bindings:
    - {name: kafkaUser, value: svp-feed-service}
    - {name: kafkaOp, value: produce:user.follows.v1.dlq}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-feed-service may not produce to video.lifecycle.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-feed-service}
    - {name: kafkaOp, value: produce:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-feed-service may describe group feed-service"
    bindings:
    - {name: kafkaUser, value: svp-feed-service}
    - {name: kafkaOp, value: group:feed-service}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-feed-service may not describe group video-service: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-feed-service}
    - {name: kafkaOp, value: group:video-service}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka

  - name: "IN-4/FF-6: svp-user-service may not produce to video.lifecycle.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-user-service}
    - {name: kafkaOp, value: produce:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-user-service may write user.follows.v1: its oversized record passes the authorization and is refused for its size only (MESSAGE_TOO_LARGE), nothing written"
    bindings:
    - {name: kafkaUser, value: svp-user-service}
    - {name: kafkaOp, value: oversized:user.follows.v1}
    - {name: want, value: MESSAGE_TOO_LARGE}
    try: *kafka
  - name: "IN-4/FF-6: svp-user-service may not describe group feed-service: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-user-service}
    - {name: kafkaOp, value: group:feed-service}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka

  - name: "IN-4/FF-6: svp-video-service may not produce to user.follows.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-video-service}
    - {name: kafkaOp, value: produce:user.follows.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-video-service may produce to media.transcodes.v1.dlq (idempotent) with WRITE on the topic only"
    bindings:
    - {name: kafkaUser, value: svp-video-service}
    - {name: kafkaOp, value: produce:media.transcodes.v1.dlq}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-video-service may describe group video-service"
    bindings:
    - {name: kafkaUser, value: svp-video-service}
    - {name: kafkaOp, value: group:video-service}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-video-service may not describe group media-worker: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-video-service}
    - {name: kafkaOp, value: group:media-worker}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka

  - name: "IN-4/FF-6: svp-engagement-service may not produce to video.lifecycle.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-engagement-service}
    - {name: kafkaOp, value: produce:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-engagement-service may produce to engagement.views.v1.dlq (idempotent) with WRITE on the topic only"
    bindings:
    - {name: kafkaUser, value: svp-engagement-service}
    - {name: kafkaOp, value: produce:engagement.views.v1.dlq}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-engagement-service may describe group engagement-service"
    bindings:
    - {name: kafkaUser, value: svp-engagement-service}
    - {name: kafkaOp, value: group:engagement-service}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-engagement-service may not describe group feed-service: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-engagement-service}
    - {name: kafkaOp, value: group:feed-service}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka

  - name: "IN-4/FF-6: svp-media-worker may not produce to video.lifecycle.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: produce:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-media-worker may not produce to user.follows.v1 (idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: produce:user.follows.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-media-worker may produce to video.lifecycle.v1.dlq (idempotent) with WRITE on the topic only"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: produce:video.lifecycle.v1.dlq}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-media-worker may describe group media-worker"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: group:media-worker}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-media-worker may not describe group engagement-service: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: group:engagement-service}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-media-worker may not read engagement.views.v1 without a group: TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-media-worker}
    - {name: kafkaOp, value: consume:engagement.views.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka

  # svp-keda may write no topic at all, so its idempotent producer gets no producer id (a cluster-level refusal); the
  # non-idempotent one shows the refusal on the topic itself.
  - name: "IN-4/FF-6: svp-keda may not produce to video.lifecycle.v1 (idempotent): CLUSTER_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-keda}
    - {name: kafkaOp, value: produce:video.lifecycle.v1}
    - {name: want, value: CLUSTER_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-keda may not produce to video.lifecycle.v1 (acks 1, not idempotent): TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-keda}
    - {name: kafkaOp, value: produce1:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-keda may describe group media-worker"
    bindings:
    - {name: kafkaUser, value: svp-keda}
    - {name: kafkaOp, value: group:media-worker}
    - {name: want, value: ok}
    try: *kafka
  - name: "IN-4/FF-6: svp-keda may not describe group feed-service: GROUP_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-keda}
    - {name: kafkaOp, value: group:feed-service}
    - {name: want, value: GROUP_AUTHORIZATION_FAILED}
    try: *kafka
  - name: "IN-4/FF-6: svp-keda may not read video.lifecycle.v1 without a group: TOPIC_AUTHORIZATION_FAILED"
    bindings:
    - {name: kafkaUser, value: svp-keda}
    - {name: kafkaOp, value: consume:video.lifecycle.v1}
    - {name: want, value: TOPIC_AUTHORIZATION_FAILED}
    try: *kafka

  - name: "IN-4/FF-6: high watermarks of user.follows.v1, video.lifecycle.v1, media.transcodes.v1, engagement.views.v1 unchanged: no test record reached a consumed topic"
    try:
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        - {name: STAGE, value: after}
        content: *watermarks
        check:
          ($error): ~
          (trim_space($stdout)): unchanged
      continueOnError: true

  # The Admin API from inside the broker container, without credentials: 401 or 403, but /public_metrics (the
  # Collector's scrape) 200.
  - name: "IN-4/FF-6: Admin API /v1/node_config without credentials: 401 or 403"
    bindings:
    - {name: adminPath, value: /v1/node_config}
    - {name: allowed, value: ["401", "403"]}
    try: &admin
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        - {name: ADMIN_PATH, value: ($adminPath)}
        content: |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          kubectl --context k3d-svp -n svp-data exec redpanda-0 -c redpanda -- curl -s -o /dev/null --max-time 5 -w '%{http_code}' \
            "http://redpanda-0.redpanda.svp-data.svc.cluster.local.:9644$ADMIN_PATH" || true
        check:
          ($error): ~
          (contains($allowed, trim_space($stdout))): true
      continueOnError: true
  - name: "IN-4/FF-6: Admin API /v1/cluster_config without credentials: 401 or 403"
    bindings:
    - {name: adminPath, value: /v1/cluster_config}
    - {name: allowed, value: ["401", "403"]}
    try: *admin
  - name: "IN-4/FF-6: Admin API /v1/security/users without credentials: 401 or 403"
    bindings:
    - {name: adminPath, value: /v1/security/users}
    - {name: allowed, value: ["401", "403"]}
    try: *admin
  - name: "IN-4/FF-6: Admin API /v1/brokers without credentials: 401 or 403"
    bindings:
    - {name: adminPath, value: /v1/brokers}
    - {name: allowed, value: ["401", "403"]}
    try: *admin
  - name: "IN-4/FF-6: Admin API /public_metrics without credentials: 200 (the Collector's scrape)"
    bindings:
    - {name: adminPath, value: /public_metrics}
    - {name: allowed, value: ["200"]}
    try: *admin
  - name: "IN-4/FF-6: control: rpk with the broker's own login (svp-admin) reads admin_api_require_auth through the Admin API: true"
    try:
    - script:
        env:
        - {name: CALLER_KUBECONFIG, value: (env('KUBECONFIG'))}
        content: |
          set -eu
          export KUBECONFIG="$CALLER_KUBECONFIG"
          kubectl --context k3d-svp -n svp-data exec redpanda-0 -c redpanda -- rpk cluster config get admin_api_require_auth
        check:
          ($error): ~
          (trim_space($stdout)): "true"
      continueOnError: true
