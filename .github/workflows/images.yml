# Builds, gates and releases backend container images; push exactly what was scanned, never rebuild between.
# permissions: {} at workflow root; jobs on pull requests have contents: read only; write jobs run on main.
# Actions pinned to full commit SHA; checkout persist-credentials: false.
# Untrusted values reach scripts via env:, never ${{ }} inside run:.
# promote and promote-prd gate GitHub App keys by environment; promote-prd waits for reviewer approval.
# 1-hour token scoped to svp-gitops only; no pull request job names either environment.
# Design notes: docs/ci-cd.md.
name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Off the hour (busy for GitHub's scheduler); Kyverno accepts an attestation 72 hours, so two missed days are fine.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Build these services instead of the changed ones: 'all', or names separated by spaces"
        type: string
        default: ""
      rescan:
        description: "Rescan the released digests now and replace their vuln attestations"
        type: boolean
        default: false
      values_ref:
        description: "With rescan: also the digests svp-gitops names at this branch, SHA or refs/pull/<n>/head (or a commit of this repository before svp-gitops)"
        type: string
        default: ""
      drill:
        description: "Build the three admission drill images drill-vulnerable, drill-unsigned and drill-no-provenance (never run)"
        type: boolean
        default: false
      promote_prd:
        description: "Open the pull request that promotes to prd envs/stg/ of svp-gitops at stg_ref (no build)"
        type: boolean
        default: false
      stg_ref:
        description: "With promote_prd: main or a full commit (40 hex) on main of svp-gitops; an older one is a rollback"
        type: string
        default: main

permissions: {}

# One group per ref and mode so rescan/drill do not cancel queued push runs. Runs on main are never cancelled:
# cancelling mid-signing leaves pushed digests unsigned. Runs on main follow each other, so each sees the result of
# the one before when it picks its base.
concurrency:
  group: >-
    images-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.rescan) && 'rescan'
    || (inputs.drill && 'drill' || (inputs.promote_prd && 'promote-prd' || 'build')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  last-success:
    # Dedicated job so only it reads the Actions API; runs no repository code.
    # On API failure, output stays empty and green so plan falls back to building all services safely.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.api.outputs.sha }}
    steps:
      - id: api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs_url="repos/$REPO/actions/workflows/images.yml/runs?branch=main&event=push&status=success&per_page=1"
          if sha=$(gh api "$runs_url" --jq '.workflow_runs[0].head_sha // ""'); then
            echo "sha=$sha" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::The Actions API did not answer: this run builds every service."
          fi

  plan:
    # Downstream jobs require explicit status functions (!cancelled()) because implicit success()
    # evaluates to false if any job up the needs chain was skipped (last-success skips on non-push).
    # Skipped on promote_prd dispatches since that mode only promotes to prd.
    needs: last-success
    if: ${{ !cancelled() && !inputs.promote_prd }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      images: ${{ steps.plan.outputs.images }}
      legs: ${{ steps.plan.outputs.legs }}
      has_images: ${{ steps.plan.outputs.has_images }}
      base: ${{ steps.plan.outputs.base }}
      promote_charts: ${{ steps.plan.outputs.promote_charts }}
      values_ref: ${{ steps.plan.outputs.values_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the base can be any earlier commit.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_DRILL: ${{ inputs.drill }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
          LAST_SUCCESS_SHA: ${{ needs.last-success.outputs.sha }}
        run: deploy/ci/plan.sh

  build-nopush:
    # Pull requests and refs other than main: build, scan and gate exactly like main, push nothing.
    # Findings go to the job summary only (no Security tab upload from a pull request).
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image-leg
        with:
          image: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          push: "false"
          out: ${{ runner.temp }}/leg

  build:
    # main: push exactly the scanned image by config digest; a blocked image stops the leg before push.
    # trivy/grype DB caches are the only shared state; no job holding id-token touches them.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: &release-leg
      - *checkout
      - uses: ./.github/actions/image-leg
        with:
          image: ${{ matrix.image }}
          arch: ${{ matrix.arch }}
          push: "true"
          out: ${{ runner.temp }}/leg

  merge:
    # Runs per image even if another failed; an image missing a leg artifact fails here, preventing release.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &merge
      - *checkout
      - uses: ./.github/actions/image-index
        with:
          image: ${{ matrix.image }}
          out: ${{ runner.temp }}/merge

  sign:
    # Signs index keyless and attests SBOM, vuln and SLSA provenance via Sigstore bundles.
    # The only build-path job with id-token: write and the only one with attestations: write; uses no cache.
    needs: [plan, merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &sign
      - *checkout
      - uses: ./.github/actions/image-sign
        with:
          image: ${{ matrix.image }}
          out: ${{ runner.temp }}/sign

  promote:
    # Promotes signed images and charts to svp-gitops stg; auto-merges on gitops-ok (envs/stg/ has no owner).
    # Runs even if some images failed sign (promotes successful ones); promote_not_behind guards revision order.
    # App token scoped to svp-gitops only; no id-token or packages permissions.
    needs: [plan, sign]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build'
      && (needs.plan.outputs.has_images == 'true' || needs.plan.outputs.promote_charts == 'true')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the guard compares this commit with stg's revision by ancestry.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases
      - id: app
        # Revoked when the job ends. The permissions here narrow the token below the app's own.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_GITOPS_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-stg in svp-gitops, open or update its pull request, turn on auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          . deploy/ci/common.sh
          code=$PWD repo=anhnvcoder/svp-gitops branch=bot/promote-stg app=svp-gitops-promoter
          # Cloned anonymously: the token reaches only gh and, through gh's credential helper, the push.
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$repo.git" "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          git checkout --quiet -B "$branch" origin/main
          # The releases of the open pull request not merged yet stay in: the files it changes, as it has them.
          if [ -n "$lease" ] && [ -n "$pr" ]; then
            git diff --name-only --diff-filter=AM "$(git merge-base origin/main "$lease")" "$lease" -- envs/stg/ |
              xargs -r git checkout "$lease" --
          fi
          promote_not_behind "$RUN_COMMIT" "$(git show origin/main:envs/stg/charts.yaml | yq_ .revision)"
          promote_not_behind "$RUN_COMMIT" "$(yq_ .revision envs/stg/charts.yaml)"
          # Each list on fd 3: yq_ hands its stdin to docker.
          seen=" "
          while IFS= read -r f <&3; do
            dir=$(dirname "$f") R=$(cat "$dir/repository") T=$(cat "$dir/tag") D=$(cat "$dir/digest")
            svc=${R#"$ghcr_prefix/"}
            if [[ " ${built_services[*]} " != *" $svc "* || $R != "$ghcr_prefix/$svc" || $T != "${RUN_COMMIT:0:12}" ||
              $seen == *" $svc "* ]] || ! is_digest "$D"; then
              fail "$dir is no release of a service of this repository at this commit, or a second one ($R:$T@$D)"
            fi
            yq_ R="$R" T="$T" D="$D" -i \
              '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "envs/stg/images/$svc.yaml"
            seen+="$svc "
          done 3< <(find "$RUNNER_TEMP/releases" -type f -name digest 2>/dev/null | sort)
          # The two values derived from the charts' commit, as the check of svp-gitops computes them again.
          psv=$(yq_ -e .podSecurityVersion <"$code/deploy/helm/svp-cluster/values.yaml")
          sum=$(sha256sum "$code/deploy/observability/otelcol/k8s-config.yaml" | cut -d' ' -f1)
          yq_ REV="$RUN_COMMIT" PSV="$psv" SUM="$sum" -i \
            '.revision = strenv(REV) | .podSecurityVersion = strenv(PSV) | .collectorConfigSha256 = strenv(SUM)' \
            envs/stg/charts.yaml
          if git diff --quiet origin/main; then
            echo "Nothing differs from main of svp-gitops: no push, no pull request."
            exit 0
          fi
          # Every release the branch holds, this run's and those its open pull request already had.
          names='' list='' rows='' count=0
          while IFS= read -r f <&3; do
            svc=$(basename "$f" .yaml)
            line=$(yq_ '.image | [.repository, .tag, .digest] | join("|")' "$f")
            IFS='|' read -r R T D <<<"$line"
            names+="${names:+, }$svc" count=$((count + 1))
            list+="- $svc: $R:$T@$D"$'\n'
            rows+="$(promote_image_row "$svc" "$R" "$T" "$D")"$'\n'
          done 3< <(git diff --name-only origin/main -- envs/stg/images/)
          code_url=https://github.com/$GITHUB_REPOSITORY/commit/$RUN_COMMIT
          charts=false
          if ! git diff --quiet origin/main -- envs/stg/charts.yaml; then
            charts=true
            list+="- charts: $RUN_COMMIT"$'\n'
            rows+="| \`charts.yaml\` | [\`${RUN_COMMIT:0:12}\`]($code_url) | — |"$'\n'
          fi
          commit_link="[\`${RUN_COMMIT:0:12}\`]($code_url)"
          if [ "$count" -eq 0 ]; then
            title="chore(stg): cập nhật chart ở ${RUN_COMMIT:0:12}"
            summary="Chuyển chart của stg sang commit $commit_link."
            why="Commit $commit_link vào \`main\` của \`$GITHUB_REPOSITORY\` đổi chart, nên stg cần chạy chart của commit đó."
            ran="[Lượt CI]($RUN_URL) chạy trên commit đó."
          else
            if [ "$count" -le 3 ]; then
              title="chore(stg): phát hành $names ở ${RUN_COMMIT:0:12}"
            else
              title="chore(stg): phát hành $count service ở ${RUN_COMMIT:0:12}"
            fi
            summary="Đưa $count service lên stg bằng image mới"
            [ "$charts" = false ] || summary+=" và chuyển chart sang commit $commit_link"
            summary+="."
            why="Các commit vào \`main\` của \`$GITHUB_REPOSITORY\` ghi trong bảng đã build và ký image mới, nên stg cần chạy bản đó.
          Mỗi dòng của bảng ghi commit của chính nó: PR giữ cả bản của lượt trước chưa merge.
          Bảng chỉ hiện 12 ký tự đầu của digest; digest đầy đủ nằm trong commit của PR."
            ran="Mỗi image trong bảng do lượt CI của commit ở dòng đó build và ký; [lượt CI]($RUN_URL) của $commit_link dựng PR này."
          fi
          msg="${list}
          Code: $code_url
          Run: $RUN_URL"
          body="## Thay đổi gì

          $summary

          | Service | Commit | Image |
          | --- | --- | --- |
          ${rows}
          ## Vì sao

          $why

          ## Đã kiểm gì

          - $ran
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này. Với mỗi file image đổi, nó kiểm image ghim digest, có chữ ký,
            kết quả quét lỗ hổng còn hạn và provenance khớp commit; nó cũng kiểm chart render được.
          - PR tự merge (squash) khi \`gitops-ok\` xanh. \`envs/stg/\` không có Code Owner nên không cần ai duyệt.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của \`envs/stg/images/<service>.yaml\` và ba giá trị \`revision\`, \`podSecurityVersion\`,
          \`collectorConfigSha256\` của \`envs/stg/charts.yaml\`. Mỗi lượt build dựng lại nhánh \`$branch\` từ \`main\` và giữ các bản chưa merge của PR này."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          # The lease is the branch as cloned (empty: it must not exist): a change since fails the push, never lost.
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          # Read again after the push. The pull request read before, merged or closed meanwhile, no longer holds the
          # branch, and a new one would carry again what was merged or what its owner dropped.
          now=$(promote_open_pr "$repo" "$branch" "$app")
          [ -z "$pr" ] || [ "$now" = "$pr" ] ||
            fail "pull request #$pr of $branch was merged or closed during this run: run the job again (from main as is)"
          if [ -n "$now" ]; then
            gh pr edit "$now" --repo "$repo" --title "$title" --body "$body"
          else
            now=$(gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body")
            now=${now##*/}
          fi
          gh pr merge "$now" --repo "$repo" --auto --squash --match-head-commit "$(git rev-parse HEAD)"

  promote-prd:
    # Promotes stg commit (stg_ref) to prd in svp-gitops; no auto-merge (requires code owner approval).
    # environment: promote-prd reviewer must approve before GitHub App key is accessed (no admin bypass).
    # promote_stg_evidence verifies argocd/stg Healthy status on the commit before minting the 1-hour token.
    # Dedicated run: plan skips all other jobs so prd promotion runs strictly in isolation.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.promote_prd && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote-prd
    permissions:
      contents: read
    steps:
      - name: A run of its own
        env:
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_DRILL: ${{ inputs.drill }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
        run: |
          if [ -n "$INPUT_SERVICES$INPUT_VALUES_REF" ] || [ "$INPUT_RESCAN" = true ] || [ "$INPUT_DRILL" = true ]; then
            echo "::error::promote_prd is a run of its own: dispatch it without services, rescan, values_ref or drill"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stg
        name: The commit of svp-gitops at stg_ref, and stg's commit status on it
        env:
          GH_TOKEN: ${{ github.token }}
          STG_REF: ${{ inputs.stg_ref }}
        run: |
          set -euo pipefail
          . deploy/ci/common.sh
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$gitops_repo.git" "$RUNNER_TEMP/gitops"
          ref=$(promote_stg_ref "${STG_REF:-main}" "$RUNNER_TEMP/gitops")
          promote_stg_evidence "$ref"
          step_output ref "$ref"
      - id: app
        # Revoked when the job ends; narrower than the app's own permissions.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_GITOPS_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-prd in svp-gitops from envs/stg/ at stg_ref, open or update its pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ steps.stg.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          . deploy/ci/common.sh
          repo=anhnvcoder/svp-gitops branch=bot/promote-prd app=svp-gitops-promoter
          # The clone of the step before, whose guards passed on REF.
          cd "$RUNNER_TEMP/gitops"
          ref=$REF
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          git checkout --quiet -B "$branch" origin/main
          # Read into a variable, not through a pipe into read: a file missing at stg_ref fails the step.
          list='' rows=''
          for svc in "${svp_services[@]}"; do
            line=$(git show "$ref:envs/stg/images/$svc.yaml" | yq_ '.image | [.repository, .tag, .digest] | join("|")')
            IFS='|' read -r R T D <<<"$line"
            yq_ R="$R" T="$T" D="$D" -i \
              '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "envs/prd/images/$svc.yaml"
            list+="- $svc: $R:$T@$D"$'\n'
            rows+="$(promote_image_row "$svc" "$R" "$T" "$D")"$'\n'
          done
          line=$(git show "$ref:envs/stg/charts.yaml" |
            yq_ '[.revision, .podSecurityVersion, .collectorConfigSha256] | join("|")')
          IFS='|' read -r REV PSV SUM <<<"$line"
          # gitopsRevision: the commit whose argocd/apps, base/ and platforms/ prd renders, the one stg ran.
          yq_ REV="$REV" PSV="$PSV" SUM="$SUM" PIN="$ref" -i \
            '.revision = strenv(REV) | .podSecurityVersion = strenv(PSV) | .collectorConfigSha256 = strenv(SUM)
              | .gitopsRevision = strenv(PIN)' envs/prd/charts.yaml
          list+="- charts: $REV"$'\n'"- gitopsRevision: $ref"$'\n'
          rows+="| \`charts.yaml\` | [\`${REV:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$REV) | — |"$'\n'
          rows+="| \`gitopsRevision\` | [\`${ref:0:12}\`](https://github.com/$repo/commit/$ref) | — |"$'\n'
          if git diff --quiet origin/main; then
            echo "prd on main of svp-gitops already runs envs/stg/ of ${ref:0:12}: no push, no pull request."
            exit 0
          fi
          title="chore(prd): phát hành bộ stg của svp-gitops ${ref:0:12}"
          msg="${list}
          Stg-ref: $ref
          Run: $RUN_URL"
          body="## Thay đổi gì

          Đưa prd lên đúng bộ mà stg chạy ở commit [\`${ref:0:12}\`](https://github.com/$repo/commit/$ref) của \`svp-gitops\`: image của ${#svp_services[@]} service, chart, và
          \`gitopsRevision\` (prd render \`argocd/apps\`, \`base/\`, \`platforms/\` ở commit đó).

          | Service | Commit | Image |
          | --- | --- | --- |
          ${rows}
          Digest đầy đủ nằm trong commit của PR.

          ## Vì sao

          stg đã chạy bộ này và qua \`gitops-ok\`; prd chép nguyên bộ đó, không build lại. Bộ lấy từ \`envs/stg/\` ở commit trên theo
          \`stg_ref\` của [lượt promote]($RUN_URL). Nếu \`stg_ref\` trỏ một commit cũ, PR này đưa prd về bản cũ (rollback).

          ## Đã kiểm gì

          - Commit trên có commit status \`argocd/stg\` mới nhất là \`success\`: stg đã đồng bộ bộ này và thấy Healthy.
          - [Lượt promote]($RUN_URL) đọc \`envs/stg/\` ở commit trên và chép vào \`envs/prd/\`.
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này, kiểm như PR của stg: image ghim digest, chữ ký, kết quả quét lỗ hổng
            và provenance, chart render được.
          - **Cần Code Owner duyệt.** PR không tự merge: \`envs/prd/\` có Code Owner, duyệt của họ là cổng vào prd.
          - Nếu \`gitops-ok\` đỏ vì kết quả quét lỗ hổng (\`vuln\`) quá hạn (bộ cũ, rollback), quét lại bằng
            \`gh workflow run images.yml --repo $GITHUB_REPOSITORY --ref main -f rescan=true -f values_ref=$ref\` rồi chạy lại check.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của ${#svp_services[@]} file \`envs/prd/images/*.yaml\` và bốn giá trị \`revision\`, \`podSecurityVersion\`,
          \`collectorConfigSha256\`, \`gitopsRevision\` của \`envs/prd/charts.yaml\`. Các dòng khác của file, kể cả chú thích, giữ nguyên."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$repo" --title "$title" --body "$body"
          else
            gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body"
          fi

  contract:
    # Publishes gateway OpenAPI as OCI artifact signed keyless by this workflow on main.
    # Idempotent: identical version is kept, modified content fails; serial runs prevent concurrent tag pushes.
    # Uses no cache because the job holds id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'build'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - *checkout
      - &cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Publish and sign the API contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/contract.sh publish

  rescan:
    # Daily/dispatch rescan of released digests in svp-gitops; replaces vuln attestations with fresh scans.
    # Older vuln bundles removed via packages: write; CRITICAL records then fails job; secrets fail immediately.
    # svp-gitops cloned anonymously as data; uses no cache because the job holds id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'rescan'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.gitops/svp-gitops
    steps:
      - *checkout
      - *cosign
      - run: make gitops-clone
      - name: Rescan and attest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VALUES_REF: ${{ needs.plan.outputs.values_ref }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/rescan.sh run "$RUNNER_TEMP/rescan" "$SVP_GITOPS_DIR" "$VALUES_REF"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-rescan
          path: ${{ runner.temp }}/rescan/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  # Built here because keyless signing identity is this workflow on main, the only identity Kyverno trusts.
  # YAML aliases (*release-leg, *merge, *sign) reuse release steps so only vuln, signature or provenance differ.
  # Drill images (drill-vulnerable, drill-unsigned, drill-no-provenance) test admission rejection; never run.
  # svp-gitops never names them so daily rescan never re-attests; drills read them within policy maximum age.
  drill-build:
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: *release-leg

  drill-merge:
    needs: [plan, drill-build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: *merge

  drill-sign:
    # drill-unsigned stays unsigned. Drill images get no build provenance: image-guard.sh sign hands provenance=false
    # for them, so image-sign skips actions/attest: a drill image is no release, and drill-no-provenance exists to
    # lack it.
    needs: [plan, drill-merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [drill-vulnerable, drill-no-provenance]
    steps: *sign

  sarif:
    # Uploads SARIF to Security tab split by tool: GitHub rejects logs with >20 runs (12 legs would yield 24).
    # Only job with security-events: write; runs no repo code; not in images-ok (reporting only).
    needs: [plan, build, rescan]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.plan.outputs.mode == 'rescan'
      || (needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif
      - id: split
        # Splits SARIF by tool and counts runs with jq so logs exceeding 20 runs fail early with clear counts.
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-trivy" "$RUNNER_TEMP/sarif-grype"
          while IFS= read -r -d '' f; do
            # download-artifact unpacks a lone artifact straight into the path, with no folder of its name: a
            # rescan uploads only sarif-rescan, so its files land directly in sarif/ and are trivy's.
            case "$f" in
              */grype.sarif) tool=grype ;;
              */trivy.sarif | */sarif-rescan/*.sarif | "$RUNNER_TEMP"/sarif/*-*.sarif) tool=trivy ;;
              *)
                echo "::error::Unexpected SARIF file ${f#"$RUNNER_TEMP"/}"
                exit 1
                ;;
            esac
            dir=${f%/*}
            cp "$f" "$RUNNER_TEMP/sarif-$tool/${dir##*/}-${f##*/}"
          done < <(find "$RUNNER_TEMP/sarif" -name '*.sarif' -print0 2>/dev/null)
          over=0
          for tool in trivy grype; do
            files=("$RUNNER_TEMP/sarif-$tool"/*.sarif)
            if [ ! -e "${files[0]}" ]; then
              echo "No $tool SARIF to upload (no leg reached its scan)."
              continue
            fi
            runs=$(jq -s 'map(.runs | length) | add' "${files[@]}")
            if [ "$runs" -gt 20 ]; then
              echo "::error::$runs $tool SARIF runs in ${#files[@]} files: GitHub rejects an upload with more than 20 runs"
              over=1
              continue
            fi
            echo "$tool: $runs SARIF runs in ${#files[@]} files"
            echo "$tool=true" >>"$GITHUB_OUTPUT"
          done
          exit "$over"
      - name: Upload the trivy SARIF
        if: ${{ !cancelled() && steps.split.outputs.trivy == 'true' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/sarif-trivy
      - name: Upload the grype SARIF
        if: ${{ !cancelled() && steps.split.outputs.grype == 'true' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/sarif-grype

  images-ok:
    # Required check: recomputes expected skips from event, ref and plan outputs; unexpected skips turn red.
    # Runs always() and never skips itself (GitHub treats skipped checks as passed); runs no repository code.
    needs:
      - last-success
      - plan
      - build-nopush
      - build
      - merge
      - sign
      - promote
      - promote-prd
      - contract
      - rescan
      - drill-build
      - drill-merge
      - drill-sign
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ needs.plan.outputs.mode }}
          HAS_IMAGES: ${{ needs.plan.outputs.has_images }}
          PROMOTE_CHARTS: ${{ needs.plan.outputs.promote_charts }}
          PROMOTE_PRD: ${{ inputs.promote_prd }}
        run: |
          main=false
          [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && main=true
          # skip_ok JOB: true when this run is one in which JOB does not run.
          skip_ok() {
            case $1 in
            last-success) [ "$EVENT" != push ] ;;
            plan) [ "$EVENT" = workflow_dispatch ] && [ "$PROMOTE_PRD" = true ] ;;
            build-nopush) [ "$main" = true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            build | merge | sign) [ "$main" != true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            promote)
              [ "$main" != true ] || [ "$MODE" != build ] || { [ "$HAS_IMAGES" != true ] && [ "$PROMOTE_CHARTS" != true ]; }
              ;;
            promote-prd) [ "$main" != true ] || [ "$EVENT" != workflow_dispatch ] || [ "$PROMOTE_PRD" != true ] ;;
            contract) [ "$main" != true ] || [ "$MODE" != build ] ;;
            rescan) [ "$MODE" != rescan ] ;;
            drill-build | drill-merge | drill-sign) [ "$MODE" != drill ] ;;
            *) false ;;
            esac
          }
          red=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case $result in
            success) echo "ok    $job" ;;
            skipped)
              if skip_ok "$job"; then
                echo "ok    $job skipped: not part of this run"
              else
                echo "::error::$job was skipped, but this run needed it"
                red=1
              fi
              ;;
            *)
              echo "::error::$job: $result"
              red=1
              ;;
            esac
          done
          exit "$red"
