        - *kubeconfig
        - {name: TARGET, value: "monitoring"}
        - {name: VARIANT, value: "Origin: https://s3.svp.localhost:8443"}
        content: *web2send
        check:
          ($error): ~
          (trim_space($stdout)): 403 CSRF_REJECTED
    - description: "WEB-2: POST monitoring with the session cookie and Origin: null: 403 CSRF_REJECTED"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "monitoring"}
        - {name: VARIANT, value: "Origin: null"}
        content: *web2send
        check:
          ($error): ~
          (trim_space($stdout)): 403 CSRF_REJECTED
    - description: "WEB-2: POST monitoring with the session cookie and neither Sec-Fetch-Site nor Origin: 403 CSRF_REJECTED"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "monitoring"}
        - {name: VARIANT, value: ""}
        content: *web2send
        check:
          ($error): ~
          (trim_space($stdout)): 403 CSRF_REJECTED
    # Controls: the same POSTs from the app's own pages pass the check.
    - description: "WEB-2: control: POST of the /login form's Server Action from the app's origin (logged out, wrong password): 200, the form shows \"Wrong email or password\" (the action ran and asked the gateway)"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        content: |
          set -euo pipefail
          . ./web.sh
          work_ready
          : >"$work/web2.out"
          status=$(curl -sS --max-time 15 -o "$work/web2.out" -w '%{http_code}' -K "$work/web2-login.curl" \
            -H 'Sec-Fetch-Site: same-origin' -H "Origin: $web_base" || true)
          echo "$status $(form_error "$work/web2.out")"
        check:
          ($error): ~
          (trim_space($stdout)): 200 wrong-credentials
    - description: "WEB-2: control: POST /api/videos with an empty object from the app's origin: 400 from the gateway, past the check"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "api"}
        - {name: VARIANT, value: "Sec-Fetch-Site: same-origin|Origin: https://svp.localhost:8443"}
        content: *web2send
        check:
          ($error): ~
          (starts_with(trim_space($stdout), '400 ')): true
          (trim_space($stdout) != '400 CSRF_REJECTED'): true
    - description: "WEB-2: control: POST /rum with a beacon from the app's origin: 204"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "rum"}
        - {name: VARIANT, value: "Sec-Fetch-Site: same-origin|Origin: https://svp.localhost:8443"}
        content: *web2send
        check:
          ($error): ~
          (trim_space($stdout)): "204"
    - description: "WEB-2: control: POST /monitoring with an empty object from the app's origin: 400 INVALID_REPORT (checked, nothing sent; 404 means SENTRY_DSN is empty in Secret svp/sentry)"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        - {name: TARGET, value: "monitoring"}
        - {name: VARIANT, value: "Sec-Fetch-Site: same-origin|Origin: https://svp.localhost:8443"}
        content: *web2send
        check:
          ($error): ~
          (trim_space($stdout)): 400 INVALID_REPORT
    # The logout clears the cookie (Max-Age=0), so curl drops it from the jar; a copy of the jar from before sends the old
    # sid again, which shows the server deleted the session, not only the cookie.
    - description: "WEB-2: control: POST /logout from the app's origin: 303"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        content: |
          set -euo pipefail
          . ./web.sh
          work_ready
          cp "$work/web.jar" "$work/web2-old.jar"
          web_post /logout "$work/web2.out" -H 'Sec-Fetch-Site: same-origin' -H "Origin: $web_base"
        check:
          ($error): ~
          (trim_space($stdout)): "303"
    - description: "WEB-2: control: the logout cleared the session cookie (no __Host-Http-svp_sid left in the cookie jar)"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        content: |
          set -euo pipefail
          . ./web.sh
          work_ready
          if [[ -z $(web_sid) ]]; then echo cleared; else echo "the session cookie is still in the cookie jar"; fi
        check:
          ($error): ~
          (trim_space($stdout)): cleared
    - description: "WEB-2: control: after the logout the old session id sent again is refused: GET /api/me 401 (the session was deleted on the server)"
      continueOnError: true
      script:
        shell: bash
        env:
        - *kubeconfig
        content: |
          set -euo pipefail
          . ./web.sh
          work_ready
          if [[ -f $work/web2-old.jar ]]; then
            status=$(web_jar=$work/web2-old.jar web_get /api/me "$work/web2.out")
          else
            status="no copy of the cookie jar from before the logout"
          fi
          rm -f "$work/web2-old.jar"
          echo "$status"
        check:
          ($error): ~
          (trim_space($stdout)): "401"
