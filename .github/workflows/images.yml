# Images of the six backend services (the web client's are svp-frontend's): build only what changed,
# on native amd64 and arm64 runners; scan the local image with trivy, and its SBOM with grype, and block secrets and
# CRITICAL vulnerabilities BEFORE anything is pushed; push exactly what was scanned; join a multi-arch index; sign it keyless with cosign and
# attest the SBOM (syft), the scan result and the build provenance; promote the signed digests to stg through a pull request in the
# deployment repository svp-gitops; rescan released digests daily. Also publishes the gateway's API contract
# (services/gateway/openapi.yaml) as a signed OCI artifact, so the web client builds from a signed version of it. The logic lives in deploy/ci/*.sh, which also run on a machine; this file wires jobs, permissions and
# artifacts.
#
# Security rules of this file:
#   - permissions: {} here, and each job declares only what it needs. Every job that runs on a pull request has only
#     contents: read: a pull request runs its own scripts before anyone has read them. Jobs that can write (packages,
#     id-token, security-events) or read the Actions API run only on main, outside pull_request.
#   - Only jobs promote and promote-prd write to another repository, each from an environment of its own that holds a
#     key of the GitHub App installed on svp-gitops alone (deployment branch main only): promote (stg) and promote-prd,
#     whose required reviewer approves every run before the job gets its key, with no admin bypass. Each job turns its
#     key into a token of one hour for svp-gitops with contents and pull-requests write only. No job of a pull request
#     names either environment.
#   - Every action is pinned to a full commit SHA (the tag in the comment is for people and Renovate); only GitHub's
#     own actions and sigstore/cosign-installer.
#   - Untrusted values (inputs, branch names, matrix values from plan) reach scripts through env:, never ${{ }} inside
#     run:.
#   - actions/checkout never keeps the token in .git/config: no job pushes to this repository.
name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rescan, off the top of the hour (busy for GitHub's scheduler). Kyverno accepts an attestation for 72 hours,
    # so two missed days are still fine.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Build these services instead of the changed ones: 'all', or names separated by spaces"
        type: string
        default: ""
      rescan:
        description: "Rescan the released digests now and replace their vuln attestations"
        type: boolean
        default: false
      values_ref:
        description: "With rescan: also the digests svp-gitops names at this branch, SHA or refs/pull/<n>/head (or a commit of this repository before svp-gitops)"
        type: string
        default: ""
      drill:
        description: "Build the three admission drill images drill-vulnerable, drill-unsigned and drill-no-provenance (never run)"
        type: boolean
        default: false
      promote_prd:
        description: "Open the pull request that promotes to prd envs/stg/ of svp-gitops at stg_ref (no build)"
        type: boolean
        default: false
      stg_ref:
        description: "With promote_prd: main or a full commit (40 hex) on main of svp-gitops; an older one is a rollback"
        type: string
        default: main

permissions: {}

# One group per ref and mode: the scheduled rescan and the drill also run on refs/heads/main, and sharing the build's
# group would let them replace a queued push run. A run on main is never cancelled: cancelling one half-way through
# signing would leave a pushed digest without its signature. Runs on main follow each other, so each sees the result
# of the one before when it picks its base.
concurrency:
  group: >-
    images-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.rescan) && 'rescan'
    || (inputs.drill && 'drill' || (inputs.promote_prd && 'promote-prd' || 'build')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  last-success:
    # The base of a push build: head_sha of the newest successful push run of this workflow on main. A job
    # of its own because only it reads the Actions API; it checks out nothing and runs no code of the repository. When
    # the API fails the output stays empty and the job green: plan then builds all six (too much, never too little).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      runs: ${{ steps.api.outputs.runs }}
    steps:
      - id: api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Only the fields plan reads, so the output stays small.
          runs_url="repos/$REPO/actions/workflows/images.yml/runs?branch=main&event=push&status=success&per_page=5"
          if runs=$(gh api "$runs_url" \
            --jq '{workflow_runs: [.workflow_runs[] | {head_sha, conclusion, event, head_branch}]}'); then
            echo "runs=$runs" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::The Actions API did not answer: this run builds every service."
          fi

  plan:
    # What this run does: mode (build, rescan, drill), base, images, matrix of legs (deploy/ci/plan.sh).
    # Every job after it starts its if: with a status function (!cancelled() && needs.plan.result == 'success'): an if:
    # without one gets an implicit success(), which is false when any job up the needs chain was skipped, and
    # last-success is skipped on every event but push. Skipped in a dispatch with promote_prd, and with it every job
    # that needs it: that run only promotes to prd (job promote-prd).
    needs: last-success
    if: ${{ !cancelled() && !inputs.promote_prd }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      images: ${{ steps.plan.outputs.images }}
      legs: ${{ steps.plan.outputs.legs }}
      has_images: ${{ steps.plan.outputs.has_images }}
      base: ${{ steps.plan.outputs.base }}
      promote_charts: ${{ steps.plan.outputs.promote_charts }}
      values_ref: ${{ steps.plan.outputs.values_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the base can be any earlier commit.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_DRILL: ${{ inputs.drill }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
          LAST_SUCCESS_JSON: ${{ needs.last-success.outputs.runs }}
        run: deploy/ci/plan.sh

  build-nopush:
    # Pull requests and refs other than main: build, scan and gate exactly like main, push nothing.
    # Findings go to the job summary only (no Security tab upload from a pull request).
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &day
        id: day
        run: echo "day=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      # The trivy DB, one cache entry per day (trivy's advice against download limits); trivy still downloads a newer
      # DB when the cached one is stale. A pull request's cache stays in its own ref and never replaces main's.
      - &trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      # The grype DB, the same way: one entry per day (about 200 MB to download, 3 GB unpacked, about 480 MB as a cache
      # entry). With main's entry and one per pull request ref that is about 0.5 to 1 GB a day of the repository's
      # 10 GB cache quota, so the other caches are evicted sooner. grype checks for a newer DB on every scan that has
      # not checked in the last two hours, and refuses one built more than five days ago.
      - &grype-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-cache
          key: grype-db-${{ steps.day.outputs.day }}
          restore-keys: grype-db-
      - &build-scan-gate
        name: Build, scan and gate
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
          SVP_GRYPE_CACHE: ${{ runner.temp }}/grype-cache
        run: deploy/ci/build-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"

  build:
    # main: the same steps 1-3, then push exactly the scanned image (step 4: by config digest) and hand the leg to the
    # jobs after it as an artifact (step 5). The gate step has no always() and no continue-on-error: a blocked image
    # stops the leg before the push. The cache is the only shared state, and no job holding id-token uses it.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: &release-leg
      - *checkout
      - *day
      - *trivy-cache
      - *grype-cache
      - *build-scan-gate
      - name: Push the scanned image, compare its config digest
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/push-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"
      - name: Hand the leg over (manifest digest, scan report, SBOM, scan times)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/leg/platform
            ${{ runner.temp }}/leg/repository
            ${{ runner.temp }}/leg/digest
            ${{ runner.temp }}/leg/config-digest
            ${{ runner.temp }}/leg/trivy.json
            ${{ runner.temp }}/leg/sbom.spdx.json
            ${{ runner.temp }}/leg/scan-started
            ${{ runner.temp }}/leg/scan-finished
            ${{ runner.temp }}/leg/db-updated-at
          if-no-files-found: error
          retention-days: 7
      - name: Keep the SARIF for the Security tab, blocked or not
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/leg/trivy.sarif
            ${{ runner.temp }}/leg/grype.sarif
          if-no-files-found: ignore
          retention-days: 7

  merge:
    # One index per image from its two scanned manifests. Runs per image even when another image failed;
    # an image with a failed leg has no two artifacts and fails here: no index, no signature, no release.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &merge
      - *checkout
      - &download-legs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: leg-${{ matrix.image }}-*
          path: ${{ runner.temp }}/legs
      - name: Join the two manifests into one index
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" ] || [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" ]; then
            echo "::error::$IMAGE: a leg did not pass (see the build job); no index, no signature, no release"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/merge-index.sh "$IMAGE" "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" \
            "$RUNNER_TEMP/index"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  sign:
    # Keyless signature on the index digest, SBOM attestation on each manifest and vuln attestation (both scans) on the
    # index, Sigstore bundles written by deploy/ci/sign-image.sh; then the build provenance (SLSA v1, built by
    # actions/attest from the claims of this run's OIDC token) on the index, after the signature and the vuln
    # attestation. The only build-path job with id-token: write, and the only one with attestations: write (the
    # provenance also goes to the repository's attestations); it uses no cache. Its artifact release-<image>
    # (repository, tag, digest of the signed index) is what promotion to envs/stg/images/ of svp-gitops reads.
    needs: [plan, merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &sign
      - *checkout
      - *download-legs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index
      - &cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and attest
        id: sign
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Only the drill image may carry CRITICAL into its attestation; sign-image.sh refuses the flag for any other.
          [ "$IMAGE" != drill-vulnerable ] || flags=(--allow-critical)
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/sign-image.sh "${flags[@]}" "$RUNNER_TEMP/index" \
            "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" "$RUNNER_TEMP/legs/leg-$IMAGE-arm64"
      # Releases only: sign-image.sh says false for a drill image, and for a digest that has its provenance already
      # (a run started again), as bundles have no --replace. Pushed with the docker login of the step above.
      - name: Attest the build provenance
        if: ${{ steps.sign.outputs.provenance == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.sign.outputs.repository }}
          subject-digest: ${{ steps.sign.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for repositories owned by an organization; this one belongs to a user.
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  promote:
    # Promotes to stg in svp-gitops: rebuilds its branch bot/promote-stg as one commit of the app's bot on top of main
    # there, with the image block of envs/stg/images/<service>.yaml for every image signed in this run and
    # envs/stg/charts.yaml at this commit, opens or updates its pull request and turns on auto-merge; svp-gitops merges
    # it once its check gitops-ok is green, with no review (no code owner owns envs/stg/). Runs when signing an image
    # failed too: every image signed in this run is promoted, the failed one is red in sign. Runs with no image too when
    # the charts changed (plan's promote_charts): only charts.yaml moves. Runs of main follow each other (the
    # concurrency group of builds never cancels), so a later run never promotes before an earlier one; the guard
    # promote_not_behind of deploy/ci/common.sh refuses a run of a commit older than the charts stg runs (a run started
    # again, a dispatch of an old commit). The token is the app's, for svp-gitops alone; GITHUB_TOKEN only reads this
    # repository. No id-token, no packages.
    needs: [plan, sign]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build'
      && (needs.plan.outputs.has_images == 'true' || needs.plan.outputs.promote_charts == 'true')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the guard compares this commit with stg's revision by ancestry.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases
      - id: app
        # Revoked when the job ends. The permissions here narrow the token below the app's own.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_GITOPS_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-stg in svp-gitops, open or update its pull request, turn on auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          . deploy/ci/common.sh
          code=$PWD repo=anhnvcoder/svp-gitops branch=bot/promote-stg app=svp-gitops-promoter
          # Cloned anonymously: the token reaches only gh and, through gh's credential helper, the push.
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$repo.git" "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          git checkout --quiet -B "$branch" origin/main
          # The releases of the open pull request not merged yet stay in: the files it changes, as it has them.
          if [ -n "$lease" ] && [ -n "$pr" ]; then
            git diff --name-only --diff-filter=AM "$(git merge-base origin/main "$lease")" "$lease" -- envs/stg/ |
              xargs -r git checkout "$lease" --
          fi
          promote_not_behind "$RUN_COMMIT" "$(git show origin/main:envs/stg/charts.yaml | yq_ .revision)"
          promote_not_behind "$RUN_COMMIT" "$(yq_ .revision envs/stg/charts.yaml)"
          # Each list on fd 3: yq_ hands its stdin to docker.
          seen=" "
          while IFS= read -r f <&3; do
            dir=$(dirname "$f") R=$(cat "$dir/repository") T=$(cat "$dir/tag") D=$(cat "$dir/digest")
            svc=${R#"$ghcr_prefix/"}
            if [[ " ${built_services[*]} " != *" $svc "* || $R != "$ghcr_prefix/$svc" || $T != "${RUN_COMMIT:0:12}" ||
              $seen == *" $svc "* ]] || ! is_digest "$D"; then
              fail "$dir is no release of a service of this repository at this commit, or a second one ($R:$T@$D)"
            fi
            yq_ R="$R" T="$T" D="$D" -i \
              '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "envs/stg/images/$svc.yaml"
            seen+="$svc "
          done 3< <(find "$RUNNER_TEMP/releases" -type f -name digest 2>/dev/null | sort)
          # The two values derived from the charts' commit, as the check of svp-gitops computes them again.
          psv=$(yq_ -e .podSecurityVersion <"$code/deploy/helm/svp-cluster/values.yaml")
          sum=$(sha256sum "$code/deploy/observability/otelcol/k8s-config.yaml" | cut -d' ' -f1)
          yq_ REV="$RUN_COMMIT" PSV="$psv" SUM="$sum" -i \
            '.revision = strenv(REV) | .podSecurityVersion = strenv(PSV) | .collectorConfigSha256 = strenv(SUM)' \
            envs/stg/charts.yaml
          if git diff --quiet origin/main; then
            echo "Nothing differs from main of svp-gitops: no push, no pull request."
            exit 0
          fi
          # Every release the branch holds, this run's and those its open pull request already had.
          names='' list='' rows='' count=0
          while IFS= read -r f <&3; do
            svc=$(basename "$f" .yaml)
            line=$(yq_ '.image | [.repository, .tag, .digest] | join("|")' "$f")
            IFS='|' read -r R T D <<<"$line"
            names+="${names:+, }$svc" count=$((count + 1))
            list+="- $svc: $R:$T@$D"$'\n'
            rows+="$(promote_image_row "$svc" "$R" "$T" "$D")"$'\n'
          done 3< <(git diff --name-only origin/main -- envs/stg/images/)
          code_url=https://github.com/$GITHUB_REPOSITORY/commit/$RUN_COMMIT
          charts=false
          if ! git diff --quiet origin/main -- envs/stg/charts.yaml; then
            charts=true
            list+="- charts: $RUN_COMMIT"$'\n'
            rows+="| \`charts.yaml\` | [\`${RUN_COMMIT:0:12}\`]($code_url) | — |"$'\n'
          fi
          commit_link="[\`${RUN_COMMIT:0:12}\`]($code_url)"
          if [ "$count" -eq 0 ]; then
            title="chore(stg): cập nhật chart ở ${RUN_COMMIT:0:12}"
            summary="Chuyển chart của stg sang commit $commit_link."
            why="Commit $commit_link vào \`main\` của \`$GITHUB_REPOSITORY\` đổi chart, nên stg cần chạy chart của commit đó."
            ran="[Lượt CI]($RUN_URL) chạy trên commit đó."
          else
            if [ "$count" -le 3 ]; then
              title="chore(stg): phát hành $names ở ${RUN_COMMIT:0:12}"
            else
              title="chore(stg): phát hành $count service ở ${RUN_COMMIT:0:12}"
            fi
            summary="Đưa $count service lên stg bằng image mới"
            [ "$charts" = false ] || summary+=" và chuyển chart sang commit $commit_link"
            summary+="."
            why="Các commit vào \`main\` của \`$GITHUB_REPOSITORY\` ghi trong bảng đã build và ký image mới, nên stg cần chạy bản đó.
          Mỗi dòng của bảng ghi commit của chính nó: PR giữ cả bản của lượt trước chưa merge.
          Bảng chỉ hiện 12 ký tự đầu của digest; digest đầy đủ nằm trong commit của PR."
            ran="Mỗi image trong bảng do lượt CI của commit ở dòng đó build và ký; [lượt CI]($RUN_URL) của $commit_link dựng PR này."
          fi
          msg="${list}
          Code: $code_url
          Run: $RUN_URL"
          body="## Thay đổi gì

          $summary

          | Service | Commit | Image |
          | --- | --- | --- |
          ${rows}
          ## Vì sao

          $why

          ## Đã kiểm gì

          - $ran
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này. Với mỗi file image đổi, nó kiểm image ghim digest, có chữ ký,
            kết quả quét lỗ hổng còn hạn và provenance khớp commit; nó cũng kiểm chart render được.
          - PR tự merge (squash) khi \`gitops-ok\` xanh. \`envs/stg/\` không có Code Owner nên không cần ai duyệt.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của \`envs/stg/images/<service>.yaml\` và ba giá trị \`revision\`, \`podSecurityVersion\`,
          \`collectorConfigSha256\` của \`envs/stg/charts.yaml\`. Mỗi lượt build dựng lại nhánh \`$branch\` từ \`main\` và giữ các bản chưa merge của PR này."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          # The lease is the branch as cloned (empty: it must not exist): a change since fails the push, never lost.
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          # Read again after the push. The pull request read before, merged or closed meanwhile, no longer holds the
          # branch, and a new one would carry again what was merged or what its owner dropped.
          now=$(promote_open_pr "$repo" "$branch" "$app")
          [ -z "$pr" ] || [ "$now" = "$pr" ] ||
            fail "pull request #$pr of $branch was merged or closed during this run: run the job again (from main as is)"
          if [ -n "$now" ]; then
            gh pr edit "$now" --repo "$repo" --title "$title" --body "$body"
          else
            now=$(gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body")
            now=${now##*/}
          fi
          gh pr merge "$now" --repo "$repo" --auto --squash --match-head-commit "$(git rev-parse HEAD)"

  promote-prd:
    # Promotes to prd in svp-gitops what envs/stg/ held at a commit of its main (input stg_ref, main when empty; an
    # older commit is a rollback): the image block of the seven envs/stg/images/*.yaml and the three values of
    # envs/stg/charts.yaml go into the same files of envs/prd/, every other line of them (the comments) kept, on branch
    # bot/promote-prd, one commit of the app's bot on top of main there, and its pull request is opened or updated. No
    # auto-merge: a code owner approves it. Two stops on the way to prd: environment promote-prd waits for its
    # required reviewer before the job starts (no admin bypass), so no key and no token exist until someone approves
    # the run, and the pull request waits for its code owner. The guard promote_stg_ref of deploy/ci/common.sh takes
    # main or a full commit on main of svp-gitops only. Runs alone: plan skips every other job of a dispatch with
    # promote_prd, and this job refuses one that also asks to build, rescan or drill, so one run does one thing.
    # The token is the app's, for svp-gitops alone, from the second key of the app that only promote-prd holds;
    # GITHUB_TOKEN only reads this repository. No id-token, no packages.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.promote_prd && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote-prd
    permissions:
      contents: read
    steps:
      - name: A run of its own
        env:
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_DRILL: ${{ inputs.drill }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
        run: |
          if [ -n "$INPUT_SERVICES$INPUT_VALUES_REF" ] || [ "$INPUT_RESCAN" = true ] || [ "$INPUT_DRILL" = true ]; then
            echo "::error::promote_prd is a run of its own: dispatch it without services, rescan, values_ref or drill"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        # Revoked when the job ends; narrower than the app's own permissions.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_GITOPS_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-contents: write
          permission-pull-requests: write
      - name: Rebuild bot/promote-prd in svp-gitops from envs/stg/ at stg_ref, open or update its pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STG_REF: ${{ inputs.stg_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          . deploy/ci/common.sh
          repo=anhnvcoder/svp-gitops branch=bot/promote-prd app=svp-gitops-promoter
          git -c credential.helper= clone --quiet --no-tags "https://github.com/$repo.git" "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          ref=$(promote_stg_ref "${STG_REF:-main}" .)
          lease=$(git rev-parse --verify --quiet "refs/remotes/origin/$branch") || lease=
          git checkout --quiet -B "$branch" origin/main
          # Read into a variable, not through a pipe into read: a file missing at stg_ref fails the step.
          list='' rows=''
          for svc in "${svp_services[@]}"; do
            line=$(git show "$ref:envs/stg/images/$svc.yaml" | yq_ '.image | [.repository, .tag, .digest] | join("|")')
            IFS='|' read -r R T D <<<"$line"
            yq_ R="$R" T="$T" D="$D" -i \
              '.image.repository = strenv(R) | .image.tag = strenv(T) | .image.digest = strenv(D)' "envs/prd/images/$svc.yaml"
            list+="- $svc: $R:$T@$D"$'\n'
            rows+="$(promote_image_row "$svc" "$R" "$T" "$D")"$'\n'
          done
          line=$(git show "$ref:envs/stg/charts.yaml" |
            yq_ '[.revision, .podSecurityVersion, .collectorConfigSha256] | join("|")')
          IFS='|' read -r REV PSV SUM <<<"$line"
          yq_ REV="$REV" PSV="$PSV" SUM="$SUM" -i \
            '.revision = strenv(REV) | .podSecurityVersion = strenv(PSV) | .collectorConfigSha256 = strenv(SUM)' \
            envs/prd/charts.yaml
          list+="- charts: $REV"$'\n'
          rows+="| \`charts.yaml\` | [\`${REV:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$REV) | — |"$'\n'
          if git diff --quiet origin/main; then
            echo "prd on main of svp-gitops already runs envs/stg/ of ${ref:0:12}: no push, no pull request."
            exit 0
          fi
          title="chore(prd): phát hành bộ stg của svp-gitops ${ref:0:12}"
          msg="${list}
          Stg-ref: $ref
          Run: $RUN_URL"
          body="## Thay đổi gì

          Đưa prd lên đúng bộ mà stg chạy ở commit [\`${ref:0:12}\`](https://github.com/$repo/commit/$ref) của \`svp-gitops\`: image của ${#svp_services[@]} service và chart.

          | Service | Commit | Image |
          | --- | --- | --- |
          ${rows}
          Digest đầy đủ nằm trong commit của PR.

          ## Vì sao

          stg đã chạy bộ này và qua \`gitops-ok\`; prd chép nguyên bộ đó, không build lại. Bộ lấy từ \`envs/stg/\` ở commit trên theo
          \`stg_ref\` của [lượt promote]($RUN_URL). Nếu \`stg_ref\` trỏ một commit cũ, PR này đưa prd về bản cũ (rollback).

          ## Đã kiểm gì

          - [Lượt promote]($RUN_URL) đọc \`envs/stg/\` ở commit trên và chép vào \`envs/prd/\`.
          - Check \`gitops-ok\` của \`svp-gitops\` chạy trên PR này, kiểm như PR của stg: image ghim digest, chữ ký, kết quả quét lỗ hổng
            và provenance, chart render được.
          - **Cần Code Owner duyệt.** PR không tự merge: \`envs/prd/\` có Code Owner, duyệt của họ là cổng vào prd.
          - Nếu \`gitops-ok\` đỏ vì kết quả quét lỗ hổng (\`vuln\`) quá hạn (bộ cũ, rollback), quét lại bằng
            \`gh workflow run images.yml --repo $GITHUB_REPOSITORY --ref main -f rescan=true -f values_ref=$ref\` rồi chạy lại check.

          ## Phạm vi

          Bot \`$app\` chỉ sửa khối \`image\` của ${#svp_services[@]} file \`envs/prd/images/*.yaml\` và ba giá trị \`revision\`, \`podSecurityVersion\`,
          \`collectorConfigSha256\` của \`envs/prd/charts.yaml\`. Các dòng khác của file, kể cả chú thích, giữ nguyên."
          id=$(gh api "users/${app}%5Bbot%5D" --jq .id)
          git -c user.name="${app}[bot]" -c user.email="$id+${app}[bot]@users.noreply.github.com" \
            commit --quiet -am "$title" -m "$msg"
          gh auth setup-git
          git push --quiet --force-with-lease="refs/heads/$branch:$lease" origin "HEAD:refs/heads/$branch"
          pr=$(promote_open_pr "$repo" "$branch" "$app")
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$repo" --title "$title" --body "$body"
          else
            gh pr create --repo "$repo" --base main --head "$branch" --title "$title" --body "$body"
          fi

  contract:
    # Publishes info.version of services/gateway/openapi.yaml as an OCI artifact (deploy/ci/contract.sh publish):
    # ghcr.io/anhnvcoder/svp-backend/api/gateway:<version>, signed keyless by this workflow on main, the
    # identity every verifier of the contract checks. Runs on every build run of main (push, or a dispatch that neither
    # rescans, drills nor promotes to prd): a version already published with this very file is left alone (signed if
    # its signature is missing), the same version with other content fails and nothing is overwritten. Those runs share
    # the concurrency group of builds on main, which never cancels and runs them one after the other, so two runs never
    # check and push the same tag at once. A version is published at most once: GitHub replaces a run waiting in that
    # group with a newer one, so a version merged while a build of main runs and followed by another before it starts
    # is never published; the later version contains it, and publishing every missing version from the history of the
    # spec would only add releases no client asked for. Needs no image of this run and uses no cache: the job holds
    # id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'build'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - *checkout
      - *cosign
      - name: Publish and sign the API contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/contract.sh publish

  rescan:
    # Daily (and on dispatch rescan=true): every released digest svp-gitops names (envs/*/images/ at its main, at the
    # open promote pull request bot/promote-stg, and at the dispatch input values_ref) is scanned again, manifest by
    # manifest, and its vuln attestation replaced with the real result (in the format the digest is signed in; for a
    # Sigstore bundle the older vuln bundles are taken off with packages: write); a CRITICAL is recorded first, then
    # fails the job, which mails the owner; a secret fails the job before anything is attested (deploy/ci/rescan.sh). svp-gitops
    # is cloned anonymously and its files read as data, never run; GITHUB_TOKEN only asks whether its promote pull
    # request is open (a read of a public repository). No cache: the job holds id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'rescan'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.gitops/svp-gitops
    steps:
      - *checkout
      - *cosign
      - run: make gitops-clone
      - name: Rescan and attest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VALUES_REF: ${{ needs.plan.outputs.values_ref }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/rescan.sh run "$RUNNER_TEMP/rescan" "$SVP_GITOPS_DIR" "$VALUES_REF"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-rescan
          path: ${{ runner.temp }}/rescan/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  # Admission drill images: drill-vulnerable (an old base with CRITICAL on both architectures, signed
  # and attested like a release), drill-unsigned (a clean build pushed with no signature) and drill-no-provenance (the
  # same clean build, signed and attested vuln like a release, with no build provenance). They exist only so the
  # cluster can be shown refusing them; no chart points to them and they never run. They go through the very same
  # steps as a release (YAML aliases of the build and merge jobs), so CRITICAL, the signature and the provenance are
  # the only differences; only drill-vulnerable gets past the CRITICAL gate, and the secret gate holds for all three.
  # No image file of svp-gitops names them, so the daily rescan never attests them again: a drill reads them within
  # the policy's maximum age after this dispatch.
  drill-build:
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: *release-leg

  drill-merge:
    needs: [plan, drill-build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: *merge

  drill-sign:
    # drill-vulnerable and drill-no-provenance: drill-unsigned stays unsigned on purpose. No build provenance for either
    # (sign-image.sh hands provenance=false for a drill image, so the step of actions/attest is skipped, and this job
    # has no attestations: write): a drill image is no release, and drill-no-provenance exists to lack it.
    needs: [plan, drill-merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [drill-vulnerable, drill-no-provenance]
    steps: *sign

  sarif:
    # Uploads the SARIF of main's builds and rescans to the Security tab, one category per tool, image and architecture.
    # One upload per tool: upload-sarif merges every file it is given into a single SARIF log, and GitHub rejects a log
    # with more than 20 runs. Each leg writes one trivy and one grype run, so all six images (12 legs) would make 24
    # runs in one log; per tool it is at most 14 (a rescan writes trivy runs only and never shares a run with a build).
    # The only job with security-events: write; it runs no code of the repository. A report, not a check: not in
    # images-ok (a failed upload still turns the run red).
    needs: [plan, build, rescan]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.plan.outputs.mode == 'rescan'
      || (needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif
      - id: split
        # Sorts the files into one directory per tool and counts the runs with the runner's jq, so that a log over the
        # limit stops here with its count instead of GitHub's rejection. A tool over the limit is not uploaded; the
        # other one still is.
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-trivy" "$RUNNER_TEMP/sarif-grype"
          while IFS= read -r -d '' f; do
            # download-artifact unpacks a lone artifact straight into the path, with no folder of its name: a
            # rescan uploads only sarif-rescan, so its files land directly in sarif/ and are trivy's.
            case "$f" in
              */grype.sarif) tool=grype ;;
              */trivy.sarif | */sarif-rescan/*.sarif | "$RUNNER_TEMP"/sarif/*-*.sarif) tool=trivy ;;
              *)
                echo "::error::Unexpected SARIF file ${f#"$RUNNER_TEMP"/}"
                exit 1
                ;;
            esac
            dir=${f%/*}
            cp "$f" "$RUNNER_TEMP/sarif-$tool/${dir##*/}-${f##*/}"
          done < <(find "$RUNNER_TEMP/sarif" -name '*.sarif' -print0 2>/dev/null)
          over=0
          for tool in trivy grype; do
            files=("$RUNNER_TEMP/sarif-$tool"/*.sarif)
            if [ ! -e "${files[0]}" ]; then
              echo "No $tool SARIF to upload (no leg reached its scan)."
              continue
            fi
            runs=$(jq -s 'map(.runs | length) | add' "${files[@]}")
            if [ "$runs" -gt 20 ]; then
              echo "::error::$runs $tool SARIF runs in ${#files[@]} files: GitHub rejects an upload with more than 20 runs"
              over=1
              continue
            fi
            echo "$tool: $runs SARIF runs in ${#files[@]} files"
            echo "$tool=true" >>"$GITHUB_OUTPUT"
          done
          exit "$over"
      - name: Upload the trivy SARIF
        if: ${{ !cancelled() && steps.split.outputs.trivy == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif-trivy
      - name: Upload the grype SARIF
        if: ${{ !cancelled() && steps.split.outputs.grype == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif-grype

  images-ok:
    # The required check of this workflow. Green only when every job succeeded or was skipped for a reason this job
    # recomputes from the event, the ref and plan's outputs: a skip from a wrong if: is red, and so are
    # failure and cancelled. Never skipped itself (GitHub counts a skipped required check as passed). Needs no
    # permission and runs no code of the repository.
    needs:
      - last-success
      - plan
      - build-nopush
      - build
      - merge
      - sign
      - promote
      - promote-prd
      - contract
      - rescan
      - drill-build
      - drill-merge
      - drill-sign
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ needs.plan.outputs.mode }}
          HAS_IMAGES: ${{ needs.plan.outputs.has_images }}
          PROMOTE_CHARTS: ${{ needs.plan.outputs.promote_charts }}
          PROMOTE_PRD: ${{ inputs.promote_prd }}
        run: |
          main=false
          [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && main=true
          # skip_ok JOB: true when this run is one in which JOB does not run.
          skip_ok() {
            case $1 in
            last-success) [ "$EVENT" != push ] ;;
            plan) [ "$EVENT" = workflow_dispatch ] && [ "$PROMOTE_PRD" = true ] ;;
            build-nopush) [ "$main" = true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            build | merge | sign) [ "$main" != true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            promote)
              [ "$main" != true ] || [ "$MODE" != build ] || { [ "$HAS_IMAGES" != true ] && [ "$PROMOTE_CHARTS" != true ]; }
              ;;
            promote-prd) [ "$main" != true ] || [ "$EVENT" != workflow_dispatch ] || [ "$PROMOTE_PRD" != true ] ;;
            contract) [ "$main" != true ] || [ "$MODE" != build ] ;;
            rescan) [ "$MODE" != rescan ] ;;
            drill-build | drill-merge | drill-sign) [ "$MODE" != drill ] ;;
            *) false ;;
            esac
          }
          red=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case $result in
            success) echo "ok    $job" ;;
            skipped)
              if skip_ok "$job"; then
                echo "ok    $job skipped: not part of this run"
              else
                echo "::error::$job was skipped, but this run needed it"
                red=1
              fi
              ;;
            *)
              echo "::error::$job: $result"
              red=1
              ;;
            esac
          done
          exit "$red"
