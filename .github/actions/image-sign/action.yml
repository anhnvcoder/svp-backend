# Signs and attests an image index keyless; used by images.yml of backend and svp-frontend.
# image-guard.sh verifies caller workflow identity, index manifests and bundle idempotence before signing.
# Signs index, attests per-platform SBOMs, vuln predicate and SLSA provenance as Sigstore bundles.
# Runs only on main with id-token: write and attestations: write; uses no cache.
# Inputs reach steps via env:, never ${{ }} inside run:.
# Design notes: docs/ci-cd.md.
name: image-sign
description: "Sign the index of an image and attest its SBOMs, scan result and build provenance, once each"

inputs:
  image:
    description: "A service or drill image of the release source of this run's repository"
    required: true
  code-root:
    description: "The checkout whose code is built (another repository's); empty: this repository's checkout"
    required: false
    default: ""
  out:
    description: "Working folder: legs and index are downloaded to <out>/legs and <out>/index, the predicate written there"
    required: true

outputs:
  repository:
    description: "Repository of the signed index"
    value: ${{ steps.guard.outputs.repository }}
  digest:
    description: "Digest of the signed index"
    value: ${{ steps.guard.outputs.digest }}
  provenance:
    description: "true when the build provenance was attested in this run"
    value: ${{ steps.guard.outputs.provenance }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: leg-${{ inputs.image }}-*
        path: ${{ inputs.out }}/legs
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: index-${{ inputs.image }}
        path: ${{ inputs.out }}/index

    - name: Log in to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        unset DOCKER_DEFAULT_PLATFORM
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: Check the index, build the vuln predicate, list the bundles there
      id: guard
      shell: bash
      env:
        GUARD: ${{ github.action_path }}/../../../deploy/ci/image-guard.sh
        IMAGE: ${{ inputs.image }}
        OUT: ${{ inputs.out }}
        SVP_CODE_ROOT: ${{ inputs.code-root }}
      run: '"$GUARD" sign "$IMAGE" "$OUT"'

    - name: Sign and attest
      id: sign
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OUT: ${{ steps.guard.outputs.out }}
        COSIGN_IMAGE: ${{ steps.guard.outputs.cosign-image }}
        REPOSITORY: ${{ steps.guard.outputs.repository }}
        DIGEST: ${{ steps.guard.outputs.digest }}
        AMD64: ${{ steps.guard.outputs.amd64 }}
        ARM64: ${{ steps.guard.outputs.arm64 }}
        PREDICATE: ${{ steps.guard.outputs.predicate }}
        SIGN: ${{ steps.guard.outputs.sign }}
        SBOM_AMD64: ${{ steps.guard.outputs.sbom-amd64 }}
        SBOM_ARM64: ${{ steps.guard.outputs.sbom-arm64 }}
        VULN: ${{ steps.guard.outputs.vuln }}
      run: |
        unset DOCKER_DEFAULT_PLATFORM
        config=${DOCKER_CONFIG:-$HOME/.docker}/config.json
        # cosign ARGS...: the pinned cosign; OUT (absolute) has the same path inside, so the predicates keep theirs.
        cosign() {
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:mode=1777 -e HOME=/tmp \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "$config:/auth/config.json:ro" -e DOCKER_CONFIG=/auth -v "$OUT:$OUT:ro" "$COSIGN_IMAGE" "$@"
        }
        bundle=(--yes --new-bundle-format=true)
        [ "$SIGN" != true ] || cosign sign "${bundle[@]}" "$REPOSITORY@$DIGEST"
        [ "$SBOM_AMD64" != true ] || cosign attest "${bundle[@]}" --type spdxjson \
          --predicate "$OUT/legs/leg-$IMAGE-amd64/sbom.spdx.json" "$REPOSITORY@$AMD64"
        [ "$SBOM_ARM64" != true ] || cosign attest "${bundle[@]}" --type spdxjson \
          --predicate "$OUT/legs/leg-$IMAGE-arm64/sbom.spdx.json" "$REPOSITORY@$ARM64"
        [ "$VULN" != true ] || cosign attest "${bundle[@]}" --type vuln --predicate "$PREDICATE" "$REPOSITORY@$DIGEST"
        echo "ok    $REPOSITORY@$DIGEST signed; SBOM on both manifests, vuln on the index"

    # Releases only, after the signature and the vuln attestation; pushed with the docker login above.
    - name: Attest the build provenance
      if: ${{ steps.guard.outputs.provenance == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.guard.outputs.repository }}
        subject-digest: ${{ steps.guard.outputs.digest }}
        push-to-registry: true
        # Storage records exist only for repositories owned by an organization; these belong to a user.
        create-storage-record: false

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-${{ inputs.image }}
        path: |
          ${{ inputs.out }}/index/repository
          ${{ inputs.out }}/index/tag
          ${{ inputs.out }}/index/digest
        if-no-files-found: error
        retention-days: 7
