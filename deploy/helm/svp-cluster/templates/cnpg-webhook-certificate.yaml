{{- /* TLS certificate of the CloudNativePG operator's webhook, issued by cert-manager instead of the operator: left to
itself it makes a CA of its own and writes it into its webhook configurations, which takes patch on every
webhook configuration of the cluster. It signs a new certificate when the DNS names differ from the one below or
it expires within 7 days: hence that one name and cert-manager's default renewal. */}}
{{- if .Values.cloudnativePG.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cnpg-selfsigned
  namespace: cnpg-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-webhook
  namespace: cnpg-system
spec:
  # The Secret the chart mounts at /run/secrets/cnpg.io/webhook, keys tls.crt and tls.key as the operator reads them.
  secretName: cnpg-webhook-cert
  dnsNames:
    - cnpg-webhook-service.cnpg-system.svc
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: cnpg-selfsigned
{{- end }}
