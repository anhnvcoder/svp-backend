# Example values of an EKS cluster whose Postgres is Amazon RDS, objects Amazon S3, Kafka Amazon MSK and Valkey Amazon
# ElastiCache, to render and check the external modes (helm template -f this file). Placeholders only: the real hosts
# and CIDRs come from the cluster's Terraform outputs, never from git, and .example never resolves.
postgres:
  mode: external
  external:
    host: svp-stg-pg.rds.example
    cidrs: [10.0.48.0/24, 10.0.49.0/24]
s3:
  mode: external
kafka:
  mode: external
  brokers: b-1.svp-stg.kafka.example:9096,b-2.svp-stg.kafka.example:9096
  external:
    cidrs: [10.0.48.0/24, 10.0.49.0/24]
valkey:
  mode: external
  host: master.svp-stg.cache.example
  external:
    cidrs: [10.0.48.0/24, 10.0.49.0/24]
