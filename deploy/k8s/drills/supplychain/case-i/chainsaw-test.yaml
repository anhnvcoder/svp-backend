# Supply chain drill, case i: an UPDATE of a running pod of svp that sets a container's image to an unsigned one, as a
# server-side dry run of a strategic patch: refused. "Unsigned" is the unsigned image of case b (refused by the
# signature rule), or the dev image of the local registry when there is none (refused by the prefix rule). A script
# step: Chainsaw's patch sends a JSON merge patch, which would replace the pod's whole list of containers, and the API
# server would refuse that before Kyverno is asked.
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-i
  labels:
    drill: supplychain
spec:
  description: (i) an UPDATE that sets a running pod's image to an unsigned one is refused
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: i-setup
    description: (i) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: i
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: i-update-unsigned
    description: (i) a running pod of svp with its first container's image set to the unsigned image, refused
    try:
    - continueOnError: true
      script:
        shell: bash
        timeout: 4m
        env: *env
        content: |
          . ../lib.sh
          target_pod
          bad_image
          timed kc -n svp patch pod "$target" --type=strategic --dry-run=server \
            -p "{\"spec\":{\"containers\":[{\"name\":\"$target_container\",\"image\":\"$bad\"}]}}"
          refused "$bad_rule" "pod svp/$target with container $target_container set to $bad (UPDATE)"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (i) ')): true
