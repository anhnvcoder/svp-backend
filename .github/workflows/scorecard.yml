# OpenSSF Scorecard on every push to main, weekly and when a classic branch protection rule changes; results go to the
# public Scorecard API and to code scanning. No pull_request trigger: this is no check of a pull request.
# Branch-Protection reads the rulesets with GITHUB_TOKEN, so no repo_token.
# Every action is pinned to a full commit SHA; checkout never leaves the token in .git/config.

# Publishing binds this file to the Scorecard API's Workflow Restrictions: no env or defaults at workflow or job level,
# no write permission at workflow level, id-token: write in this job alone, no container or service, one GitHub-hosted
# Ubuntu runner label (22.04 or later), only the allowed actions as uses: steps (no run:).
# Design notes: docs/ci-cd.md.
name: scorecard

on:
  push:
    branches: [main]
  # Off the hour (busy for GitHub's scheduler); GitHub runs a schedule on main only.
  schedule:
    - cron: "23 2 * * 0"
  # Classic branch protection rules only: the repository uses rulesets, which do not fire it.
  branch_protection_rule:

permissions: {}

# One run at a time: the results of the newest commit are the ones kept.
concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Code scanning upload.
      security-events: write
      # OIDC token that proves to the Scorecard API which workflow produced the results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
