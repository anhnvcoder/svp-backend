{{- /* Default-deny in both directions for every pod of the project's namespaces: a pod reaches and is reached by
nothing until a policy of its own chart opens that one flow, so a compromised pod cannot scan the cluster or
call out to the internet. Platform namespaces are not denied by default (their charts ship no policies, they
hold no project data), except kyverno, reloader and, with externalSecrets on, external-secrets. */}}
{{- $kyverno := dict "name" .Values.kyverno.namespace "kubeAPI" true }}
{{- $reloader := dict "name" .Values.reloader.namespace "kubeAPI" true }}
{{- $es := .Values.externalSecrets }}
{{- $esNamespaces := list }}
{{- if $es.enabled }}
{{- $esNamespaces = append $esNamespaces (dict "name" $es.controller.namespace "kubeAPI" true) }}
{{- if eq $es.store "kubernetes" }}
{{- $esNamespaces = append $esNamespaces (dict "name" $es.sourceNamespace "kubeAPI" false) }}
{{- end }}
{{- end }}
{{- range concat .Values.namespaces (list $kyverno $reloader) $esNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Name resolution for every pod: without it a pod could not even find the Services its own policies open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .kubeAPI }}
---
# The API server for the pods that need it (operator instances, sidecars holding leases, Prometheus discovery), opted in
# with the label svp-kube-api=allow. Pods call Service kubernetes (10.43.0.1:443), which kube-proxy rewrites to the
# server node's 6443 before the policy filter sees the packet, so both the address before and after that rewrite are
# allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api
  namespace: {{ .name }}
spec:
  podSelector:
    matchLabels:
      svp-kube-api: allow
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $.Values.nodeSubnet }}
      ports:
        - protocol: TCP
          port: {{ $.Values.kubeAPIPort }}
    - to:
        - ipBlock:
            cidr: {{ $.Values.kubeAPIServiceIP }}/32
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
{{- /* Kyverno's admission controller. In: the API server's webhook calls, from nodeSubnet and the VXLAN addresses
(kyverno.vxlanAddresses), no pod; on EKS nodeSubnet is the VPC's CIDR, so every pod of the VPC is let in on the
webhook port too (accepted: the project's namespaces deny egress by default). Out: TCP 443 to public addresses
only, for the registries and Sigstore's TUF repository; every private range is left out (kyverno.privateRanges). */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-api-server
  namespace: {{ .Values.kyverno.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/component: admission-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.nodeSubnet }}
        {{- range .Values.kyverno.vxlanAddresses }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kyverno.webhookPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: {{ .Values.kyverno.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/component: admission-controller
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.kyverno.privateRanges | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
{{- /* The brokers of release redpanda (svp-data) with one another: RPC on 33145 (seeds, Raft, replication) and the
Admin API on 9644 (the sidecar and hooks call every broker's). Here, in wave 1, not in chart svp-data (wave 4):
the root moves to wave 4 only once Redpanda is healthy, which three brokers without this policy never are. Kafka
on 9092 stays closed between brokers. */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-peers
  namespace: svp-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
      app.kubernetes.io/instance: redpanda
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
              app.kubernetes.io/instance: redpanda
      ports:
        - protocol: TCP
          port: 33145
        - protocol: TCP
          port: 9644
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
              app.kubernetes.io/instance: redpanda
      ports:
        - protocol: TCP
          port: 33145
        - protocol: TCP
          port: 9644
{{- if and $es.enabled (eq $es.store "aws") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: {{ $es.controller.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.kyverno.privateRanges | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
---
# The store aws has no auth block: the controller takes its AWS credentials from the EKS Pod Identity Agent, on the node
# at 169.254.170.23:80 (where AWS_CONTAINER_CREDENTIALS_FULL_URI points the SDK). The policy above leaves out every
# private range, link-local included, so this one opens that single address and port, for this pod only. An IPv6 cluster
# needs [fd00:ec2::23]:80 instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-identity-agent
  namespace: {{ $es.controller.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
{{- end }}
{{- if .Values.envoy.networkPolicy.enabled }}
{{- $healthCheckPort := index .Values.envoy.service.annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-port" | default "traffic-port" }}
{{- if and (ne $healthCheckPort "traffic-port") (not .Values.envoy.networkPolicy.healthCheckCIDR) }}
{{- fail "envoy.networkPolicy.healthCheckCIDR: required when the NLB's health check has a port of its own" }}
{{- end }}
---
# The Envoy pods of Gateway svp, on a cluster whose Envoy faces the internet: once a policy selects them, nothing else
# reaches them. In: 10443 (the listeners' 443 in the pod: a port under 1024 gets 10000 added) from every address (the
# NLB keeps each client's own); the metrics port from Prometheus in svp-obs (the canary's analysis); the NLB's health
# check on a port of its own from the VPC. Out: not restricted (Envoy reaches its controller and every backend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: svp
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svp-obs
      ports:
        - protocol: TCP
          port: 19001
    {{- if ne $healthCheckPort "traffic-port" }}
    - from:
        - ipBlock:
            cidr: {{ .Values.envoy.networkPolicy.healthCheckCIDR }}
      ports:
        - protocol: TCP
          port: {{ $healthCheckPort | int }}
    {{- end }}
{{- end }}
