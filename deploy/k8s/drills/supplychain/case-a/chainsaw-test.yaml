# Supply chain drill, case a: the image a pod of svp runs, a signed release of source backend on GHCR, sent twice as a
# server-side dry run of a pod of svp: admitted both times; the second answer comes from Kyverno's verification cache,
# and the time of both is printed. With the provenance rule on, this shows a release with provenance passes it. SKIP
# while no pod of svp runs an image of GHCR (the dev path's images are unsigned dev builds).
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-a
  labels:
    drill: supplychain
spec:
  description: (a) a signed release of GHCR that a pod of svp runs is admitted, twice in a row
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: a-setup
    description: (a) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: a
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: a-signed-first
    description: (a) the signed release, a first time
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          signed=$(signed_image)
          if [ -z "$signed" ]; then
            skip "no pod of svp runs a release of GHCR (the dev path's images are unsigned dev builds)"
            exit 0
          fi
          dry_run drill-supplychain-a svp "$signed"
          admitted "$signed (first)"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (a) ') || contains($stdout, 'SKIP  (a) ')): true
  - name: a-signed-cached
    description: (a) the same release again, answered from Kyverno's verification cache
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the signed release again" || exit 0
          signed=$(signed_image)
          dry_run drill-supplychain-a svp "$signed"
          admitted "$signed (again, from Kyverno's verification cache)"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (a) ') || contains($stdout, 'not run, the case is SKIP above')): true
