# Example values of an EKS cluster (RDS, S3, Amazon Managed Service for Prometheus, three zones, Karpenter's nodes), to
# check the egress by address, the canary's signed queries, the hard zone spread and the node affinity (helm template -f
# this file, over a release's own values). Placeholders only: the real CIDRs, workspace and zone count come from the
# cluster's Terraform outputs; the S3 CIDRs here are documentation addresses.
externalPeers:
  postgres:
    - {cidr: 10.0.48.0/24, ports: [5432]}
    - {cidr: 10.0.49.0/24, ports: [5432]}
  s3:
    - {cidr: 198.51.100.0/24, ports: [443]}
    - {cidr: 203.0.113.0/24, ports: [443]}
    - {cidr: 169.254.170.23/32, ports: [80]}
canaryPrometheus:
  address: https://aps-workspaces.ap-southeast-1.amazonaws.com/workspaces/ws-00000000-0000-0000-0000-000000000000
  sigv4Region: ap-southeast-1
zoneSpread:
  whenUnsatisfiable: DoNotSchedule
  minDomains: 3
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - {key: karpenter.sh/nodepool, operator: Exists}
