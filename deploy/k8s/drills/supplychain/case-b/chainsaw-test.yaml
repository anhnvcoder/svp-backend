# Supply chain drill, case b: the unsigned image in a real Deployment of svp, not a dry run: its ReplicaSet reports
# FailedCreate with the signature rule's message, a pod of it created fails the case, and the Deployment is deleted
# again, also when a step fails. The image is value unsigned, else the newest drill-unsigned on GHCR (unsigned_image of
# ../lib.sh). SKIP when neither is there, with the command that builds them.

# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-b
  labels:
    drill: supplychain
spec:
  description: (b) a Deployment of svp with the unsigned image creates no pod, its ReplicaSet refused by the signature rule
  # Concurrent, so that Chainsaw runs it after case k, the drill's one test that is not (Chainsaw runs those first):
  # on the dev path k needs the policy in Audit, before any case puts it in Enforce. Still one test at a time:
  # execution.parallel is 1 in deploy/k8s/drills/.chainsaw.yaml.
  concurrent: true
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: b-setup
    description: (b) Chainsaw on k3d-svp, the policy ready, its webhooks noted; on the dev path the policy in Enforce for the case (enforceTmp)
    try:
    - script:
        shell: bash
        timeout: 5m
        env: &env
        - name: CASE
          value: b
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          enforce_tmp_up
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          audit_back
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: b-unsigned-deployment
    description: (b) Deployment svp/drill-supplychain-unsigned with the unsigned image, read until its ReplicaSet reports FailedCreate or a pod of it exists (90 s at most), then deleted with its ReplicaSet and pods
    try:
    - continueOnError: true
      script:
        shell: bash
        timeout: 4m
        env: *env
        content: |
          . ../lib.sh
          unsigned=$(unsigned_image)
          if [ -z "$unsigned" ]; then
            skip "SUPPLYCHAIN_UNSIGNED (value unsigned) is not set and no drill-unsigned was found on GHCR ($(tail -n 1 "$work/unsigned.err" 2>/dev/null)); build the drill images ($rebuild)"
            exit 0
          fi
          st_set deployment 1
          {
            cat <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $deploy_name
            namespace: svp
            labels:
              app.kubernetes.io/managed-by: $owner
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: $deploy_name
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: $deploy_name
                  app.kubernetes.io/managed-by: $owner
          EOF
            pod_spec "$unsigned" | sed 's/^/    /'
          } | kc apply -f - >/dev/null || fail "create deployment svp/$deploy_name"
          msg=
          pods=0
          deadline=$((SECONDS + 90))
          while [[ -z $msg && $pods == 0 ]] && ((SECONDS < deadline)); do
            sleep 3
            msg=$(kc -n svp get events --field-selector reason=FailedCreate -o json | jq -r --arg d "$deploy_name-" '
              [.items[] | select(.involvedObject.kind == "ReplicaSet" and (.involvedObject.name | startswith($d)))
               | .message] | last // empty')
            pods=$(kc -n svp get pods -l "app.kubernetes.io/name=$deploy_name" -o name | wc -l | tr -d ' ')
          done
          # Foreground: no pod of it is left behind.
          kc -n svp delete deployment "$deploy_name" --cascade=foreground --wait=true >/dev/null ||
            fail "delete deployment svp/$deploy_name"
          rm -f "$state/deployment"
          if [[ -z $msg && $pods != 0 ]]; then
            result FAIL "deployment svp/$deploy_name with $unsigned: Kyverno admitted it ($pods pod(s) created)"
          elif [[ -z $msg ]]; then
            result FAIL "deployment svp/$deploy_name with $unsigned: no FailedCreate event of its ReplicaSet within 90 s"
          else
            out=$msg rc=1 ms=
            refused "image without a keyless signature by" "deployment svp/$deploy_name with $unsigned: ReplicaSet FailedCreate"
            if [[ $pods == 0 ]]; then
              result PASS "deployment svp/$deploy_name has no pod"
            else
              result FAIL "deployment svp/$deploy_name has no pod (got $pods)"
            fi
          fi
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (b) ') || contains($stdout, 'SKIP  (b) ')): true
    finally:
    - script:
        shell: bash
        timeout: 3m
        env: *env
        content: |
          . ../lib.sh
          [ -n "$(st deployment)" ] || exit 0
          kc -n svp delete deployment "$deploy_name" --ignore-not-found --wait=true >/dev/null ||
            fail "delete deployment svp/$deploy_name: kubectl --context k3d-svp -n svp delete deployment $deploy_name"
          rm -f "$state/deployment"
          ok "(b) deployment svp/$deploy_name deleted"
