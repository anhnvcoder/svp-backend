# Supply chain drill, case k: the keyless path with another vendor's public image (CloudNativePG's operator v1.28.1 on
# GHCR, signed by its release workflow; identity from docs/src/security.md of cloudnative-pg/cloudnative-pg and the
# certificate of its signature). Two temporary policies, one with the right subject, one with a wrong one (the same
# workflow on refs/heads/main), each for pods of svp with its own drill label: the image is admitted by the first,
# refused by the second. Both are deleted and their webhooks gone before the test ends, also when a step fails. Runs
# only while svp-images is in Audit (the dev path, with enforceTmp; it is the one case that does not put the policy in
# Enforce), since Enforce refuses that image by its prefix: SKIP on a policy in Enforce.
# Helpers, inputs and the verdict lines: ../lib.sh.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supplychain-case-k
  labels:
    drill: supplychain
spec:
  description: (k) a vendor's image is admitted by a keyless policy with its release workflow's identity and refused by one with another subject
  # The drill's one test that is not concurrent, which Chainsaw runs before every concurrent test: on the dev path the
  # case runs while the policy is still in Audit, before any other case puts it in Enforce and back, as the bash drill
  # ran it first. The other cases then run one at a time (execution.parallel 1 in deploy/k8s/drills/.chainsaw.yaml).
  concurrent: false
  # Namespace svp exists: Chainsaw neither creates nor deletes it.
  namespace: svp
  steps:
  - name: k-setup
    description: (k) Chainsaw on k3d-svp, the policy ready, its webhooks noted; the case runs with the policy in Audit (the dev path, enforceTmp)
    try:
    - script:
        shell: bash
        env: &env
        - name: CASE
          value: k
        - name: CALLER_KUBECONFIG
          value: (env('KUBECONFIG'))
        - name: UNSIGNED
          value: (to_string($values.unsigned || ''))
        - name: VULNERABLE
          value: (to_string($values.vulnerable || ''))
        - name: NO_PROVENANCE
          value: (to_string($values.noProvenance || ''))
        - name: ENFORCE_TMP
          value: (to_string($values.enforceTmp || ''))
        content: |
          . ../lib.sh
          preflight
          if [ "$(st mode)" = Deny ]; then
            skip "the policy is in Enforce, which refuses a vendor's image by its prefix; case a shows the keyless path with the project's own identity"
          else
            enforce_tmp_allowed
          fi
    cleanup:
    - script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          webhooks_back
  - name: k-policies
    description: (k) temporary policies svp-drill-keyless-right and svp-drill-keyless-wrong ready with their webhooks; they differ in the subject only
    try:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the temporary keyless policies" || exit 0
          for which in right wrong; do
            subject=$vendor_subject
            [[ $which == wrong ]] && subject=${vendor_subject%@*}@refs/heads/main
            cat >"$work/policy.yaml" <<EOF
          apiVersion: policies.kyverno.io/v1
          kind: ImageValidatingPolicy
          metadata:
            name: svp-drill-keyless-$which
          spec:
            validationActions: [Deny]
            failurePolicy: Fail
            evaluation:
              background:
                enabled: false
            autogen:
              podControllers:
                controllers: []
            matchConstraints:
              namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: svp
              objectSelector:
                matchLabels:
                  svp-drill: keyless-$which
              resourceRules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
            matchImageReferences:
              - glob: "ghcr.io/cloudnative-pg/cloudnative-pg*"
            # As svp-images: a verification Kyverno has not cached can take most of the default 10 s.
            webhookConfiguration:
              timeoutSeconds: 30
            validationConfigurations:
              mutateDigest: false
              verifyDigest: true
              required: true
            attestors:
              - name: vendor
                cosign:
                  keyless:
                    identities:
                      - issuer: $github_issuer
                        subject: $subject
            validations:
              - expression: (images.containers + images.initContainers).all(i, verifyImageSignatures(i, [attestors.vendor]) > 0)
                message: no keyless signature by $subject
          EOF
            apply_policy "svp-drill-keyless-$which" "$work/policy.yaml"
          done
          ok "(k) temporary policies svp-drill-keyless-right and svp-drill-keyless-wrong ready"
    cleanup:
    - script:
        shell: bash
        timeout: 5m
        env: *env
        content: |
          . ../lib.sh
          delete_temp_policies
  - name: k-keyless-right
    description: (k) the vendor's image under the policy with its release workflow's identity, admitted
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the vendor's image with the right subject" || exit 0
          dry_run drill-supplychain-k svp "$vendor_image" keyless-right
          admitted "CloudNativePG's operator v1.28.1 with its release workflow's identity ($vendor_subject)"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (k) ') || contains($stdout, 'not run, the case is SKIP above')): true
  - name: k-keyless-wrong
    description: (k) the same image under the policy with the subject on refs/heads/main, refused with that policy's message
    try:
    - continueOnError: true
      script:
        shell: bash
        env: *env
        content: |
          . ../lib.sh
          not_skipped "the vendor's image with a wrong subject" || exit 0
          dry_run drill-supplychain-k svp "$vendor_image" keyless-wrong
          refused "no keyless signature by ${vendor_subject%@*}@refs/heads/main" "the same image with the subject on refs/heads/main"
          finish
        check:
          ($error == null): true
          (contains($stdout, 'PASS  (k) ') || contains($stdout, 'not run, the case is SKIP above')): true
