{{- /*
Canary of a release with canary set: the Rollout's strategy, Service <release>-canary, and AnalysisTemplates
<release>-canary (background) and <release>-canary-gate (before 100%) deciding from Envoy's metrics to promote or abort.
*/}}

{{- /*
The canary backend has an Envoy cluster of its own only because each backendRef of the route carries a filter (otherwise
both Services share one cluster, which no metric can tell apart); its counters exist while its weight is above 0.
*/}}
{{- define "svp-service.canaryCluster" -}}
httproute/{{ .Release.Namespace }}/{{ include "svp-service.routeName" . }}/rule/0/backend/1
{{- end }}

{{- /*
spec of the Rollout beside selector and template. The background run alone cannot keep a canary from 100%: the steps do
not wait for it, and it ends Successful whatever it measured when the Rollout completes.
*/}}

{{- /*
The gate promotes: its AnalysisRun measures once more over the last minute at 50%, and the step completes only when that
run is Successful, so 100% follows a valid measurement of each metric.
*/}}

{{- /*
A failed or errored AnalysisRun aborts the Rollout: the route goes back to 100/0 at once, the canary pods go 30 s later,
the stable pods are never touched. An inconclusive one pauses it until someone resumes or aborts it; it never promotes.
*/}}

{{- /*
A step that cannot complete (a canary pod never ready) aborts the Rollout after 600 s (progressDeadlineAbort); the
deadline does not run while paused or during the gate (an analysis step is indefinite), and the gate ends within 50 s.
*/}}
{{- define "svp-service.canaryStrategy" -}}
progressDeadlineSeconds: 600
progressDeadlineAbort: true
strategy:
  canary:
    stableService: {{ .Release.Name }}
    canaryService: {{ .Release.Name }}-canary
    trafficRouting:
      plugins:
        argoproj-labs/gatewayAPI:
          httpRoute: {{ include "svp-service.routeName" . }}
          namespace: {{ .Release.Namespace }}
    analysis:
      templates:
        - templateName: {{ .Release.Name }}-canary
      startingStep: 0
    steps:
      - setWeight: 25
      - pause: {duration: 60s}
      - setWeight: 50
      - pause: {duration: 60s}
      - analysis:
          templates:
            - templateName: {{ .Release.Name }}-canary-gate
{{- end }}

{{- /*
Two metrics of the canary backend over the last minute, in two AnalysisTemplates that differ in when they measure:
<release>-canary (background) every 30 s from 60 s after the canary starts, once a full window has reached it.
*/}}

{{- /*
failureLimit 1 lets one bad measurement pass. <release>-canary-gate measures once (count 1) with failureLimit 0, since a
single measurement has no stray one to let pass. inconclusiveLimit 0 in both: the first inconclusive stops the Rollout.
*/}}

{{- /*
Each query answers -1 while the canary has had fewer than 30 responses that are not 4xx in the window: Inconclusive, so
the canary is not promoted. 4xx stay out of the ratio's denominator so they do not dilute the 5xx.
*/}}

{{- /*
Drill traffic that is mostly 401 or 429 (expired tokens, rate limited) does not reach 30, so a broken canary cannot pass
on broken traffic.
*/}}

{{- /*
A query Prometheus does not answer, or answers with an error, is an Error measurement, retried 10 s after it ends; three
in a row (consecutiveErrorLimit 2) abort the Rollout.
*/}}

{{- /*
timeout 10 gives up a hanging query after 10 s, not the default 30 s: with 30 s the background run's errors came only at
about 90 and 130, after the steps had run out, and it was stopped Successful without a measurement.
*/}}

{{- /*
The limits are the release's canaryLimits, p99Ms and errorRatio. Envoy's default histogram buckets are coarse (100, 250,
500, 1000 ms), so the p99 is an interpolation between two of them and the 5xx ratio is the main criterion.
*/}}

{{- /* Design notes: docs/explanation/deployment.md. */}}
{{- define "svp-service.canaryCadence" -}}
{{- if . }}
count: 1
failureLimit: 0
{{- else }}
interval: 30s
initialDelay: 60s
failureLimit: 1
{{- end }}
consecutiveErrorLimit: 2
{{- end }}

{{- /* The metrics of both AnalysisTemplates; dict "ctx" (the chart's root context) and "gate" (true for the gate). */}}
{{- define "svp-service.canaryMetrics" -}}
{{- $c := include "svp-service.canaryCluster" .ctx }}
{{- $limits := .ctx.Values.canaryLimits }}
{{- $ratio := required (printf "canaryLimits.errorRatio is empty for release %s" .ctx.Release.Name) $limits.errorRatio }}
{{- $p99 := required (printf "canaryLimits.p99Ms is empty for release %s" .ctx.Release.Name) $limits.p99Ms }}
{{- $prom := .ctx.Values.canaryPrometheus }}
# 5xx among the canary's responses that are not 4xx.
- name: canary-5xx-ratio
  {{- include "svp-service.canaryCadence" .gate | nindent 2 }}
  successCondition: result[0] >= 0 && result[0] < {{ $ratio }}
  failureCondition: result[0] >= {{ $ratio }}
  provider:
    prometheus:
      address: {{ $prom.address }}
      {{- with $prom.sigv4Region }}
      authentication:
        sigv4:
          region: {{ . }}
      {{- end }}
      timeout: 10
      query: |
        (
          (sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name="{{ $c }}",envoy_response_code_class="5"}[1m])) or on() vector(0))
          / sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name="{{ $c }}",envoy_response_code_class!="4"}[1m]))
        )
        and on() (sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name="{{ $c }}",envoy_response_code_class!="4"}[1m])) >= 30)
        or on() vector(-1)
# p99 of the time Envoy waited for the canary's response, in ms.
- name: canary-p99-ms
  {{- include "svp-service.canaryCadence" .gate | nindent 2 }}
  successCondition: result[0] >= 0 && result[0] < {{ $p99 }}
  failureCondition: result[0] >= {{ $p99 }}
  provider:
    prometheus:
      address: {{ $prom.address }}
      {{- with $prom.sigv4Region }}
      authentication:
        sigv4:
          region: {{ . }}
      {{- end }}
      timeout: 10
      query: |
        histogram_quantile(0.99, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="{{ $c }}"}[1m])))
        and on() (sum(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name="{{ $c }}",envoy_response_code_class!="4"}[1m])) >= 30)
        or on() vector(-1)
{{- end }}

{{- if .Values.canary }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "svp-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "svp-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.protocol }}
      port: {{ .Values.port }}
      targetPort: {{ .Values.protocol }}
{{- range $gate := list false true }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $.Release.Name }}-canary{{ if $gate }}-gate{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "svp-service.labels" $ | nindent 4 }}
spec:
  metrics:
    {{- include "svp-service.canaryMetrics" (dict "ctx" $ "gate" $gate) | nindent 4 }}
{{- end }}
{{- end }}
